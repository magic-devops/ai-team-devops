[project]
name = "hermes-core"
version = "1.0.0"
description = "Hermes transactional workspace and durable execution core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.5,<3",
  "sqlalchemy>=2,<3",
  "croniter>=6,<7",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
]

[project.optional-dependencies]
team = ["psycopg[binary,pool]>=3.2,<4", "langgraph-checkpoint-postgres>=3,<4"]
test = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6", "cryptography>=42"]

[project.scripts]
hermes-core = "hermes_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_core"]
