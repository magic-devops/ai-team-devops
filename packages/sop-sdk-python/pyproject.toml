[project]
name = "sop-sdk"
version = "1.0.0"
description = "ai-team-devops 项目侧 Python SDK（Manager 客户端 + 本地 agentd IPC）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.5",
  "tenacity>=8.2",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
keyring = ["keyring>=24.0"]
async = ["anyio>=4.3"]
all = ["keyring>=24.0", "anyio>=4.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sop_sdk"]
