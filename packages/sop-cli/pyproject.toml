[project]
name = "sop-cli"
version = "2.0.0-dev"
description = "ai-team-devops 统一 CLI（init / login / agentd / task / rule / sync / doctor / llm）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "sop-sdk>=2.0.0-dev",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]
keyring = ["keyring>=24.0"]
all = ["textual>=0.60", "keyring>=24.0"]

[project.scripts]
sop = "sop_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sop_cli"]
