[project]
name = "sop-cli"
version = "1.0.0"
description = "ai-team-devops 统一 CLI（init / login / context / memory / status / agentd / task / rule / sync / doctor / llm）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "sop-sdk>=1.0.0,<2",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]
keyring = ["keyring>=24.0"]
ws = ["websockets>=12.0"]
all = ["textual>=0.60", "keyring>=24.0", "websockets>=12.0"]

[project.scripts]
sop = "sop_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sop_cli"]

[tool.hatch.build.targets.wheel.force-include]
"sop_cli/completions/sop.bash" = "sop_cli/completions/sop.bash"
