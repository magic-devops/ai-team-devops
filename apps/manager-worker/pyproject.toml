[project]
name = "sop-manager-worker"
version = "1.0.0"
description = "Manager 异步任务进程：HTTP 健康探活与可选 Redis Streams 消费骨架"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[project.scripts]
sop-worker = "sop_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sop_worker"]
