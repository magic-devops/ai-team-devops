*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── 布局 ─────────────────────────────────────────────────────── */
.app-shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:var(--header-h);background:var(--bg2);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);
  display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:20}
.topbar-crumb{font-size:12px;color:var(--text3);font-weight:600;max-width:min(160px,22vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-brand{display:flex;align-items:center;gap:10px;min-width:0;user-select:none}
.topbar-logo-img{width:32px;height:32px;border-radius:10px;object-fit:cover;flex-shrink:0;
  box-shadow:0 2px 10px rgba(59,130,246,.28),inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent);
  transition:box-shadow .2s,transform .2s}
.topbar-brand:hover .topbar-logo-img{box-shadow:0 4px 18px rgba(59,130,246,.4);transform:translateY(-1px)}
.topbar-logo{font-size:15px;font-weight:800;background:linear-gradient(105deg,var(--accent) 0%,#22d3ee 55%,var(--accent2) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--accent);
  letter-spacing:-.4px;white-space:nowrap}
[data-theme=light] .topbar-logo{-webkit-text-fill-color:transparent}
.topbar-badge{background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;justify-content:flex-end;flex:1;min-width:0;max-width:min(720px,70vw);overflow:hidden}
.topbar-tools{display:flex;align-items:center;gap:8px;flex-shrink:1;min-width:0;overflow:hidden}
.topbar-user{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0;white-space:nowrap}
.topbar-hub-btn{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:650;
  border:1px solid color-mix(in srgb,var(--accent) 38%,var(--border));
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--bg2)),var(--bg2));
  color:var(--text);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 8%,transparent),0 2px 10px rgba(0,0,0,.12);
  transition:transform .15s,box-shadow .2s,border-color .2s;
}
.topbar-hub-btn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));box-shadow:0 0 20px color-mix(in srgb,var(--accent) 18%,transparent)}
.topbar-hub-btn:active{transform:scale(.98)}
.topbar-hub-ic{font-size:14px;line-height:1;opacity:.95}
[data-theme=contrast] .topbar-hub-btn{border-width:2px}
.datahub-modal .datahub-intro{font-size:12px;color:var(--text2);line-height:1.65;margin:0 0 14px}
.datahub-modal h4{font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 8px}
.datahub-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);margin-bottom:6px;background:var(--bg3)}
.datahub-row input{margin-top:3px;accent-color:var(--accent)}
.datahub-row .dh-label{flex:1;min-width:0}
.datahub-row .dh-label strong{display:block;font-size:13px;color:var(--text)}
.datahub-row .dh-label span{display:block;font-size:11px;color:var(--text3);margin-top:2px;line-height:1.45}
.datahub-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.datahub-note{font-size:11px;color:var(--text3);margin-top:10px;line-height:1.5}
.datahub-preview{font-size:11px;background:var(--surface-code);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:8px;max-height:120px;overflow:auto}
.topbar-project{font-size:12px;color:var(--text3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-health{font-size:11px;display:flex;align-items:center;gap:6px;margin-left:8px;margin-right:4px;color:var(--text2);white-space:nowrap}
.topbar-health .health-dot{width:8px;height:8px;border-radius:50%;background:#64748b;flex-shrink:0}
.topbar-health.ok .health-dot{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.45)}
.topbar-health.down .health-dot{background:#ef4444}
.topbar-health.checking .health-dot{background:#eab308;animation:pulse-dot 1.2s ease-in-out infinite}
@keyframes pulse-dot{50%{opacity:.45}}
.help-kbd{font-family:ui-monospace,monospace;font-size:11px;background:var(--bg3);padding:2px 6px;border-radius:4px;border:1px solid var(--border);color:var(--text)}

.body-wrap{display:flex;flex:1;overflow:hidden;min-height:0}

/* 细滚动条（侧栏 + 主区），避免系统默认粗白条 */
.scroll-slim{scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.35) transparent}
.scroll-slim::-webkit-scrollbar{width:7px;height:7px}
.scroll-slim::-webkit-scrollbar-track{background:transparent}
.scroll-slim::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.scroll-slim::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.42);background-clip:padding-box}

/* ── 侧边栏 ───────────────────────────────────────────────────── */
.sidebar{width:var(--sidebar-w);min-height:0;flex-shrink:0;
  background:linear-gradient(180deg,var(--bg2) 0%,color-mix(in srgb,var(--bg2) 88%,#020617) 100%);
  border-right:1px solid var(--border);box-shadow:2px 0 12px rgba(0,0,0,.12);
  display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:width .22s ease}
.sidebar.collapsed{width:52px}
.sidebar-group{padding:4px 0 10px}
.sidebar-group-label{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.04em;
  padding:14px 16px 6px;white-space:nowrap;overflow:hidden;border-top:1px solid transparent}
.sidebar-group:first-child .sidebar-group-label{border-top:none;padding-top:8px}
.sidebar-group:first-child .sidebar-group-head{margin-top:4px}
.sidebar.collapsed .sidebar-group-label{display:none}
.sidebar-group-head{display:flex;align-items:center;gap:6px;width:calc(100% - 12px);margin:6px 8px 4px 4px;padding:8px 10px;border:none;border-radius:10px;
  background:transparent;font:inherit;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.04em;cursor:pointer;text-align:left;
  transition:background .15s,color .15s}
.sidebar-group-head:hover{background:rgba(148,163,184,.1);color:var(--text2)}
.sidebar-group-head:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sidebar-chevron{font-size:9px;width:14px;flex-shrink:0;opacity:.8;color:var(--text3);font-family:ui-sans-serif,system-ui,sans-serif}
[data-theme=light] .sidebar-group-head:hover{background:rgba(59,130,246,.08)}
.sidebar-item{display:flex;align-items:center;gap:10px;margin:1px 8px 1px 4px;padding:8px 12px;cursor:pointer;
  border-radius:10px;font-size:13px;color:var(--text2);transition:background .16s,color .16s,box-shadow .16s;white-space:nowrap;border-left:none}
.sidebar-item:hover{background:rgba(148,163,184,.1);color:var(--text)}
.sidebar-item.active{background:linear-gradient(90deg,rgba(59,130,246,.2),rgba(59,130,246,.06));color:var(--text);
  box-shadow:inset 3px 0 0 var(--accent),0 1px 0 rgba(255,255,255,.04);font-weight:600}
.sidebar-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sidebar-icon{font-size:16px;flex-shrink:0;width:22px;text-align:center;opacity:.95}
.sidebar.collapsed .sidebar-item{justify-content:center;margin:2px 6px;padding:9px 8px}
.sidebar.collapsed .sidebar-item span:last-child{display:none}
.sidebar-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:6px 12px}

[data-theme=light] .sidebar{background:linear-gradient(180deg,var(--bg2) 0%,#f1f5f9 100%);box-shadow:2px 0 8px rgba(15,23,42,.06)}
[data-theme=light] .sidebar-item:hover{background:rgba(59,130,246,.08)}
[data-theme=light] .sidebar-item.active{background:linear-gradient(90deg,rgba(59,130,246,.12),rgba(59,130,246,.04))}
[data-theme=light] .scroll-slim{scrollbar-color:rgba(100,116,139,.4) transparent}
[data-theme=light] .scroll-slim::-webkit-scrollbar-thumb{background:rgba(100,116,139,.28)}
[data-theme=light] .scroll-slim::-webkit-scrollbar-thumb:hover{background:rgba(100,116,139,.45)}

/* Vibe IDE：Markdown / 文档预览 */
.vibe-md-view{line-height:1.65;font-size:13px;color:var(--text);word-break:break-word}
.vibe-md-view h1,.vibe-md-view h2,.vibe-md-view h3,.vibe-md-view h4{margin:.85em 0 .45em;font-weight:700;line-height:1.25}
.vibe-md-view h1{font-size:1.35em}.vibe-md-view h2{font-size:1.2em}.vibe-md-view h3{font-size:1.08em}
.vibe-md-view pre{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;overflow:auto;font-size:12px;margin:.6em 0}
.vibe-md-view pre code{background:transparent;padding:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.vibe-md-view code:not(pre code){background:var(--bg3);padding:2px 6px;border-radius:4px;font-family:ui-monospace,monospace;font-size:12px}
.vibe-md-view p{margin:.55em 0}
.vibe-md-view ul,.vibe-md-view ol{margin:.45em 0;padding-left:1.35em}
.vibe-md-view li{margin:.2em 0}
.vibe-md-view blockquote{border-left:3px solid var(--accent);margin:.55em 0;padding:.2em 0 .2em 12px;color:var(--text2)}
.vibe-md-view table{border-collapse:collapse;font-size:12px;margin:.65em 0;width:100%}
.vibe-md-view th,.vibe-md-view td{border:1px solid var(--border);padding:6px 8px;text-align:left}
.vibe-md-view a{color:var(--accent)}
.vibe-md-view img{max-width:100%;height:auto;border-radius:6px}

/* ── 主内容 ───────────────────────────────────────────────────── */
.main-content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 26px 28px;background:var(--bg);scroll-behavior:smooth}
.main-content.scroll-slim{padding-right:22px}
.app-main{min-height:min(100%,calc(100dvh - var(--header-h) - 24px))}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-enter{animation:pageIn .28s ease-out both}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.page-title{font-size:18px;font-weight:700;color:var(--text)}

/* ── 通用组件 ─────────────────────────────────────────────────── */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;
  transition:box-shadow .2s,border-color .2s,transform .2s}
[data-theme=light] .card,[data-theme=contrast] .card{box-shadow:var(--shadow-sm)}
[data-theme=light] .list-item:hover,[data-theme=contrast] .list-item:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.grid-4>.card,.grid-2>.card{position:relative;overflow:hidden}
.grid-4>.card::after,.grid-2>.card::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:12px;opacity:0;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent);transition:opacity .25s}
.grid-4>.card:hover::after,.grid-2>.card:hover::after{opacity:1}
.card h3{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:600}
.stat-val{font-size:28px;font-weight:700;color:var(--text)}
.stat-sub{font-size:12px;color:var(--text3);margin-top:2px}
.progress-bar{background:var(--border);border-radius:4px;height:6px;margin:8px 0}
.progress-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .3s}

/* ── 标签 ─────────────────────────────────────────────────────── */
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
.tag-p0{background:#7f1d1d;color:#fca5a5}.tag-p1{background:#7c2d12;color:#fdba74}
.tag-p2{background:#1e3a5f;color:#93c5fd}.tag-p3{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.tag-done{background:#14532d;color:#86efac}.tag-progress{background:#1e3a5f;color:#93c5fd}
.tag-blocked{background:#7f1d1d;color:#fca5a5}.tag-pending{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.tag-open{background:#7c2d12;color:#fdba74}.tag-resolved{background:#14532d;color:#86efac}

/* ── 列表 ─────────────────────────────────────────────────────── */
.list-item{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;
  transition:background .15s}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.list-item .title{font-size:13px;color:var(--text);flex:1}
.list-item .meta{font-size:11px;color:var(--text3);margin-top:2px}

/* ── 按钮 ─────────────────────────────────────────────────────── */
.btn{padding:6px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:transform .12s,box-shadow .15s,background .15s,opacity .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn-primary:hover:not(:disabled){background:var(--accent2);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-warn{background:#f59e0b;color:#000}.btn-warn:hover{background:#d97706}
.btn-sm{padding:3px 9px;font-size:11px}
.btn-cancel{background:var(--border);color:var(--text)}
.btn-icon{background:none;border:1px solid var(--border);color:var(--text2);padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .15s,color .15s,border-color .15s}
.btn-icon:hover{background:var(--bg3);color:var(--text)}
.btn-icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 语义化：避免各页硬编码 slate 色，随主题切换 */
.btn-muted{background:var(--btn-muted-bg);color:var(--btn-muted-fg2);border:1px solid var(--btn-muted-border)}
.btn-muted:hover:not(:disabled){color:var(--btn-muted-fg);filter:brightness(1.06)}
.btn-muted:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-danger{background:#7f1d1d;color:#fca5a5;border:1px solid #991b1b}
.btn-danger:hover:not(:disabled){filter:brightness(1.08)}
.btn-soft{background:var(--btn-accent-soft-bg);color:var(--btn-accent-soft-fg);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border))}
.btn-soft:hover:not(:disabled){filter:brightness(1.08)}
.input-surface,.textarea-surface{background:var(--surface-input);border:1px solid var(--border-strong);color:var(--text);border-radius:7px}
.input-surface::placeholder,.textarea-surface::placeholder{color:var(--text3)}
.code-surface{background:var(--surface-code);border:1px solid var(--border-strong);color:var(--text);border-radius:8px}
.text-secondary{color:var(--text2)}.text-tertiary{color:var(--text3)}
.vibe-tree-icon-dir{color:var(--tree-dir)}.vibe-tree-icon-file{color:var(--text2)}
.vibe-tree-name{color:var(--tree-file);margin-left:6px;font-weight:500}
.vibe-list-selected{background:var(--list-select-bg)!important;box-shadow:inset 3px 0 0 color-mix(in srgb,var(--accent) 65%,transparent)}
.vibe-list-selected .title{color:var(--text)!important}
.vibe-list-selected .meta{color:var(--text2)!important}
/* 规范/自定义文件树 + 纯文本预览（禁止 #e2e8f0 贴白底导致不可读） */
.file-browser-cat{font-size:11px;color:var(--text3);text-transform:uppercase;padding:10px 0 6px;font-weight:700;border-bottom:1px solid var(--border);letter-spacing:.04em}
.file-browser-row{cursor:pointer;border-radius:8px;transition:background .15s,box-shadow .15s}
.file-browser-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.doc-path-bar{font-size:11px;color:var(--text3);margin-bottom:10px;padding:6px 0;border-bottom:1px solid var(--border);word-break:break-all;font-family:ui-monospace,monospace}
.doc-plain-pre{margin:0;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--text);background:var(--surface-code);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.doc-plain-pre--compact{font-size:12px;padding:12px;max-height:min(70vh,560px);overflow:auto}
.doc-plain-pre--log{font-size:11px;padding:10px 12px;max-height:220px;overflow:auto;margin-top:8px}
.doc-plain-pre--stderr{color:var(--toast-err);border-color:color-mix(in srgb,var(--toast-err) 28%,var(--border));background:color-mix(in srgb,var(--toast-err) 6%,var(--surface-code))}
.panel-scroll{max-height:min(620px,72vh);overflow-y:auto}
.doc-fetch-hint{padding:28px 20px;text-align:center;color:var(--text3);font-size:13px}
.doc-fetch-hint::before{content:'';display:block;width:28px;height:28px;margin:0 auto 10px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
.dev-stage-nav-btn{min-width:132px;flex-shrink:0;cursor:pointer;text-align:left;border-radius:12px;padding:14px 16px!important;
  border:1px solid var(--stage-nav-border)!important;background:var(--stage-nav-bg)!important;box-shadow:var(--shadow-sm);transition:box-shadow .2s,border-color .2s,transform .12s}
.dev-stage-nav-btn:hover{box-shadow:var(--shadow-md);border-color:var(--accent)!important}
.dev-stage-nav-btn:active{transform:scale(.98)}
.dev-stage-nav-title{font-weight:700;font-size:13px;color:var(--stage-nav-title)}
.dev-stage-nav-sub{font-size:11px;color:var(--stage-nav-sub);margin-top:4px;line-height:1.35}
.flow-hint{padding:8px 10px;border-radius:8px;font-size:12px;margin-bottom:6px;color:var(--hint-fg);line-height:1.45}
.flow-hint--err{background:var(--hint-err-bg)}.flow-hint--warn{background:var(--hint-warn-bg)}.flow-hint--info{background:var(--hint-info-bg)}
.topbar-select{font-size:11px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:4px 8px;max-width:118px;cursor:pointer}
.topbar-select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ── 表单 ─────────────────────────────────────────────────────── */
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-group select,.form-group textarea,.form-group input{
  width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:8px 10px;border-radius:7px;font-size:13px;outline:none;transition:border .15s}
.form-group select:focus,.form-group textarea:focus,.form-group input:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}

/* ── 弹窗 ─────────────────────────────────────────────────────── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;
  backdrop-filter:blur(4px);animation:fadeBg .2s ease-out}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px;width:440px;max-width:92vw;max-height:85vh;overflow-y:auto;
  box-shadow:0 24px 64px rgba(0,0,0,.45);animation:modalPop .22s cubic-bezier(.2,.9,.2,1)}
@keyframes modalPop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--text)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ── 其他 ─────────────────────────────────────────────────────── */
.section-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.empty{color:var(--text3);font-size:13px;padding:32px;text-align:center}
.alert{background:#7f1d1d;border:1px solid #991b1b;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#fca5a5}
.reflect-box{background:var(--bg3);border-radius:6px;padding:10px;font-size:12px;color:var(--text2);font-family:monospace;white-space:pre-wrap;max-height:120px;overflow-y:auto}
.confidence-bar{display:flex;align-items:center;gap:8px}
.confidence-val{font-size:12px;font-weight:700;min-width:36px}
.conf-high{color:#86efac}.conf-mid{color:#fdba74}.conf-low{color:#fca5a5}
.refresh-btn{background:var(--bg3);color:var(--text2);border:1px solid var(--border);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;
  display:inline-flex;align-items:center;gap:6px;transition:color .15s,background .15s,border-color .15s}
.refresh-btn:hover:not(:disabled){color:var(--text);background:var(--bg2);border-color:var(--accent)}
.refresh-btn:disabled{opacity:.6;cursor:wait}
.refresh-btn .refresh-icon{display:inline-block;transition:transform .35s ease}
.refresh-btn.busy .refresh-icon{animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 骨架屏 */
.skeleton-wrap{padding:8px 0}
.skeleton-line{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--skeleton) 0%,var(--skeleton-shine) 50%,var(--skeleton) 100%);
  background-size:200% 100%;animation:shimmer 1.1s ease-in-out infinite;margin-bottom:10px}
.skeleton-line.short{width:45%}.skeleton-line.mid{width:70%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-card{height:88px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);margin-bottom:12px;
  background:linear-gradient(90deg,var(--bg2) 0%,color-mix(in srgb,var(--text2) 12%,var(--bg2)) 50%,var(--bg2) 100%);background-size:200% 100%;animation:shimmer 1.2s ease-in-out infinite}

/* Toast */
.toast-host{position:fixed;top:calc(var(--header-h) + 10px);right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;min-width:220px;max-width:360px;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:500;
  box-shadow:var(--shadow-md);animation:toastIn .28s cubic-bezier(.2,.9,.2,1);border:1px solid var(--border);background:var(--bg2);color:var(--text)}
@keyframes toastIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.toast.ok{border-left:4px solid var(--toast-ok)}
.toast.err{border-left:4px solid var(--toast-err)}
.toast.info{border-left:4px solid var(--toast-info)}
/* 主题亮色适配 */
[data-theme=light] .tag-p3,[data-theme=light] .tag-pending{background:#f1f5f9;color:#64748b}
[data-theme=light] .modal{box-shadow:0 8px 30px rgba(0,0,0,.15)}

@media (prefers-reduced-motion: reduce) {
  .page-enter,.toast,.modal,.refresh-btn.busy .refresh-icon,.skeleton-line,.skeleton-card{animation:none!important}
  .sidebar-item,.btn,.card,.list-item{transition:none!important}
  .doc-fetch-hint::before{animation:none!important;opacity:.45}
}

<body>
<div id="root"></div>
<script type="text/babel">
const API = (typeof window !== 'undefined' && window.location && (window.location.protocol === 'http:' || window.location.protocol === 'https:'))
  ? (window.location.origin.replace(/\/$/, '') + '/api/v1')
  : 'http://localhost:8765/api/v1';

// ── 认证：token 检查 + 自动跳转登录 ─────────────────────────────
(function(){
  var token = '';
  try { token = localStorage.getItem('sop-token') || ''; } catch(e) {}
  if (!token) { window.location.replace('login.html'); return; }
  // 验证 token 有效性（静默，失败则跳转）
  fetch(API + '/auth/me', { headers: { Authorization: 'Bearer ' + token } })
    .then(function(r) { if (!r.ok) { localStorage.removeItem('sop-token'); window.location.replace('login.html'); } })
    .catch(function() {});
})();

// ── 全局认证工具 ──────────────────────────────────────────────────
window.authHeaders = function() {
  var h = {};
  try {
    var token = localStorage.getItem('sop-token') || '';
    if (token) h['Authorization'] = 'Bearer ' + token;
    var pid = (localStorage.getItem('sop-current-project-id') || '').trim();
    if (pid) h['X-Project-Id'] = pid;
  } catch (e) {}
  return h;
};
window.__ADMIN_MODE__ = (function() {
  try { return localStorage.getItem('sop-admin-mode') || 'single'; } catch(e) { return 'single'; }
})();
window.__CURRENT_USER__ = (function() {
  try { return JSON.parse(localStorage.getItem('sop-user') || 'null'); } catch(e) { return null; }
})();

/** 将根相对路径解析到 API 基址：/foo -> ${API}/foo；/api/... -> origin + 该绝对路径（避免重复拼接） */
function resolveApiInput(input) {
  if (typeof input !== 'string') return input;
  if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(input) || input.startsWith('//')) return input;
  if (input.startsWith('/api/')) {
    var o = (typeof window !== 'undefined' && window.location && window.location.origin) ? String(window.location.origin).replace(/\/$/, '') : '';
    return o ? (o + input) : input;
  }
  if (input.charAt(0) === '/') return API.replace(/\/$/, '') + input;
  return input;
}

/** 统一超时与 Abort，自动注入 Authorization + X-Project-Id */
function apiFetch(input, init) {
  const opts = init || {};
  const timeoutMs = opts.timeoutMs != null ? opts.timeoutMs : 32000;
  const ctrl = new AbortController();
  const tid = setTimeout(function () { ctrl.abort(); }, timeoutMs);
  var next = Object.assign({}, opts);
  delete next.timeoutMs;
  next.signal = ctrl.signal;
  // 自动注入 token
  var token = '';
  try { token = localStorage.getItem('sop-token') || ''; } catch(e) {}
  if (token) {
    next.headers = Object.assign({ 'Authorization': 'Bearer ' + token }, next.headers || {});
  }
  var projId = '';
  try { projId = (localStorage.getItem('sop-current-project-id') || '').trim(); } catch (e) {}
  if (projId) {
    next.headers = Object.assign({ 'X-Project-Id': projId }, next.headers || {});
  }
  var resolved = typeof input === 'string' ? resolveApiInput(input) : input;
  return fetch(resolved, next).then(function(r) {
    if (r.status === 401) { localStorage.removeItem('sop-token'); window.location.replace('login.html'); }
    if (r.status === 403) {
      var tr403 = (typeof window.t === 'function' ? window.t : function (k) { return k; });
      r.clone().json().then(function (j) {
        var msg = (j && j.detail != null) ? String(j.detail) : tr403('idx_api_forbidden');
        showToast(msg, 'err');
        try { window.dispatchEvent(new CustomEvent('devdash-api-forbidden', { detail: { message: msg } })); } catch (e2) {}
      }).catch(function () {
        showToast(tr403('idx_api_forbidden'), 'err');
      });
    }
    clearTimeout(tid);
    return r;
  }).catch(function(e) { clearTimeout(tid); throw e; });
}
window.apiFetch = apiFetch;

function showToast(message, type) {
  window.dispatchEvent(new CustomEvent('devdash-toast', { detail: { message, type: type || 'info' } }));
}

function PageSkeleton({cards = 4}) {
  const langTick = typeof window.useLangTick === 'function' ? window.useLangTick() : 0;
  void langTick;
  const tr = (k, v) => (typeof window.t === 'function' ? window.t(k, v) : k);
  return <div className="skeleton-wrap page-enter" aria-busy="true" aria-label={tr('gen_loading')}>
    <div className="grid-4" style={{marginBottom: 16}}>
      {[...Array(cards)].map((_, i) => <div key={i} className="skeleton-card" />)}
    </div>
    <div className="card" style={{ padding: '18px 20px' }}>
      {[...Array(5)].map((_, j) => <div key={j} className={'skeleton-line ' + (j % 3 === 0 ? 'short' : 'mid')} />)}
    </div>
  </div>;
}

function LoadError({message, onRetry}) {
  const langTick = typeof window.useLangTick === 'function' ? window.useLangTick() : 0;
  void langTick;
  const tr = (k, v) => (typeof window.t === 'function' ? window.t(k, v) : k);
  return <div className="card page-enter" style={{ borderLeft: '4px solid var(--toast-err)', padding: '20px 22px' }}>
    <div className="section-title">{tr('gen_load_fail')}</div>
    <p style={{ color: 'var(--text2)', fontSize: 13, marginBottom: 14, lineHeight: 1.5 }}>{message || tr('idx_load_hint')}</p>
    {onRetry && <button type="button" className="btn btn-primary btn-sm" onClick={onRetry}>{tr('idx_retry')}</button>}
  </div>;
}

function RefreshBtn({onClick, children}) {
  const langTick = typeof window.useLangTick === 'function' ? window.useLangTick() : 0;
  void langTick;
  const tr = (k, v) => (typeof window.t === 'function' ? window.t(k, v) : k);
  const [busy, setBusy] = React.useState(false);
  const run = () => {
    if (busy) return;
    setBusy(true);
    Promise.resolve()
      .then(function () { return onClick && onClick(); })
      .catch(function () {})
      .finally(function () { setTimeout(function () { setBusy(false); }, 200); });
  };
  return <button type="button" className={'refresh-btn' + (busy ? ' busy' : '')} disabled={busy} onClick={run}>
    <span className="refresh-icon" aria-hidden="true">↻</span>{children === undefined ? tr('gen_refresh') : children}
  </button>;
}

function useFetch(url) {
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const load = React.useCallback(function () {
    setLoading(true);
    setError(null);
    return apiFetch(url, { timeoutMs: 32000 })
      .then(function (r) {
        if (!r.ok) {
          return r.text().then(function (txt) {
            var detail = 'HTTP ' + r.status;
            try {
              var j = JSON.parse(txt);
              if (j && (j.detail != null || j.message != null)) detail = String(j.detail != null ? j.detail : j.message);
            } catch (_) {}
            throw new Error(detail);
          });
        }
        return r.json();
      })
      .then(function (d) {
        setData(d);
        setLoading(false);
        return d;
      })
      .catch(function (err) {
        var tr = (typeof window.t === 'function' ? window.t : function (k) { return k; });
        var msg = tr('idx_api_unreachable');
        if (err && err.name === 'AbortError') msg = tr('idx_fetch_timeout');
        else if (err && err.message) msg = String(err.message);
        setError(msg);
        setLoading(false);
        setData(null);
        throw err;
      });
  }, [url]);
  React.useEffect(function () {
    function onProj() {
      load().catch(function () {});
    }
    window.addEventListener('devdash-project-change', onProj);
    return function () {
      window.removeEventListener('devdash-project-change', onProj);
    };
  }, [load]);
  React.useEffect(function () { load().catch(function () {}); }, [load]);
  return { data, loading, error, reload: load };
}

/** 兼容：部分列表接口返回 { items, total, page }，UI 仍用数组 */
function normalizeListPayload(d) {
  if (d == null) return [];
  if (Array.isArray(d)) return d;
  if (typeof d === 'object' && d.items != null && Array.isArray(d.items)) return d.items;
  return [];
}

/** 拉取 specs/custom 文件内容 JSON（带超时与非 2xx 解析） */
function fetchFileContentJson(url) {
  return apiFetch(url, { timeoutMs: 120000 })
    .then(function (r) {
      return r.text().then(function (txt) {
        var d = {};
        try {
          d = txt ? JSON.parse(txt) : {};
        } catch (e) {
          var trJ = (typeof window.t === 'function' ? window.t : function (k) { return k; });
          throw new Error(trJ('idx_json_invalid'));
        }
        return { httpOk: r.ok, d: d };
      });
    })
    .then(function (x) {
      if (!x.httpOk) {
        var d = x.d || {};
        var trH = (typeof window.t === 'function' ? window.t : function (k) { return k; });
        var msg = typeof d.detail === 'string' ? d.detail : typeof d.message === 'string' ? d.message : trH('idx_http_err');
        throw new Error(msg);
      }
      return x.d;
    });
}

function Tag({type, label}) {

function ConfBar({val}) {

    <span className={`confidence-val ${cls}`}>{pct}%</span>
  </div>;
}

// ── 需求看板（手动录入 / AI 文档拆解 / 编辑 / 原型说明与配图） ───────────────────
const DEV_TOOL_PRESETS = ['', 'claude-code', 'cursor', 'windsurf', 'opencode', 'direct-llm', 'trae', 'vscode', 'custom'];

function Requirements() {
  const langTick = typeof window.useLangTick === 'function' ? window.useLangTick() : 0;
  void langTick;
  const tr = (k, v) => (typeof window.t === 'function' ? window.t(k, v) : k);
  const {data, loading, error, reload} = useFetch(`${API}/requirements`);
  const [detail, setDetail] = React.useState(null);
  const [editForm, setEditForm] = React.useState(null);
  const [proto, setProto] = React.useState('');
  const [protoBusy, setProtoBusy] = React.useState(false);
  const [manualOpen, setManualOpen] = React.useState(false);
  const [manualForm, setManualForm] = React.useState({title:'',description:'',priority:'P1',acceptance:'',tags:'',assigned_agent:'',dev_tool:''});
  const [docOpen, setDocOpen] = React.useState(false);
  const [docText, setDocText] = React.useState('');
  const [docBusy, setDocBusy] = React.useState(false);
  const [previewItems, setPreviewItems] = React.useState(null);
  const [selPreview, setSelPreview] = React.useState(() => new Set());
  const {data: agentsBuiltin} = useFetch(`${API}/agents/builtin`);
  const {data: agentsCustom} = useFetch(`${API}/agents`);

  const agentOptions = React.useMemo(() => {
    const defs = Array.isArray(agentsBuiltin) ? agentsBuiltin : [];
    const cus = Array.isArray(agentsCustom) ? agentsCustom : [];
    const ids = [];
    defs.forEach((a) => { if (a && a.id) ids.push(a.id); });
    cus.forEach((a) => { if (a && a.id) ids.push(a.id); });
    if (!ids.length) return ['', 'orchestrator', 'planner', 'coder-backend', 'coder-frontend', 'reviewer', 'tester', 'debugger'];
    return ['', ...ids.filter((x, i) => ids.indexOf(x) === i)];
  }, [agentsBuiltin, agentsCustom]);

  const groupByPriorityOrdered = React.useCallback((reqs) => {
    const g = {P0: [], P1: [], P2: [], P3: []};
    (reqs || []).forEach((r) => {
      const p = (r.priority || 'P3').toUpperCase();
      const k = g[p] ? p : 'P3';
      g[k].push(r);
    });
    return g;
  }, []);

  const commitReorderBoard = (gObj) => {
    const body = {
      groups: {
        P0: (gObj.P0 || []).map((r) => r.id),
        P1: (gObj.P1 || []).map((r) => r.id),
        P2: (gObj.P2 || []).map((r) => r.id),
        P3: (gObj.P3 || []).map((r) => r.id),
      },
    };
    apiFetch(`/requirements/reorder-board`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    })
      .then((r) => r.json().then((d) => ({ok: r.ok, d})))
      .then(({ok, d}) => {
        if (!ok) {
          const msg = typeof d.detail === 'string' ? d.detail : tr('req_toast_reorder_fail');
          showToast(msg, 'err');
          return;
        }
        reload();
        showToast(tr('req_toast_reorder_ok'), 'ok');
      })
      .catch(() => showToast(tr('gen_req_fail'), 'err'));
  };

  const moveReq = (id, targetP, insertBeforeId) => {
    const reqs = data || [];
    const g = groupByPriorityOrdered(reqs);
    let row = null;
    for (const p of ['P0', 'P1', 'P2', 'P3']) {
      const idx = g[p].findIndex((x) => x.id === id);
      if (idx >= 0) {
        row = g[p][idx];
        g[p].splice(idx, 1);
        break;
      }
    }
    if (!row) return;
    const tp = ['P0', 'P1', 'P2', 'P3'].includes(targetP) ? targetP : 'P3';
    if (!insertBeforeId) {
      g[tp].push({...row, priority: tp});
    } else {
      const at = g[tp].findIndex((x) => x.id === insertBeforeId);
      if (at < 0) g[tp].push({...row, priority: tp});
      else g[tp].splice(at, 0, {...row, priority: tp});
    }
    commitReorderBoard(g);
  };

  const patchReqMeta = (id, partial) => {
    apiFetch(`/requirements/${encodeURIComponent(id)}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(partial),
    })
      .then((r) => {
        if (!r.ok) throw new Error();
      })
      .then(() => {
        reload();
        showToast(tr('req_toast_updated'), 'ok');
      })
      .catch(() => showToast(tr('req_toast_update_fail'), 'err'));
  };

  React.useEffect(() => {
    if (!detail) { setProto(''); return; }
    apiFetch(`/requirements/${encodeURIComponent(detail.id)}/prototype`)
      .then((r) => r.json())
      .then((d) => setProto(d.content || ''))
      .catch(() => setProto(''));
  }, [detail && detail.id]);

  const openDetail = (r) => {
    setDetail(r);
    setEditForm({
      title: r.title || '',
      description: r.description || '',
      priority: r.priority || 'P1',
      status: r.status || 'pending',
      acceptance: Array.isArray(r.acceptance_criteria) ? r.acceptance_criteria.join('\n') : '',
      human_notes: r.human_notes || '',
      assigned_agent: r.assigned_agent || '',
      dev_tool: r.dev_tool || '',
    });
  };

  const saveDetail = () => {
    if (!detail || !editForm) return;
    const ac = editForm.acceptance.split('\n').map((s) => s.trim()).filter(Boolean);
    apiFetch(`/requirements/${encodeURIComponent(detail.id)}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        title: editForm.title,
        description: editForm.description,
        priority: editForm.priority,
        status: editForm.status,
        acceptance_criteria: ac,
        human_notes: editForm.human_notes,
        assigned_agent: editForm.assigned_agent || '',
        dev_tool: editForm.dev_tool || '',
      }),
    })
      .then((r) => { if (!r.ok) throw new Error(); })
      .then(() => {
        reload();
        setDetail((d) => (d ? {...d, title: editForm.title, description: editForm.description, priority: editForm.priority, status: editForm.status, acceptance_criteria: ac, human_notes: editForm.human_notes, assigned_agent: editForm.assigned_agent, dev_tool: editForm.dev_tool} : null));
        showToast(tr('req_toast_saved'), 'ok');
      })
      .catch(() => showToast(tr('req_toast_save_fail'), 'err'));
  };

  const deleteDetail = () => {
    if (!detail || !confirm(tr('req_confirm_del', { id: detail.id }))) return;
    apiFetch(`/requirements/${encodeURIComponent(detail.id)}`, {method: 'DELETE'})
      .then((r) => { if (!r.ok) throw new Error(); })
      .then(() => { setDetail(null); reload(); showToast(tr('req_toast_deleted'), 'ok'); })
      .catch(() => showToast(tr('req_toast_delete_fail'), 'err'));
  };

  const runPrototype = (mode, genImage) => {
    if (!detail) return;
    setProtoBusy(true);
    apiFetch(`/requirements/${encodeURIComponent(detail.id)}/prototype`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({mode, gen_image: !!genImage, extra_context: ''}),
    })
      .then((r) => r.json().then((d) => ({ok: r.ok, d})))
      .then(({ok, d}) => {
        setProtoBusy(false);
        if (!ok) {
          const msg = typeof d.detail === 'string' ? d.detail : (Array.isArray(d.detail) ? d.detail.map((x) => x.msg || x.type).join(';') : tr('req_toast_gen_fail'));
          showToast(msg, 'err');
          return;
        }
        setProto(d.content || '');
        showToast(genImage && d.image_url ? tr('req_toast_proto_img_ok') : tr('req_toast_proto_ok'), 'ok');
      })
      .catch(() => { setProtoBusy(false); showToast(tr('gen_req_fail'), 'err'); });
  };

  const saveManual = () => {
    const ac = manualForm.acceptance.split('\n').map((s) => s.trim()).filter(Boolean);
    const tags = manualForm.tags.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
    if (!manualForm.title.trim()) { showToast(tr('req_toast_title_required'), 'err'); return; }
    apiFetch(`/requirements`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
        title: manualForm.title.trim(),
        description: manualForm.description.trim(),
        priority: manualForm.priority,
        acceptance_criteria: ac,
        tags,
        assigned_agent: manualForm.assigned_agent || '',
        dev_tool: manualForm.dev_tool || '',
      }),
    })
      .then((r) => r.json().then((d) => ({ok: r.ok, d})))
      .then(({ok, d}) => {
        if (!ok) { showToast(d.detail || tr('req_toast_create_fail'), 'err'); return; }
        setManualOpen(false);
        setManualForm({title:'',description:'',priority:'P1',acceptance:'',tags:'',assigned_agent:'',dev_tool:''});
        reload();
        showToast(tr('req_toast_created'), 'ok');
      })
      .catch(() => showToast(tr('gen_req_fail'), 'err'));
  };

  const parseDoc = () => {
    if (docText.trim().length < 20) { showToast(tr('req_toast_doc_short'), 'err'); return; }
    setDocBusy(true);
    apiFetch(`/requirements/parse-document`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: docText, filename: 'upload.txt'}),
    })
      .then((r) => r.json().then((d) => ({ok: r.ok, d})))
      .then(({ok, d}) => {
        setDocBusy(false);
        if (!ok) { showToast(typeof d.detail === 'string' ? d.detail : tr('req_toast_parse_fail'), 'err'); return; }
        setPreviewItems(d.items || []);
        setSelPreview(new Set((d.items || []).map((_, i) => i)));
        showToast(tr('req_toast_parsed_n', { n: (d.items || []).length }), 'ok');
      })
      .catch(() => { setDocBusy(false); showToast(tr('gen_req_fail'), 'err'); });
  };

  const importSelected = () => {
    if (!previewItems || !previewItems.length) return;
    const items = previewItems.filter((_, i) => selPreview.has(i)).map((it) => ({
      title: it.title,
      description: it.description || '',
      priority: it.priority || 'P2',
      acceptance_criteria: it.acceptance_criteria || [],
      tags: it.tags || [],
    }));
    if (!items.length) { showToast(tr('req_toast_select_one'), 'err'); return; }
    apiFetch(`/requirements/batch`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({items}),
    })
      .then((r) => { if (!r.ok) throw new Error(); })
      .then(() => {
        setDocOpen(false);
        setDocText('');
        setPreviewItems(null);
        setSelPreview(new Set());
        reload();
        showToast(tr('req_toast_imported_n', { n: items.length }), 'ok');
      })
      .catch(() => showToast(tr('req_toast_import_fail'), 'err'));
  };

  const updatePreviewRow = (i, field, val) => {
    setPreviewItems((rows) => {
      const copy = [...(rows || [])];
      if (!copy[i]) return rows;
      copy[i] = {...copy[i], [field]: val};
      return copy;
    });
  };

  if (loading) return <PageSkeleton cards={2} />;
  if (error) return <LoadError message={error} onRetry={reload} />;
  const reqs = data || [];
  const groups = groupByPriorityOrdered(reqs);

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:8}}>
      <div>
        <div className="section-title">{tr('req_board_title')}</div>
        <div style={{fontSize:11,color:'#64748b',marginTop:4}}>{tr('req_board_hint')}</div>
      </div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        <button type="button" className="btn btn-primary btn-sm" onClick={()=>setManualOpen(true)}>{tr('req_manual_add')}</button>
        <button type="button" className="btn btn-sm" style={{background:'#4f46e5',color:'#fff'}} onClick={()=>{setDocOpen(true);setPreviewItems(null);setDocText('');}}>{tr('req_ai_doc')}</button>
        <RefreshBtn onClick={reload} />
      </div>
    </div>
    <div className="grid-2">
      {Object.entries(groups).map(([p, items]) => <div key={p} className="card scroll-slim" style={{maxHeight:520,overflowY:'auto',display:'flex',flexDirection:'column',gap:8}}
        onDragOver={(e)=>{e.preventDefault();e.dataTransfer.dropEffect='move';}}
      >
        <div className="section-title"><Tag type={p}/> <span style={{color:'#64748b',fontWeight:400}}>({items.length})</span></div>
        {items.length === 0 ? <div className="empty">{tr('idx_none')}</div> : items.map((r) => <div key={r.id}
          draggable
          onDragStart={(e)=>{e.dataTransfer.setData('text/req-id', r.id);e.dataTransfer.effectAllowed='move';}}
          className="list-item"
          style={{alignItems:'stretch',flexDirection:'column',gap:8,cursor:'grab',border:'1px solid var(--border)',borderRadius:10,padding:10,marginBottom:2}}
          onDragOver={(e)=>{e.preventDefault();e.stopPropagation();e.dataTransfer.dropEffect='move';}}
          onDrop={(e)=>{e.preventDefault();e.stopPropagation();const dragId=e.dataTransfer.getData('text/req-id');if(!dragId||dragId===r.id)return;moveReq(dragId,p,r.id);}}
        >
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
            <div style={{flex:1,cursor:'pointer',minWidth:0}} onClick={() => openDetail(r)}>
              <div className="title">{r.title}</div>
              <div className="meta">{r.id} · <Tag type={r.status === 'done' ? 'done' : (r.status || 'pending')}/></div>
              {r.description && <div className="meta" style={{color:'#94a3b8',marginTop:4,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{r.description}</div>}
              {r.human_notes && <div className="meta" style={{color:'#fbbf24'}}>💬 {r.human_notes}</div>}
            </div>
            <button type="button" className="btn btn-sm btn-primary" onClick={() => openDetail(r)}>{tr('gen_edit')}</button>
          </div>

// ── 任务追踪 ────────────────────────────────────────────────────
function Tasks() {
  const langTick = typeof window.useLangTick === 'function' ? window.useLangTick() : 0;
  void langTick;
  const tr = (k, v) => (typeof window.t === 'function' ? window.t(k, v) : k);
  const {data, loading, error, reload} = useFetch(`${API}/tasks`);
  const [modal, setModal] = React.useState(null);
  const [note, setNote] = React.useState('');

  const unblock = () => {
    apiFetch(`/tasks/${modal.id}/unblock`, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({human_notes:note})})
      .then((r) => { if (!r.ok) throw new Error(); })
      .then(()=>{setModal(null);reload();showToast(tr('task_toast_unblocked'),'ok');})
      .catch(()=>showToast(tr('task_toast_op_fail'),'err'));
  };

  if (loading) return <PageSkeleton cards={2} />;
  if (error) return <LoadError message={error} onRetry={reload} />;
  const tasks = data||[];
  const groups = {in_progress:[],blocked:[],pending:[],completed:[]};
  tasks.forEach(t=>{const s=t.status||'pending';(groups[s]||groups.pending).push(t);});

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="section-title">{tr('task_title')}</div>
      <RefreshBtn onClick={reload} />
    </div>
    {['in_progress','blocked','pending','completed'].map(s=><div key={s} className="card" style={{marginBottom:12}}>
      <div className="section-title"><Tag type={s}/> <span style={{color:'#64748b',fontWeight:400}}>({groups[s].length})</span></div>
      {groups[s].length===0?<div className="empty">{tr('task_empty')}</div>:groups[s].slice(0,20).map(tk=><div key={tk.id} className="list-item">
        <div style={{flex:1}}>
          <div className="title">{tk.title}</div>
          <div className="meta">{tk.id} · {tk.assigned_to||tr('task_meta_unassigned')} · {tr('task_meta_estimate', { est: tk.estimate||'-' })}</div>
          {tk.status==='blocked'&&<div className="meta" style={{color:'#fca5a5'}}>🚧 {tk.blocked_reason||tr('dash_reason_unknown')}</div>}
          {tk.confidence!=null&&<ConfBar val={tk.confidence}/>}
        </div>
        {tk.status==='blocked'&&<button className="btn btn-sm btn-warn" onClick={()=>{setModal(tk);setNote('');}}>{tr('task_unblock_btn')}</button>}
      </div>)}
    </div>)}
    {modal&&<div className="modal-bg" onClick={()=>setModal(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>{tr('task_unblock_modal_title')}</h3>
        <div style={{fontSize:13,color:'#94a3b8',marginBottom:12}}>{modal.title}</div>
        <div className="form-group"><label>{tr('task_label_resolution')}</label>
          <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder={tr('task_ph_resolution')}/>
        </div>
        <div className="modal-actions">
          <button className="btn btn-cancel" onClick={()=>setModal(null)}>{tr('gen_cancel')}</button>
          <button className="btn btn-primary" onClick={unblock}>{tr('task_unblock_submit')}</button>
        </div>
      </div>
    </div>}
  </>;
}

// ── 问题中心 ────────────────────────────────────────────────────
function Issues() {
  const langTick = typeof window.useLangTick === 'function' ? window.useLangTick() : 0;
  void langTick;
  const tr = (k, v) => (typeof window.t === 'function' ? window.t(k, v) : k);
  const {data, loading, error, reload} = useFetch(`${API}/issues?size=200`);
  const [modal, setModal] = React.useState(null);
  const [resolution, setResolution] = React.useState('');

  const resolve = () => {
    apiFetch(`/issues/${modal.id}/resolve`, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({resolution})})
      .then((r) => { if (!r.ok) throw new Error(); })
      .then(()=>{setModal(null);reload();showToast(tr('issue_toast_resolved'),'ok');})
      .catch(()=>showToast(tr('task_toast_op_fail'),'err'));
  };

  if (loading) return <PageSkeleton cards={2} />;
  if (error) return <LoadError message={error} onRetry={reload} />;
  const issues = normalizeListPayload(data);
  const open = issues.filter(i=>i.status==='open');
  const resolved = issues.filter(i=>i.status==='resolved');

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="section-title">{tr('issue_title')}</div>
      <RefreshBtn onClick={reload} />
    </div>
    <div className="card" style={{marginBottom:12}}>
      <div className="section-title">{tr('issue_open_section', { n: open.length })}</div>
      {open.length===0?<div className="empty">{tr('issue_empty_celebrate')}</div>:open.map(i=><div key={i.id} className="list-item">
        <div style={{flex:1}}>
          <div className="title">{i.title}</div>
          <div className="meta">{i.id} · <Tag type={i.type||'bug'} label={i.type}/> · {tr('issue_meta_report', { who: i.reported_by||'agent' })}</div>
          {i.description&&<div className="meta">{i.description}</div>}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:4,alignItems:'flex-end'}}>
          <Tag type={i.severity||'P2'}/>
          <button className="btn btn-sm btn-primary" onClick={()=>{setModal(i);setResolution('');}}>{tr('issue_btn_handle')}</button>
        </div>
      </div>)}
    </div>
    <div className="card">
      <div className="section-title">{tr('issue_resolved_section', { n: resolved.length })}</div>
      {resolved.slice(0,10).map(i=><div key={i.id} className="list-item">
        <div style={{flex:1}}><div className="title">{i.title}</div><div className="meta">{i.resolution}</div></div>
        <Tag type="resolved"/>
      </div>)}
    </div>
    {modal&&<div className="modal-bg" onClick={()=>setModal(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>{tr('issue_modal_title')}</h3>
        <div style={{fontSize:13,color:'#94a3b8',marginBottom:4}}>{modal.title}</div>
        <div style={{marginBottom:12}}><Tag type={modal.severity}/></div>
        <div className="form-group"><label>{tr('issue_label_resolution')}</label>
          <textarea value={resolution} onChange={e=>setResolution(e.target.value)} placeholder={tr('issue_ph_resolution')}/>
        </div>
        <div className="modal-actions">
          <button className="btn btn-cancel" onClick={()=>setModal(null)}>{tr('gen_cancel')}</button>
          <button className="btn btn-primary" onClick={resolve}>{tr('issue_resolve_btn')}</button>
        </div>
      </div>
    </div>}
  </>;
}

// ── 自定义模块 ───────────────────────────────────────────────────
function Custom() {
  const langTick = typeof window.useLangTick === 'function' ? window.useLangTick() : 0;
  void langTick;
  const tr = (k, v) => (typeof window.t === 'function' ? window.t(k, v) : k);
  const {data, loading, error, reload} = useFetch(`${API}/custom`);
  const [selected, setSelected] = React.useState(null);
  const [content, setContent] = React.useState(null);
  const [contentBusy, setContentBusy] = React.useState(false);
  const [contentErr, setContentErr] = React.useState(null);

  const open = (file) => {
    setSelected(file);
    setContent(null);
    setContentErr(null);
    setContentBusy(true);
    fetchFileContentJson(`${API}/custom/content?path=${encodeURIComponent(file.path)}`)
      .then(function (d) {
        setContent(d);
        setContentBusy(false);
      })
      .catch(function (err) {
        setContentBusy(false);
        var m = err && err.message ? String(err.message) : tr('gen_load_fail');

      });
  };

  if (loading) return <PageSkeleton cards={2} />;
  if (error) return <LoadError message={error} onRetry={reload} />;
  const files = data||[];
  const cats = {};
  files.forEach(f=>{(cats[f.category]||(cats[f.category]=[])).push(f);});

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>

        {!selected?<div className="empty">{tr('idx_pick_file_left')}</div>:
          contentBusy?<div className="doc-fetch-hint">{tr('idx_loading_file')}</div>:

// ── 规范文档浏览器 ────────────────────────────────────────────────
function Specs() {
  const langTick = typeof window.useLangTick === 'function' ? window.useLangTick() : 0;
  void langTick;
  const tr = (k, v) => (typeof window.t === 'function' ? window.t(k, v) : k);
  const {data:files,loading,error,reload} = useFetch(`${API}/custom`);
  const [selected,setSelected] = React.useState(null);
  const [content,setContent] = React.useState(null);
  const [contentBusy,setContentBusy] = React.useState(false);
  const [contentErr,setContentErr] = React.useState(null);
  const [specFiles,setSpecFiles] = React.useState([]);

  const reloadSpecList = React.useCallback(function () {
    return apiFetch(`${API}/specs`, { timeoutMs: 32000 })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (x.ok && Array.isArray(x.d)) setSpecFiles(x.d);
        else setSpecFiles([]);
      })
      .catch(function () { setSpecFiles([]); });
  }, []);

  React.useEffect(function () { reloadSpecList(); }, [reloadSpecList]);

  const reloadAll = React.useCallback(function () {
    return Promise.all([reload(), reloadSpecList()]);
  }, [reload, reloadSpecList]);

  const open = (f,isSpec) => {
    setSelected(Object.assign({}, f, { isSpec: !!isSpec }));
    setContent(null);
    setContentErr(null);
    setContentBusy(true);
    var url = isSpec
      ? `${API}/specs/content?path=${encodeURIComponent(f.path)}`
      : `${API}/custom/content?path=${encodeURIComponent(f.path)}`;
    fetchFileContentJson(url)
      .then(function (d) { setContent(d); setContentBusy(false); })
      .catch(function (err) {
        setContentBusy(false);
        var m = err && err.message ? String(err.message) : tr('gen_load_fail');
        setContentErr(m);
        showToast(m, 'err');
      });
  };

  const allFiles = [
    ...specFiles.map(function (f) { return Object.assign({}, f, { _isSpec: true }); }),
    ...(files||[]).map(function (f) { return Object.assign({}, f, { _isSpec: false }); }),
  ];
  const cats = {};
  allFiles.forEach(function (f) {
    var sourceLabel = f._isSpec ? tr('idx_source_spec') : tr('idx_source_custom');
    var k = tr('idx_cat_bracket', { source: sourceLabel, cat: f.category || tr('idx_root') });
    (cats[k] || (cats[k] = [])).push(f);
  });

  if (loading) return <PageSkeleton cards={2} />;
  if (error) return <LoadError message={error} onRetry={reload} />;

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="section-title">{tr('idx_specs_browser_title')}</div>
      <RefreshBtn onClick={reloadAll} />
    </div>
    <div className="grid-2">
      <div className="card scroll-slim panel-scroll">
        {Object.keys(cats).length===0?<div className="empty">{tr('idx_specs_empty')}</div>:
          Object.entries(cats).map(([cat,items])=><div key={cat}>
            <div className="file-browser-cat">{cat}</div>
            {items.map(f=><div key={f.path} className={'list-item file-browser-row' + ((selected && selected.path)===f.path?' vibe-list-selected':'')} style={{padding:'6px 8px'}} onClick={()=>open(f, !!f._isSpec)}>
              <div style={{flex:1}}>
                <div className="title" style={{fontSize:12}}>{f.name}</div>
                <div className="meta">{f.ext} · {(f.size/1024).toFixed(1)}KB</div>
              </div>
            </div>)}
          </div>)}
      </div>
      <div className="card scroll-slim panel-scroll">
        {!selected?<div className="empty">{tr('idx_specs_pick_left')}</div>:
          contentBusy?<div className="doc-fetch-hint">{tr('idx_loading_file')}</div>:
          contentErr?<LoadError message={contentErr} onRetry={()=>open(selected, !!selected.isSpec)} />:
          (content && content.type)==='text'?
          <div>
            <div className="doc-path-bar">{selected.path}</div>
            <pre className="doc-plain-pre">{content.content}</pre>
          </div>:
          content?<div className="empty">{tr('idx_binary_open_local_short')}</div>:
          <div className="empty">{tr('idx_no_content')}</div>}
      </div>
    </div>
  </>;
}
