      .catch(function () { setBoot(null); });
    apiFetch(API + '/system/project/reinit-backups', { timeoutMs: 20000 })
      .then(function (r) { return r.json(); })
      .then(function (d) { setReinitItems((d && d.items) || []); })
      .catch(function () { setReinitItems([]); });
  }, []);

  React.useEffect(function () { loadMeta(); }, [loadMeta]);

  const runInit = function () {
    var pid = String(projectId || '').trim();
    if (!pid) {
      showToast('请填写项目 ID（如 my-app）', 'err');
      return;
    }
    if (!window.confirm('即将在项目根执行 init-ai-project.sh：会创建 memory/、.ai-memory/ 及多套工具配置。确定继续？')) return;
    setBusy('init');
    setResult(null);
    apiFetch(API + '/system/project/init', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project_id: pid }),
      timeoutMs: 620000,
    })
      .then(function (r) {
        return r.json().then(function (d) {
          return { httpOk: r.ok, d: d };
        });
      })
      .then(function (x) {
        setBusy(null);
        if (!x.httpOk) {
          var msg =
            x.d && typeof x.d.detail === 'string'
              ? x.d.detail
              : x.d && x.d.detail
                ? JSON.stringify(x.d.detail)
                : JSON.stringify(x.d || {});
          setResult({ ok: false, returncode: -1, stderr: msg });
          showToast('请求被拒绝', 'err');
          return;
        }
        setResult(x.d);
        if (x.d && x.d.ok) {
          showToast('初始化已完成', 'ok');
          onReloadState();
          loadMeta();
        } else {
          showToast('初始化未成功（见下方输出）', 'err');
        }
      })
      .catch(function (e) {
        setBusy(null);
        setResult({ ok: false, stderr: (e && e.message) ? String(e.message) : String(e) });
        showToast('请求失败或超时', 'err');
      });
  };

  const runReinit = function () {
    var pid = String(projectId || '').trim();
    if (String(confirmPhrase || '').trim() !== 'REINIT') {
      showToast('请在确认框精确输入 REINIT（全大写）', 'err');
      return;
    }
    if (!pid) {
      showToast('重置须填写项目 ID（本页尚未有 current_state 可供推断）', 'err');
      return;
    }
    if (!window.confirm('将执行 reinit：默认先写入 .ai-reinit-backups/ 再删除 memory、.ai-memory、CLAUDE.md 等并重建。不可撤销。最后确认？')) return;
    setBusy('reinit');
    setResult(null);
    apiFetch(API + '/system/project/reinit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        confirm_phrase: 'REINIT',
        project_id: pid,
        keep_claude_md: !!keepClaude,
      }),
      timeoutMs: 920000,
    })
      .then(function (r) {
        return r.json().then(function (d) {
          return { httpOk: r.ok, d: d };
        });
      })
      .then(function (x) {
        setBusy(null);
        if (!x.httpOk) {
          var msg2 =
            x.d && typeof x.d.detail === 'string'
              ? x.d.detail
              : x.d && x.d.detail
                ? JSON.stringify(x.d.detail)
                : JSON.stringify(x.d || {});
          setResult({ ok: false, returncode: -1, stderr: msg2 });
          showToast('请求被拒绝', 'err');
          return;
        }
        setResult(x.d);
        if (x.d && x.d.ok) {
          showToast('重置并初始化已完成', 'ok');
          onReloadState();
          loadMeta();
          setConfirmPhrase('');
        } else {
          showToast('重置未成功（见下方输出）', 'err');
        }
      })
      .catch(function (e) {
        setBusy(null);
        setResult({ ok: false, stderr: (e && e.message) ? String(e.message) : String(e) });
        showToast('请求失败或超时', 'err');
      });
  };

  var dlReinit = function (name) {
    window.open(API + '/system/project/reinit-backups/download?name=' + encodeURIComponent(name), '_blank');
  };

  return (
    <div className="page-enter">
      <div className="card" style={{ borderLeft: '4px solid #f59e0b', padding: 24, marginBottom: 12 }}>
        <div className="section-title">尚未初始化</div>
        <p style={{ color: 'var(--text2)', fontSize: 14, lineHeight: 1.65 }}>
          当前缺少 <code style={{ color: '#fbbf24' }}>memory/current_state.json</code>。可在下方直接执行与命令行等价的初始化脚本，无需手动登录服务器敲命令。
        </p>
        {boot && boot.safetyReminders && (
          <ul style={{ fontSize: 12, color: '#94a3b8', lineHeight: 1.6, margin: '12px 0 8px 18px', padding: 0 }}>
            {boot.safetyReminders.map(function (t, i) {
              return (
                <li key={i} style={{ marginBottom: 6 }}>
                  {t}
                </li>
              );
            })}
          </ul>
        )}
        {boot && (
          <div className="meta" style={{ marginTop: 8, fontSize: 12 }}>
            脚本就绪：{boot.initScriptReady ? '是' : '否'} · 管理后台备份包：{boot.adminBackupsCount != null ? boot.adminBackupsCount : 0} · reinit 历史包：{boot.reinitBackupsCount != null ? boot.reinitBackupsCount : 0}
          </div>
        )}
        <div style={{ marginTop: 14 }}>
          <a href="#system" style={{ fontSize: 13, color: '#38bdf8' }}>
            打开「系统管理 → 运维/版本」创建 admin_state / sop_web 备份
          </a>
        </div>
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="section-title">首次初始化</div>
          <p style={{ fontSize: 12, color: '#64748b', marginBottom: 10 }}>等价于在项目根执行：<code style={{ fontSize: 11 }}>bash ai-sop-ops/init-ai-project.sh &lt;项目ID&gt;</code></p>
          <div className="form-group">
            <label>项目 ID *</label>
            <input
              value={projectId}
              onChange={function (e) {
                setProjectId(e.target.value);
              }}
              placeholder="例如 my-service"
              style={{ fontFamily: 'monospace', fontSize: 13 }}
            />
          </div>
          <button type="button" className="btn btn-primary btn-sm" style={{ width: '100%' }} disabled={!!busy} onClick={runInit}>
            {busy === 'init' ? '正在初始化（可能数分钟）…' : '执行初始化'}
          </button>
          <div style={{ marginTop: 10 }}>
            <RefreshBtn
              onClick={function () {
                loadMeta();
                onReloadState();
              }}
            />
          </div>
        </div>
        <div className="card">
          <div className="section-title">reinit 备份包</div>
          <p style={{ fontSize: 12, color: '#64748b', marginBottom: 8 }}>由脚本在<strong>重置</strong>前自动写入目录 <code>.ai-reinit-backups/</code>。</p>
          {reinitItems.length === 0 ? (
            <div className="empty">暂无</div>
          ) : (
            reinitItems.slice(0, 12).map(function (it) {
              return (
                <div key={it.name} className="list-item">
                  <div style={{ flex: 1 }}>
                    <div className="title" style={{ fontSize: 12, fontFamily: 'monospace' }}>
                      {it.name}
                    </div>
                    <div className="meta">
                      {(it.size / 1024).toFixed(1)} KB · {it.updatedAt}
                    </div>
                  </div>
                  <button type="button" className="btn btn-sm" style={{ background: '#334155', color: '#94a3b8' }} onClick={function () { dlReinit(it.name); }}>
                    下载
                  </button>
                </div>
              );
            })
          )}
        </div>
      </div>

      <div className="card" style={{ marginTop: 12, borderLeft: '4px solid #b91c1c' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
          <div className="section-title" style={{ margin: 0, color: '#fca5a5' }}>
            危险：重置并重新初始化（reinit）
          </div>
          <button type="button" className="btn btn-sm" style={{ background: '#334155', color: '#94a3b8' }} onClick={function () { setShowDanger(!showDanger); }}>
            {showDanger ? '收起' : '展开选项'}
          </button>
        </div>
        {!showDanger ? (
          <p style={{ fontSize: 12, color: '#64748b', marginTop: 8 }}>会删除 memory、.ai-memory 及工具侧配置文件后重建。请先备份。</p>
        ) : (
          <div style={{ marginTop: 12 }}>
            <p style={{ fontSize: 12, color: '#fdba74', lineHeight: 1.6 }}>
              本页在未初始化状态下<strong>必须填写项目 ID</strong>。请在上方填写与初始化一致的 ID。勾选「保留 CLAUDE.md」可减少文档丢失风险（仍建议先下载备份包）。
            </p>
            <div className="form-group" style={{ marginTop: 10 }}>
              <label>确认口令（输入 REINIT）</label>
              <input
                value={confirmPhrase}
                onChange={function (e) {
                  setConfirmPhrase(e.target.value);
                }}
                placeholder="REINIT"
                autoComplete="off"
                style={{ fontFamily: 'monospace' }}
              />
            </div>
            <label className="text-secondary" style={{ fontSize: 12, display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
              <input type="checkbox" checked={keepClaude} onChange={function (e) { setKeepClaude(e.target.checked); }} />
              保留已有 CLAUDE.md（--keep-claude-md）
            </label>
            <button type="button" className="btn btn-sm" style={{ background: '#991b1b', color: '#fecaca', width: '100%' }} disabled={!!busy} onClick={runReinit}>
              {busy === 'reinit' ? '正在执行 reinit…' : '执行重置（reinit）'}
            </button>
          </div>
        )}
      </div>

      {result && (
        <div className="card" style={{ marginTop: 12 }}>
          <div className="section-title" style={{ fontSize: 13, color: result.ok ? '#86efac' : '#fca5a5' }}>
            {result.ok ? '命令成功' : '命令失败'} {result.returncode != null ? '(exit ' + result.returncode + ')' : ''}
          </div>
          {result.stdout ? <pre className="doc-plain-pre doc-plain-pre--log">{result.stdout}</pre> : null}
          {result.stderr ? <pre className="doc-plain-pre doc-plain-pre--log doc-plain-pre--stderr">{result.stderr}</pre> : null}
        </div>
      )}
    </div>
  );
}

// ── 项目配置 ─────────────────────────────────────────────────────
function Config() {
  const {data:state,loading,error,reload} = useFetch(`${API}/state`);
  const [editing,setEditing] = React.useState(false);
  const [form,setForm] = React.useState({});

  React.useEffect(()=>{if(state&&!state.error)setForm(state);},[state]);

  const save = () => {
    apiFetch(`/state`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(form)})
      .then((r) => { if (!r.ok) throw new Error(); })
      .then(()=>{setEditing(false);reload();showToast('配置已保存','ok');})
      .catch(()=>showToast('保存失败','err'));
  };

  if(loading) return <PageSkeleton cards={2} />;
  if(error && !state) return <LoadError message={error} onRetry={reload} />;
  if((state && state.error)) return <ProjectBootstrapPanel onReloadState={reload} />;

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="section-title">⚙️ 项目配置</div>
      <div style={{display:'flex',gap:8}}>
        <RefreshBtn onClick={reload} />
        {!editing&&<button className="btn btn-primary btn-sm" onClick={()=>setEditing(true)}>编辑</button>}
      </div>
    </div>
    <div className="grid-2">
      <div className="card">
        <div className="section-title">基本信息</div>
        {editing?<>
          <div className="form-group"><label>项目 ID</label><input value={form.project_id||''} onChange={e=>setForm({...form,project_id:e.target.value})}/></div>
          <div className="form-group"><label>当前阶段</label>
            <select value={form.phase||'INIT'} onChange={e=>setForm({...form,phase:e.target.value})}>
              {['INIT','PLANNING','DEVELOPMENT','REVIEW','TESTING','RELEASE','MAINTENANCE'].map(p=><option key={p}>{p}</option>)}
            </select>
          </div>
          <div className="modal-actions">
            <button className="btn btn-cancel" onClick={()=>setEditing(false)}>取消</button>
            <button className="btn btn-primary" onClick={save}>保存</button>
          </div>
        </>:<>
          <div className="list-item"><div className="title">项目 ID</div><div style={{color:'#94a3b8'}}>{state.project_id}</div></div>
          <div className="list-item"><div className="title">当前阶段</div><Tag type={state.phase==='DEVELOPMENT'?'in_progress':'pending'} label={state.phase}/></div>
          <div className="list-item"><div className="title">最后更新</div><div style={{color:'#94a3b8',fontSize:12}}>{(state.updated_at && state.updated_at.slice && state.updated_at.slice(0,16))||'-'}</div></div>
        </>}
      </div>
      <div className="card">
        <div className="section-title">任务统计</div>
        {state.tasks&&<>
          <div className="list-item"><div className="title">已完成</div><span className="tag tag-done">{(state.tasks.completed && state.tasks.completed.length)||0}</span></div>
          <div className="list-item"><div className="title">进行中</div><span className="tag tag-progress">{(state.tasks.in_progress && state.tasks.in_progress.length)||0}</span></div>
          <div className="list-item"><div className="title">阻塞</div><span className="tag tag-blocked">{(state.tasks.blocked && state.tasks.blocked.length) || 0}</span></div>
          <div className="list-item"><div className="title">待处理</div><span className="tag tag-pending">{(state.tasks.pending && state.tasks.pending.length)||0}</span></div>
        </>}
      </div>
    </div>
    <div className="card" style={{marginTop:12}}>
      <div className="section-title">原始状态（JSON）</div>
      <pre style={{fontSize:11,color:'#94a3b8',maxHeight:200,overflowY:'auto'}}>{JSON.stringify(state,null,2)}</pre>
    </div>
  </>;
}


// ── 执行计划（任务 CRUD + 优先级看板 / 排序 / Agent / 工具） ─────────────────
function ExecutionPlan() {
  const {data, loading, error, reload} = useFetch(`${API}/tasks`);
  const {data: agentsBuiltin} = useFetch(`${API}/agents/builtin`);
  const {data: agentsCustom} = useFetch(`${API}/agents`);
  const {data: orchTools} = useFetch(`${API}/orchestration/tools`);
  const [modal, setModal] = React.useState(null);
  const [form, setForm] = React.useState({
    title: '',
    description: '',
    priority: 'P1',
    estimate: 'M',
    assigned_to: 'Coder',
    req_id: '',
    sprint_id: '',
    dev_tool: '',
    artifact_url: '',
    artifact_path: '',
    debug_notes: '',
    branch: '',
  });
  const [filter, setFilter] = React.useState('all');

  const toolOptions = React.useMemo(() => {
    const a = DEV_TOOL_PRESETS.slice();
    if (Array.isArray(orchTools)) {
      orchTools.forEach((x) => {
        if (x && x.id && a.indexOf(x.id) < 0) a.push(x.id);
      });
    }
    return a;
  }, [orchTools]);

  const agentOptions = React.useMemo(() => {
    const defs = Array.isArray(agentsBuiltin) ? agentsBuiltin : [];
    const cus = Array.isArray(agentsCustom) ? agentsCustom : [];
    const ids = [];
    defs.forEach((a) => { if (a && a.id) ids.push(a.id); });
    cus.forEach((a) => { if (a && a.id) ids.push(a.id); });
    const base = ['Coder', 'orchestrator', 'planner', 'coder-backend', 'coder-frontend', 'reviewer', 'tester', 'debugger'];
    if (!ids.length) return base;
    return [...new Set([...base, ...ids])];
  }, [agentsBuiltin, agentsCustom]);

  const groupByPriority = React.useCallback((items) => {
    const g = {P0: [], P1: [], P2: [], P3: []};
    (items || []).forEach((t) => {
      const p = (t.priority || 'P3').toUpperCase();
      const k = g[p] ? p : 'P3';
      g[k].push(t);
    });
    return g;
  }, []);

  const commitTaskReorder = (gObj) => {
    apiFetch(`/tasks/reorder-board`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        groups: {
          P0: (gObj.P0 || []).map((x) => x.id),
          P1: (gObj.P1 || []).map((x) => x.id),
          P2: (gObj.P2 || []).map((x) => x.id),
          P3: (gObj.P3 || []).map((x) => x.id),
        },
      }),
    })
      .then((r) => r.json().then((d) => ({ok: r.ok, d})))
      .then(({ok, d}) => {
        if (!ok) {
          showToast(typeof d.detail === 'string' ? d.detail : '排序保存失败', 'err');
          return;
        }
        reload();
        showToast('执行顺序与优先级已保存', 'ok');
      })
      .catch(() => showToast('请求失败', 'err'));
  };

  const moveTask = (id, targetP, insertBeforeId) => {
    const all = data || [];
    const g = groupByPriority(all);
    let row = null;
    for (const p of ['P0', 'P1', 'P2', 'P3']) {
      const idx = g[p].findIndex((x) => x.id === id);
      if (idx >= 0) {
        row = g[p][idx];
        g[p].splice(idx, 1);
        break;
      }
    }
    if (!row) return;
    const tp = ['P0', 'P1', 'P2', 'P3'].includes(targetP) ? targetP : 'P3';
    if (!insertBeforeId) g[tp].push({...row, priority: tp});
    else {
      const at = g[tp].findIndex((x) => x.id === insertBeforeId);
      if (at < 0) g[tp].push({...row, priority: tp});
      else g[tp].splice(at, 0, {...row, priority: tp});
    }
    commitTaskReorder(g);
  };

  const patchTask = (id, partial) => {
    apiFetch(`/tasks/${encodeURIComponent(id)}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(partial),
    })
      .then((r) => {
        if (!r.ok) throw new Error();
      })
      .then(() => {
        reload();
        showToast('已更新', 'ok');
      })
      .catch(() => showToast('更新失败', 'err'));
  };

  const save = () => {
    const isEdit = modal && modal.id;
    const url = isEdit ? `${API}/tasks/${modal.id}` : `${API}/tasks`;
    const method = isEdit ? 'PATCH' : 'POST';
    apiFetch(url, {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(form)})
      .then((r) => {
        if (!r.ok) throw new Error();
      })
      .then(() => {
        setModal(null);
        reload();
        showToast(isEdit ? '任务已更新' : '任务已创建', 'ok');
      })
      .catch(() => showToast('保存失败', 'err'));
  };
  const del = (id) => {
    if (!confirm('确认删除？')) return;
    apiFetch(`/tasks/${id}`, {method: 'DELETE'})
      .then((r) => {
        if (!r.ok) throw new Error();
      })
      .then(() => {
        reload();
        showToast('已删除', 'ok');
      })
      .catch(() => showToast('删除失败', 'err'));
  };
  const changeStatus = (id, status) => {
    apiFetch(`/tasks/${id}`, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status})})
      .then((r) => {
        if (!r.ok) throw new Error();
      })
      .then(() => {
        reload();
        showToast('状态已更新', 'ok');
      })
      .catch(() => showToast('更新失败', 'err'));
  };

  if (loading) return <PageSkeleton cards={2} />;
  if (error) return <LoadError message={error} onRetry={reload} />;

  const tasks = (data || []).filter((t) => filter === 'all' || t.status === filter);
  const statusOpts = ['pending', 'in_progress', 'completed', 'blocked'];
  const priorityOpts = ['P0', 'P1', 'P2', 'P3'];
  const estimateOpts = ['S', 'M', 'L'];
  const groups = groupByPriority(tasks);

  return <>
    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16, flexWrap: 'wrap', gap: 8}}>
      <div>
        <div className="section-title">📋 执行计划</div>
        <div style={{fontSize: 11, color: 'var(--text3)', marginTop: 4}}>
          {filter === 'all' ? '按优先级 P0–P3 看板；拖拽调整顺序与优先级；卡片可改状态 / Agent / 工具，支持产出 URL 与路径、一键进 Vibe。' : '筛选模式下为列表视图；调整顺序请切回「全部」。'}
        </div>
      </div>
      <div style={{display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap'}}>
        <select className="input-surface" style={{padding:'4px 8px',borderRadius:6,fontSize:12}}
          value={filter} onChange={(e) => setFilter(e.target.value)}>
          <option value="all">全部</option>
          {statusOpts.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
        <RefreshBtn onClick={reload}>{''}</RefreshBtn>
        <button className="btn btn-primary btn-sm" onClick={() => {
          setModal('create');
          setForm({title: '', description: '', priority: 'P1', estimate: 'M', assigned_to: 'Coder', req_id: '', sprint_id: '', dev_tool: '', artifact_url: '', artifact_path: '', debug_notes: '', branch: ''});
        }}>+ 新建任务</button>
      </div>
    </div>
    {filter === 'all' ? (
      <div className="grid-2">
        {Object.entries(groups).map(([p, items]) => <div key={p} className="card scroll-slim" style={{maxHeight: 520, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 8}}
          onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }}
        >
          <div className="section-title"><Tag type={p}/> <span style={{color: '#64748b', fontWeight: 400}}>({items.length})</span></div>
          {items.length === 0 ? <div className="empty">暂无</div> : items.map((t) => <div key={t.id}
            draggable
            onDragStart={(e) => { e.dataTransfer.setData('text/task-id', t.id); e.dataTransfer.effectAllowed = 'move'; }}
            className="list-item"
            style={{alignItems: 'stretch', flexDirection: 'column', gap: 8, cursor: 'grab', border: '1px solid var(--border)', borderRadius: 10, padding: 10, marginBottom: 2}}
            onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect = 'move'; }}
            onDrop={(e) => { e.preventDefault(); e.stopPropagation(); const dragId = e.dataTransfer.getData('text/task-id'); if (!dragId || dragId === t.id) return; moveTask(dragId, p, t.id); }}
          >
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8}}>
              <div style={{flex: 1, minWidth: 0}}>
                <div style={{display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap'}}>
                  <span className="title">{t.title}</span>
                  <Tag type={t.status || 'pending'}/>
                  <span style={{fontSize: 11, color: '#64748b'}}>{t.estimate || '-'}</span>
                </div>
                <div className="meta">{t.id} {t.req_id && `· 需求:${t.req_id}`}</div>
                {(t.artifact_url || t.artifact_path) && (
                  <div style={{fontSize: 11, marginTop: 4, display: 'flex', flexWrap: 'wrap', gap: 6, alignItems: 'center'}}>
                    {t.artifact_url && (
                      <a href={t.artifact_url} target="_blank" rel="noreferrer" style={{color: '#60a5fa'}} onClick={(e) => e.stopPropagation()}>
                        产出 URL
                      </a>
                    )}
                    {t.artifact_path && (
                      <button
                        type="button"
                        className="btn btn-sm"
                        style={{background: '#334155', color: '#94a3b8', padding: '2px 6px'}}
                        onClick={(e) => {
                          e.stopPropagation();
                          navigator.clipboard.writeText(t.artifact_path).then(() => showToast('已复制相对路径', 'ok')).catch(() => showToast('复制失败', 'err'));
                        }}
                      >
                        复制产出路径
                      </button>
                    )}
                  </div>
                )}
                {t.description && <div className="meta" style={{color: '#94a3b8', marginTop: 4, display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden'}}>{t.description}</div>}
                {Number(t.confidence) > 0 && <ConfBar val={t.confidence}/>}
              </div>
              <div style={{display: 'flex', flexDirection: 'column', gap: 4}}>
                <select style={{background: '#0f172a', border: '1px solid #334155', color: '#94a3b8', padding: '2px 4px', borderRadius: 4, fontSize: 11}}
                  value={t.status || 'pending'} onChange={(e) => changeStatus(t.id, e.target.value)} onClick={(e) => e.stopPropagation()}>
                  {statusOpts.map((s) => <option key={s}>{s}</option>)}
                </select>
                <button className="btn btn-sm btn-primary" onClick={() => {
                  setModal(t);
                  setForm({title: t.title, description: t.description || '', priority: t.priority || 'P1', estimate: t.estimate || 'M', assigned_to: t.assigned_to || 'Coder', req_id: t.req_id || '', sprint_id: t.sprint_id || '', dev_tool: t.dev_tool || '', artifact_url: t.artifact_url || '', artifact_path: t.artifact_path || '', debug_notes: t.debug_notes || '', branch: t.branch || ''});
                }}>编辑</button>
                <button className="btn btn-sm" style={{background: '#7f1d1d', color: '#fca5a5'}} onClick={() => del(t.id)}>删除</button>
              </div>
            </div>
            <div style={{display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'center', fontSize: 11}}>
              <span style={{color: '#64748b'}}>Agent</span>
              <select value={t.assigned_to || ''} onChange={(e) => patchTask(t.id, {assigned_to: e.target.value})} onClick={(e) => e.stopPropagation()}
                style={{padding: '4px 8px', borderRadius: 6, background: 'var(--bg3)', color: 'var(--text)', border: '1px solid var(--border)', fontSize: 11, maxWidth: 160}}>
                {agentOptions.map((aid) => <option key={String(aid)} value={aid}>{aid}</option>)}
              </select>
              <span style={{color: '#64748b'}}>工具</span>
              <select value={t.dev_tool || ''} onChange={(e) => patchTask(t.id, {dev_tool: e.target.value})} onClick={(e) => e.stopPropagation()}
                style={{padding: '4px 8px', borderRadius: 6, background: 'var(--bg3)', color: 'var(--text)', border: '1px solid var(--border)', fontSize: 11, maxWidth: 140}}>
                {toolOptions.map((x) => <option key={String(x)} value={x}>{x || '（未指定）'}</option>)}
              </select>
              <button type="button" className="btn btn-sm" style={{background: '#1e3a5f', color: '#93c5fd'}} onClick={(e) => { e.stopPropagation(); window.dispatchEvent(new CustomEvent('app-set-tab', {detail: {tab: 'vibe'}})); }}>Vibe</button>
              <span style={{marginLeft: 'auto', color: '#475569', fontSize: 10}}>拖拽排序</span>
            </div>
          </div>)}
          <div
            style={{minHeight: 32, border: '1px dashed var(--border)', borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, color: 'var(--text3)', marginTop: 4}}
            onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }}
            onDrop={(e) => { e.preventDefault(); const dragId = e.dataTransfer.getData('text/task-id'); if (!dragId) return; moveTask(dragId, p, null); }}
          >拖放到此 · {p} 列末尾</div>
        </div>)}
      </div>
    ) : (
      <div className="card">
        {tasks.length === 0 ? <div className="empty">暂无任务</div> : tasks.map((t) => <div key={t.id} className="list-item">
          <div style={{flex: 1}}>
            <div style={{display: 'flex', alignItems: 'center', gap: 8}}>
              <span className="title">{t.title}</span>
              <Tag type={t.status || 'pending'}/>
              <Tag type={t.priority || 'P2'}/>
              <span style={{fontSize: 11, color: '#64748b'}}>{t.estimate || '-'}</span>
            </div>
            <div className="meta">{t.id} · {t.assigned_to || '-'} · 工具:{t.dev_tool || '-'} {t.req_id && `· 需求:${t.req_id}`} {t.artifact_url && '· 🔗'} {t.artifact_path && '· 📁'}</div>
            {Number(t.confidence) > 0 && <ConfBar val={t.confidence}/>}
          </div>
          <div style={{display: 'flex', gap: 4, flexWrap: 'wrap', justifyContent: 'flex-end'}}>
            <select style={{background: '#0f172a', border: '1px solid #334155', color: '#94a3b8', padding: '2px 4px', borderRadius: 4, fontSize: 11}}
              value={t.status || 'pending'} onChange={(e) => changeStatus(t.id, e.target.value)}>
              {statusOpts.map((s) => <option key={s}>{s}</option>)}
            </select>
            <button className="btn btn-sm btn-primary" onClick={() => {
              setModal(t);
              setForm({title: t.title, description: t.description || '', priority: t.priority || 'P1', estimate: t.estimate || 'M', assigned_to: t.assigned_to || 'Coder', req_id: t.req_id || '', sprint_id: t.sprint_id || '', dev_tool: t.dev_tool || '', artifact_url: t.artifact_url || '', artifact_path: t.artifact_path || '', debug_notes: t.debug_notes || '', branch: t.branch || ''});
            }}>编辑</button>
            <button className="btn btn-sm" style={{background: '#7f1d1d', color: '#fca5a5'}} onClick={() => del(t.id)}>删除</button>
          </div>
        </div>)}
      </div>
    )}
    {modal && <div className="modal-bg" onClick={() => setModal(null)}>
      <div className="modal" style={{width: 480}} onClick={(e) => e.stopPropagation()}>
        <h3>{modal === 'create' ? '新建任务' : '编辑任务'}</h3>
        <div className="form-group"><label>标题</label><input value={form.title} onChange={(e) => setForm({...form, title: e.target.value})} placeholder="任务标题"/></div>
        <div className="form-group"><label>描述</label><textarea value={form.description} onChange={(e) => setForm({...form, description: e.target.value})} placeholder="任务描述"/></div>
        <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8}}>
          <div className="form-group"><label>优先级</label><select value={form.priority} onChange={(e) => setForm({...form, priority: e.target.value})}>{priorityOpts.map((p) => <option key={p}>{p}</option>)}</select></div>
          <div className="form-group"><label>估算</label><select value={form.estimate} onChange={(e) => setForm({...form, estimate: e.target.value})}>{estimateOpts.map((p) => <option key={p}>{p}</option>)}</select></div>
          <div className="form-group"><label>开发 Agent</label>
            <select value={form.assigned_to} onChange={(e) => setForm({...form, assigned_to: e.target.value})}>
              {agentOptions.map((aid) => <option key={String(aid)} value={aid}>{aid}</option>)}
            </select></div>
        </div>
        <div className="form-group"><label>开发工具（含编排页配置的工具）</label>
          <select value={form.dev_tool || ''} onChange={(e) => setForm({...form, dev_tool: e.target.value})}>
            {toolOptions.map((x) => <option key={String(x)} value={x}>{x || '（未指定）'}</option>)}
          </select></div>
        <div className="form-group"><label>产出 / 预览 URL（http(s)，可选）</label>
          <input value={form.artifact_url} onChange={(e) => setForm({...form, artifact_url: e.target.value})} placeholder="https://preview.example.com 或本地 http://127.0.0.1:5173"/></div>
        <div className="form-group"><label>产出相对路径（相对 PROJECT_PATH，可选）</label>
          <input value={form.artifact_path} onChange={(e) => setForm({...form, artifact_path: e.target.value})} placeholder="dist/index.html 或 build/libs/foo.jar"/></div>
        <div className="form-group"><label>分支 / 版本（可选）</label>
          <input value={form.branch} onChange={(e) => setForm({...form, branch: e.target.value})} placeholder="feature/xxx"/></div>
        <div className="form-group"><label>调试 / 联调备注（可选）</label>
          <textarea value={form.debug_notes} onChange={(e) => setForm({...form, debug_notes: e.target.value})} placeholder="端口、环境变量、如何复现…" style={{minHeight: 56, fontSize: 12}}/></div>
        <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8}}>
          <div className="form-group"><label>关联需求 ID</label><input value={form.req_id} onChange={(e) => setForm({...form, req_id: e.target.value})} placeholder="REQ-xxx"/></div>
          <div className="form-group"><label>Sprint ID</label><input value={form.sprint_id} onChange={(e) => setForm({...form, sprint_id: e.target.value})} placeholder="SPRINT-1"/></div>
        </div>
        <div className="modal-actions">
          <button className="btn btn-cancel" onClick={() => setModal(null)}>取消</button>
          <button className="btn btn-primary" onClick={save}>保存</button>
        </div>
      </div>
    </div>}
  </>;
}

// ── 迭代进度 ─────────────────────────────────────────────────────
function IterationProgress() {
  const {data:sprints,loading,error,reload} = useFetch(`${API}/sprints?size=100`);
  const [selected,setSelected] = React.useState(null);
  const [progress,setProgress] = React.useState(null);

  const loadProgress = (id) => {
    setSelected(id);
    apiFetch(`/sprints/${id}/progress`).then(r=>r.json()).then(setProgress);
  };

  const sprintList = normalizeListPayload(sprints);
  const active = sprintList.find(s=>s.status==='active');
  React.useEffect(()=>{ if(active&&!selected) loadProgress(active.id); },[(active && active.id)]);

  if (loading) return <PageSkeleton cards={2} />;
  if (error) return <LoadError message={error} onRetry={reload} />;

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="section-title">🏃 迭代进度</div>
      <RefreshBtn onClick={()=>{reload();selected&&loadProgress(selected);}} />
    </div>
    <div className="grid-2">
      <div className="card">
        <div className="section-title">迭代列表</div>
        {sprintList.length===0?<div className="empty">暂无迭代</div>:sprintList.map(s=><div key={s.id} className={'list-item file-browser-row' + (selected===s.id?' vibe-list-selected':'')} onClick={()=>loadProgress(s.id)}>
          <div style={{flex:1}}>
            <div className="title">{s.id}</div>
            <div className="meta">{(s.goal && s.goal.slice(0,40))}</div>
          </div>
          <span className={`tag ${s.status==='active'?'tag-progress':s.status==='completed'?'tag-done':'tag-pending'}`}>{s.status}</span>
        </div>)}
      </div>
      <div>
        {!progress?<div className="card"><div className="empty">← 选择迭代查看进度</div></div>:<>
          <div className="grid-4" style={{marginBottom:12}}>
            <div className="card"><h3>完成率</h3><div className="stat-val">{progress.completion_rate}%</div><div className="progress-bar"><div className="progress-fill" style={{width:progress.completion_rate+'%'}}/></div></div>
            <div className="card"><h3>任务总数</h3><div className="stat-val">{progress.total_tasks}</div><div className="stat-sub">完成 {progress.completed}</div></div>
            <div className="card"><h3>阻塞</h3><div className="stat-val" style={{color:(progress.blocked && progress.blocked.length)?'#fca5a5':'#86efac'}}>{(progress.blocked && progress.blocked.length)||0}</div></div>
            <div className="card"><h3>平均置信度</h3><div className="stat-val" style={{fontSize:20}}>{Math.round((progress.avg_confidence||0)*100)}%</div></div>
          </div>
          {(progress.blocked && progress.blocked.length)>0&&<div className="card" style={{marginBottom:12}}>
            <div className="section-title">🚧 阻塞任务</div>
            {progress.blocked.map(t=><div key={t.id} className="list-item">
              <div style={{flex:1}}><div className="title">{t.title}</div><div className="meta">{t.id} · {t.assigned_to}</div></div>
              <Tag type="blocked"/>
            </div>)}
          </div>}
          {(progress.open_issues && progress.open_issues.length)>0&&<div className="card">
            <div className="section-title">🐛 本迭代问题</div>
            {progress.open_issues.map(i=><div key={i.id} className="list-item">
              <div style={{flex:1}}><div className="title">{i.title}</div></div>
              <Tag type={i.severity||'P2'}/>
            </div>)}
          </div>}
        </>}
      </div>
    </div>
  </>;
}

// ── 知识库管理（增强版：文档导入 + AI 总结/润色） ──────────────────
function KnowledgeManager() {
  const langTick = typeof window.useLangTick === 'function' ? window.useLangTick() : 0;
  void langTick;
  const tr = (k, v) => (typeof window.t === 'function' ? window.t(k, v) : k);
  const {data,loading,error,reload} = useFetch(`${API}/knowledge`);
  const [modal,setModal] = React.useState(false);
  const [form,setForm] = React.useState({title:'',content:'',category:'general',tags:''});
  const [indexing,setIndexing] = React.useState(false);
  const [searchQ,setSearchQ] = React.useState('');
  const [searchResults,setSearchResults] = React.useState(null);
  const [aiBusy,setAiBusy] = React.useState(false);
  const [fileBusy,setFileBusy] = React.useState(false);

  const save = () => {
    apiFetch(`/knowledge`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...form,tags:form.tags.split(/[,，]/).map(t=>t.trim()).filter(Boolean)})})
      .then((r) => { if (!r.ok) throw new Error(); })
      .then(()=>{setModal(false);reload();setForm({title:'',content:'',category:'general',tags:''});showToast(tr('kbm_toast_entry_added'),'ok');})
      .catch(()=>showToast(tr('kbm_toast_add_fail'),'err'));
  };
  const del = (id) => {
    if(!confirm(tr('kbm_confirm_del'))) return;
    apiFetch(`/knowledge/${id}`,{method:'DELETE'})
      .then((r) => { if (!r.ok) throw new Error(); })
      .then(()=>{reload();showToast(tr('req_toast_deleted'),'ok');})
      .catch(()=>showToast(tr('req_toast_delete_fail'),'err'));
  };
  const indexCustom = () => {
    setIndexing(true);
    apiFetch(`/knowledge/index`,{method:'POST'}).then(r=>r.json()).then(d=>{
      setIndexing(false);reload();showToast(tr('kb_toast_indexed', { n: d.count||0 }),'ok');
    }).catch(()=>{setIndexing(false);showToast(tr('kb_toast_index_fail'),'err');});
  };
  const doSearch = () => {
    if(!searchQ.trim()) return;
    setSearchResults(null);
    apiFetch(`/knowledge/search?q=${encodeURIComponent(searchQ)}`).then(r=>r.json()).then(setSearchResults);
  };

  const importFile = (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!f) return;
    setFileBusy(true);
    const fd = new FormData();
    fd.append('file', f);
    apiFetch(`/knowledge/extract-text`,{method:'POST',body:fd})
      .then(r=>r.json().then(d=>({ok:r.ok,d})))
      .then(({ok,d})=>{
        setFileBusy(false);
        if(!ok){showToast(typeof d.detail==='string'?d.detail:tr('kbm_toast_import_fail'),'err');return;}
        setForm(p=>{
          const next = {...p, content: (p.content ? p.content + '\n\n' : '') + (d.text || '')};
          if (f.name && !String(p.title || '').trim()) {
            next.title = f.name.replace(/\.[^.]+$/,'');
          }
          return next;
        });
        showToast(tr('kbm_toast_imported'),'ok');
      })
      .catch(()=>{setFileBusy(false);showToast(tr('kbm_toast_import_fail'),'err');});
  };

  const runAi = (mode) => {
    const raw = (form.content||'').trim();
    if(raw.length < 30){showToast(tr('kbm_toast_material'),'err');return;}
    setAiBusy(true);
    apiFetch(`/knowledge/ai-polish`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        raw_text: raw,
        mode,
        category_hint: form.category,
        title_hint: form.title||undefined,
      }),
    }).then(r=>r.json().then(d=>({ok:r.ok,d})))
      .then(({ok,d})=>{
        setAiBusy(false);
        if(!ok){showToast(typeof d.detail==='string'?d.detail:tr('kbm_toast_ai_fail'),'err');return;}
        setForm(p=>({
          ...p,
          title:d.title||p.title,
          content:d.content||p.content,
          category:d.category||p.category,
          tags:Array.isArray(d.tags)?d.tags.join(', '):(p.tags||''),
        }));
        showToast(mode==='polish'?tr('kbm_toast_polish_ok'):tr('kbm_toast_summarize_ok'),'ok');
      })
      .catch(()=>{setAiBusy(false);showToast(tr('gen_req_fail'),'err');});
  };

  if (loading) return <PageSkeleton cards={4} />;
  if (error) return <LoadError message={error} onRetry={reload} />;

  const items = data||[];
  const cats = {};
  items.forEach(i=>{const c=i.category||'general';(cats[c]||(cats[c]=[])).push(i);});

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="section-title">{tr('kbm_title')}</div>
      <div style={{display:'flex',gap:8}}>
        <RefreshBtn onClick={reload}>{''}</RefreshBtn>
        <button type="button" className="btn btn-sm btn-muted" onClick={indexCustom} disabled={indexing}>{indexing ? tr('kbm_indexing') : tr('kbm_index_btn')}</button>
        <button type="button" className="btn btn-primary btn-sm" onClick={()=>setModal(true)}>{tr('kbm_add_btn')}</button>
      </div>
    </div>
    <div style={{display:'flex',gap:8,marginBottom:16}}>
      <input className="input-surface" style={{flex:1,padding:'7px 12px',borderRadius:6,fontSize:13}}
        value={searchQ} onChange={e=>setSearchQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doSearch()} placeholder={tr('kbm_search_ph')}/>
      <button type="button" className="btn btn-primary" onClick={doSearch}>{tr('search_btn')}</button>
    </div>
    {searchResults&&<div className="card" style={{marginBottom:12}}>
      <div className="section-title">{tr('kbm_results_n', { n: searchResults.length })}</div>
      {searchResults.length===0?<div className="empty">{tr('search_none')}</div>:searchResults.map((r,i)=><div key={i} className="list-item">
        <div style={{flex:1}}><div className="title">{r.path}</div><div className="meta">{r.content}</div></div>
        <span className="tag tag-p2">{r.category}</span>
      </div>)}
    </div>}
    <div className="grid-4" style={{marginBottom:12}}>
      <div className="card"><h3>{tr('kbm_stat_docs')}</h3><div className="stat-val">{items.length}</div></div>
      {Object.entries(cats).slice(0,3).map(([c,v])=><div key={c} className="card"><h3>{c}</h3><div className="stat-val">{v.length}</div></div>)}
    </div>
    <div className="card">
      {items.length===0?<div className="empty">{tr('kbm_empty_hint')}</div>:
        items.slice(0,100).map(i=><div key={i.id} className="list-item">
          <div style={{flex:1}}>
            <div className="title" style={{fontSize:12}}>{i.path||i.id}</div>
            <div className="meta">{(i.content && i.content.slice && i.content.slice(0,100))}...</div>
          </div>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            <span className="tag tag-p2">{i.category}</span>
            <button type="button" className="btn btn-sm" style={{background:'#7f1d1d',color:'#fca5a5',padding:'2px 6px'}} onClick={()=>del(i.id)}>×</button>
          </div>
        </div>)}
    </div>
    {modal&&<div className="modal-bg" onClick={()=>!aiBusy&&!fileBusy&&setModal(false)}>
      <div className="modal" style={{width:560,maxWidth:'96vw'}} onClick={e=>e.stopPropagation()}>
        <h3>{tr('kbm_modal_add')}</h3>
        <p className="text-tertiary" style={{fontSize:11,marginBottom:10}}>{tr('kbm_modal_intro_p1')}<strong className="text-secondary">{tr('kbm_modal_intro_types')}</strong>{tr('kbm_modal_intro_p2')}<code className="text-secondary" style={{fontFamily:'monospace'}}>pypdf</code>{tr('kbm_modal_intro_p3')}<code className="text-secondary" style={{fontFamily:'monospace'}}>ANTHROPIC_API_KEY</code>{tr('kbm_modal_intro_end')}</p>
        <div className="form-group"><label>{tr('req_label_title')}</label><input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder={tr('kbm_ph_knowledge_title')}/></div>
        <div className="form-group"><label>{tr('rules_label_category')}</label>
          <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>
            {['general','specs','examples','design','interaction','daily','rules'].map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
        <div className="form-group"><label>{tr('kbm_label_tags')}</label><input value={form.tags} onChange={e=>setForm({...form,tags:e.target.value})} placeholder={tr('kbm_ph_tags')}/></div>
        <div className="form-group"><label>{tr('kbm_label_import')}</label>
          <input type="file" accept=".txt,.md,.markdown,.pdf,text/plain" disabled={fileBusy} onChange={importFile}/>

  const open = (f) => {
    setSelected(f);

      .then(function (d) { setContent((d && d.content) ? d.content : ''); })
      .catch(function (err) { showToast(err && err.message ? String(err.message) : tr('gen_load_fail'), 'err'); });
  };
  const save = () => {
    setSaving(true);
    apiFetch(`${API}/specs/content?path=${encodeURIComponent(selected.path)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: content }),
      timeoutMs: 120000,
    })
      .then(function (r) {
        if (!r.ok) {
          return r.text().then(function (t) {
            var detail = 'HTTP ' + r.status;
            try {
              var j = JSON.parse(t);
              if (j && j.detail != null) detail = String(j.detail);
            } catch (_) { if (t) detail = t.slice(0, 200); }
            throw new Error(detail);
          });
        }
      })
      .then(function () {
        setSaving(false);
        setEditing(false);
        showToast(tr('spec_toast_saved'), 'ok');
      })
      .catch(function () {
        setSaving(false);
        showToast(tr('gen_save_fail'), 'err');
      });
  };

  if (loading) return <PageSkeleton cards={2} />;
  if (error) return <LoadError message={error} onRetry={reload} />;

  const cats = {};
  (files||[]).forEach(f=>{const c=f.category||'root';(cats[c]||(cats[c]=[])).push(f);});

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>

        {editing&&<>
          <button className="btn btn-cancel btn-sm" onClick={()=>setEditing(false)}>{tr('gen_cancel')}</button>
          <button className="btn btn-primary btn-sm" onClick={save} disabled={saving}>{saving ? tr('gen_saving') : tr('gen_save')}</button>
        </>}
      </div>
    </div>
    <div className="grid-2">
      <div className="card scroll-slim panel-scroll">
        {Object.entries(cats).map(([cat,items])=><div key={cat}>
          <div className="file-browser-cat">{cat}</div>
          {items.map(f=><div key={f.path} className={'list-item file-browser-row' + ((selected && selected.path)===f.path?' vibe-list-selected':'')} style={{padding:'5px 8px'}} onClick={()=>open(f)}>
            <div style={{flex:1}}><div className="title" style={{fontSize:12}}>{f.name}</div><div className="meta">{(f.size/1024).toFixed(1)}KB</div></div>
          </div>)}
        </div>)}
      </div>
      <div className="card scroll-slim panel-scroll" style={{display:'flex',flexDirection:'column'}}>
        {!selected?<div className="empty">{tr('spec_pick_file')}</div>:<>
          <div className="doc-path-bar">{selected.path}</div>

              className="textarea-surface" style={{flex:1,resize:'none',minHeight:500,fontSize:12,fontFamily:'ui-monospace,monospace'}}/>:
            <pre className="doc-plain-pre doc-plain-pre--compact" style={{flex:1,margin:0}}>{content}</pre>
          }
        </>}
      </div>
    </div>
  </>;
}

      <div className="card"><h3>{tr('analytics_issues_open')}</h3><div className="stat-val" style={{color:(issues && issues.open)?'#fdba74':'#86efac'}}>{(issues && issues.open)||0}</div></div>
      <div className="card"><h3>{tr('analytics_avg_conf')}</h3><div className="stat-val">{Math.round((avg_confidence||0)*100)}%</div><ConfBar val={avg_confidence||0}/></div>
    </div>
    <div className="grid-2">
      <div className="card">
        <div className="section-title">{tr('analytics_task_status')}</div>
        {Object.entries((tasks && tasks.by_status)||{}).map(([k,v])=><Bar key={k} label={k} val={v} max={(tasks && tasks.total)||1} color={k==='completed'?'#22c55e':k==='blocked'?'#ef4444':'#3b82f6'}/>)}
      </div>
      <div className="card">
        <div className="section-title">{tr('analytics_issue_types')}</div>
        {Object.entries((issues && issues.by_type)||{}).map(([k,v])=><Bar key={k} label={k} val={v} max={(issues && issues.total)||1} color='#f59e0b'/>)}
        <div className="section-title" style={{marginTop:12}}>{tr('analytics_req_priority')}</div>
        {Object.entries((requirements && requirements.by_priority)||{}).map(([k,v])=><Bar key={k} label={k} val={v} max={(requirements && requirements.total)||1} color={k==='P0'?'#ef4444':k==='P1'?'#f59e0b':'#3b82f6'}/>)}
      </div>
    </div>
    {(velocity_trend && velocity_trend.length)>0&&<div className="card" style={{marginTop:12}}>
      <div className="section-title">{tr('analytics_velocity')}</div>
      <div style={{display:'flex',gap:8,alignItems:'flex-end',height:80,padding:'0 8px'}}>
        {velocity_trend.map(s=>{
          const maxV=Math.max(...velocity_trend.map(x=>x.planned||1));
          const h=Math.max(8,Math.round((s.velocity/maxV)*70));
          const hp=Math.max(4,Math.round((s.planned/maxV)*70));
          return <div key={s.id} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
            <div style={{width:'100%',display:'flex',gap:2,alignItems:'flex-end',height:72}}>

              <div style={{flex:1,background:'#334155',borderRadius:'2px 2px 0 0',height:hp+'px'}} title={tr('analytics_tip_planned', { n: s.planned })}/>
            </div>
            <div style={{fontSize:10,color:'#64748b'}}>{(s.id && s.id.replace('SPRINT-','S'))}</div>
          </div>;
        })}
      </div>
      <div style={{fontSize:11,color:'#64748b',marginTop:4}}>{tr('analytics_legend')}</div>
    </div>}
  </>;
}

/** Babel Standalone 对外部 src 的 text/babel 脚本编译可能是异步的；须等 pages/*.js 注册完全局组件后再构建 ALL_PAGES，否则 ReferenceError 白屏。 */
function waitForPageModules(done) {
  var names = ['AgentManager','SkillManager','McpManager','SystemManager','AuthManager','ModelManager','OrchestrationManager','DockerEnvManager','SkillRepoManager','VibeCoding','NotifyManager','CliManager','DesignDocsManager','DevFlowHub','DbConfigPage','TenantsPage','HealthPage','AuditPage','WebhookPage','SprintManager','LogsViewer'];
  var tries = 0;
  function tick() {
    var missing = names.filter(function (n) { return typeof window[n] !== 'function'; });
    if (!missing.length) { done(); return; }
    tries++;
    if (tries > 300) {
      var el = document.getElementById('root');
      if (el) {
        var T = (typeof window !== 'undefined' && typeof window.t === 'function') ? window.t : function (k) { return k; };
        el.innerHTML = '<div style="padding:28px;font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;background:#1e293b;border:1px solid #334155;border-radius:12px;color:#e2e8f0;"><h2 style="margin:0 0 12px;font-size:18px;color:#fca5a5;">' + T('idx_boot_mod_title') + '</h2><p style="color:#94a3b8;font-size:14px;line-height:1.6;">' + T('idx_boot_mod_p1') + '</p><pre style="background:#0f172a;padding:12px;border-radius:8px;font-size:12px;color:#fbbf24;overflow:auto;margin:12px 0;white-space:pre-wrap;">' + missing.join(', ') + '</pre><p style="color:#64748b;font-size:13px;">' + T('idx_boot_mod_hint') + '</p></div>';
      }
      return;
    }
    setTimeout(tick, 16);
  }
  tick();
}

  React.useEffect(function () {
    var onKey = function (e) {
      if (e.key === 'Escape') { setHelpOpen(false); return; }
      if ((e.ctrlKey || e.metaKey) && e.key === '/') {
        var tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
        e.preventDefault();
        setHelpOpen(function (h) { return !h; });
      }
    };
    window.addEventListener('keydown', onKey);
    return function () { window.removeEventListener('keydown', onKey); };
  }, []);

  React.useEffect(function () {
    Promise.all([
      apiFetch(API + '/projects', { timeoutMs: 15000 }).then(function (r) { return r.ok ? r.json() : []; }),
      apiFetch(API + '/state', { timeoutMs: 12000 }).then(function (r) { return r.ok ? r.json() : {}; }),
    ])
      .then(function (results) {
        var list = Array.isArray(results[0]) ? results[0] : [];
        setProjects(list);
        var state = results[1] || {};
        var stored = '';
        try { stored = (localStorage.getItem('sop-current-project-id') || '').trim(); } catch (e) {}
        var fromState = state.project_id ? String(state.project_id) : '';
        var ids = {};
        list.forEach(function (x) { if (x && x.id) ids[x.id] = 1; });
        var pick = '';
        if (fromState && ids[fromState]) pick = fromState;
        else if (stored && ids[stored]) pick = stored;
        else if (list[0] && list[0].id) pick = list[0].id;
        if (pick) {
          try { localStorage.setItem('sop-current-project-id', pick); } catch (e2) {}
          setProjectId(pick);
        }
      })
      .catch(function () {});
  }, []);

  React.useEffect(function () {
    function onHash() {
      try {
        var h = (location.hash || '').replace(/^#/, '').trim();
        if (h && ALL_PAGES && Object.prototype.hasOwnProperty.call(ALL_PAGES, h)) setTab(h);
      } catch (e) {}
    }
    window.addEventListener('hashchange', onHash);
    return function () { window.removeEventListener('hashchange', onHash); };
  }, []);

  React.useEffect(function () {
    function onPop() {
      try {
        var h = (location.hash || '').replace(/^#/, '').trim();
        if (h && ALL_PAGES && Object.prototype.hasOwnProperty.call(ALL_PAGES, h)) setTab(h);
        else if (!h) setTab('dashboard');
      } catch (e) {}
    }
    window.addEventListener('popstate', onPop);
    return function () { window.removeEventListener('popstate', onPop); };
  }, []);

  React.useEffect(function () {
    try {
      var h = (location.hash || '').replace(/^#/, '').trim();
      if (!h || !Object.prototype.hasOwnProperty.call(ALL_PAGES, h)) {
        history.replaceState({ sopTab: 'dashboard' }, '', '#dashboard');
        setTab('dashboard');
      }
    } catch (e) {}
  }, []);

  React.useEffect(() => {
    const onToast = (e) => {
      const { message, type } = e.detail || {};
      if (!message) return;
      const id = Date.now() + Math.random();
      setToasts((t) => [...t, { id, message, type }]);
      setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3400);
    };
    window.addEventListener('devdash-toast', onToast);
    return () => window.removeEventListener('devdash-toast', onToast);
  }, []);

  React.useEffect(() => {
    const onNav = (e) => {
      const id = e.detail && e.detail.tab;
      if (id && typeof id === 'string') goTab(id);
    };
    window.addEventListener('app-set-tab', onNav);
    return () => window.removeEventListener('app-set-tab', onNav);
  }, [goTab]);

  const closeDataHub = () => {
    setDataHubOpen(false);
    setImportPayload(null);
    setImportPreview(null);
    try { if (importFileRef.current) importFileRef.current.value = ''; } catch (e) {}
  };
  const setExpKey = (key, val) => setExpSel((s) => Object.assign({}, s, { [key]: val }));
  const selectAllExport = (on) => {
    setExpSel({
      requirements: !!on, tasks: !!on, issues: !!on, sprints: !!on, agent_reflections: !!on,
    });
  };
  const runExportDownload = () => {
    var allOn = expSel.requirements && expSel.tasks && expSel.issues && expSel.sprints && expSel.agent_reflections;
    var qs = '';
    if (!allOn) {
      var mods = ['requirements', 'tasks', 'issues', 'sprints', 'agent_reflections'].filter(function (k) { return expSel[k]; });
      if (mods.length) qs = '?modules=' + encodeURIComponent(mods.join(','));
    }
    apiFetch(API + '/data-exchange/export' + qs, { timeoutMs: 120000 })
      .then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error(t || 'HTTP ' + r.status); });
        return r.blob();
      })
      .then(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'sop-export.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(tk('dh_toast_export_ok'), 'ok');
      })
      .catch(function (e) { showToast((e && e.message) || String(e), 'err'); });
  };
  const onImportFileChange = (e) => {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var j = JSON.parse(String(reader.result || ''));
        setImportPayload(j);
        setImportPreview({
          requirements: Array.isArray(j.requirements) ? j.requirements.length : 0,
          tasks: Array.isArray(j.tasks) ? j.tasks.length : 0,
          issues: Array.isArray(j.issues) ? j.issues.length : 0,
          sprints: Array.isArray(j.sprints) ? j.sprints.length : 0,
        });
      } catch (err) {
        setImportPayload(null);
        setImportPreview(null);
        showToast(tk('dh_err_json'), 'err');
      }
    };
    reader.readAsText(f);
  };
  const runImportMerge = () => {
    if (!canDataHubImport) {
      showToast(tk('dh_import_forbidden'), 'err');
      return;
    }
    if (!importPayload) { showToast(tk('dh_err_json'), 'err'); return; }
    var body = { mode: 'merge' };
    ['requirements', 'tasks', 'issues', 'sprints'].forEach(function (k) {
      if (Array.isArray(importPayload[k])) body[k] = importPayload[k];
    });
    apiFetch(API + '/data-exchange/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      timeoutMs: 120000,
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) {
          var msg = (res.d && (res.d.detail || res.d.message)) || tk('dh_toast_import_fail');
          showToast(typeof msg === 'string' ? msg : tk('dh_toast_import_fail'), 'err');
          return;
        }
        var c = res.d && res.d.counts ? res.d.counts : {};
        showToast(tk('dh_toast_import_ok') + ' · ' + JSON.stringify(c), 'ok');
        closeDataHub();
      })
      .catch(function () { showToast(tk('dh_toast_import_fail'), 'err'); });
  };

  const apiOrigin = () => String(API).replace(/\/api\/v1\/?$/, '');
  const doLogout = () => {
    var token = '';
    try { token = localStorage.getItem('sop-token') || ''; } catch (e) {}
    var headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    apiFetch(API + '/auth/logout', { method: 'POST', headers: headers })
      .catch(function () {})
      .finally(function () {
        try {
          localStorage.removeItem('sop-token');
          localStorage.removeItem('sop-user');
        } catch (e) {}
        window.location.replace('login.html');
      });
  };
  const toggleCollapsed = () => setCollapsed((c) => {
    const n = !c;
    try { localStorage.setItem('devdash-sidebar-collapsed', n ? '1' : '0'); } catch (_) {}
    return n;
  });

  return <div className="app-shell">
    <div className="toast-host" aria-live="polite">
      {toasts.map((t) => (
        <div key={t.id} className={'toast ' + (t.type === 'ok' ? 'ok' : t.type === 'err' ? 'err' : 'info')} role="status">{t.message}</div>
      ))}
    </div>
    {helpOpen && <div className="modal-bg" onClick={() => setHelpOpen(false)}>
      <div className="modal" style={{width:520,maxWidth:'94vw'}} onClick={(e) => e.stopPropagation()}>
        <h3>{tk('help_title')}</h3>
        <p style={{fontSize:12,color:'var(--text2)',lineHeight:1.6}}>{tk('help_intro_p1')}<strong>{tk('help_intro_no_build')}</strong>{tk('help_intro_p2')}<code style={{fontSize:11}}>{API}</code>{tk('help_intro_p3')}</p>
        <ul style={{fontSize:13,color:'var(--text)',lineHeight:1.85,margin:'8px 0 0 18px',padding:0}}>
          <li><span className="help-kbd">Ctrl / ⌘ + /</span>{tk('help_li_ctrl_rest')}</li>
          <li><span className="help-kbd">Esc</span>{tk('help_li_esc_rest')}</li>
          <li>{tk('help_li_sidebar')}</li>
          <li>{tk('help_hash_a')}<span className="help-kbd">{tk('help_hash_tag')}</span>{tk('help_hash_b')}<code style={{fontSize:11}}>#vibe</code>{tk('help_hash_sep')}<code style={{fontSize:11}}>#plan</code>{tk('help_hash_c')}</li>
          <li>{tk('help_li_datahub_short')}</li>
          <li>{tk('help_mp_1')}<code style={{fontSize:11}}>X-Project-Id</code>{tk('help_mp_2')}<code style={{fontSize:11}}>PROJECT_PATH</code>{tk('help_mp_3')}<code style={{fontSize:11}}>PROJECT_ID</code>{tk('help_mp_4')}</li>
          <li>{tk('help_backend_pre')}<code style={{fontSize:11}}>PROJECT_PATH</code>{tk('help_backend_post')}</li>
        </ul>
        <div className="modal-actions" style={{flexWrap:'wrap',gap:8}}>
          <button type="button" className="btn btn-cancel" onClick={() => setHelpOpen(false)}>{tk('help_close')}</button>
          <button type="button" className="btn btn-sm btn-muted" onClick={() => window.open(apiOrigin() + '/docs', '_blank')}>{tk('help_openapi')}</button>
          <button type="button" className="btn btn-sm btn-muted" onClick={() => window.open(apiOrigin() + '/redoc', '_blank')}>{tk('help_redoc')}</button>
        </div>
      </div>
    </div>}
    {dataHubOpen && <div className="modal-bg" onClick={closeDataHub}>
      <div className="modal datahub-modal" style={{ width: 540, maxWidth: '94vw' }} onClick={(e) => e.stopPropagation()}>
        <h3>{tk('dh_title')}</h3>
        <p className="datahub-intro">{tk('dh_intro')}</p>
        <h4>{tk('dh_sec_export')}</h4>
        {['requirements', 'tasks', 'issues', 'sprints', 'agent_reflections'].map((key) => (
          <label key={key} className="datahub-row">
            <input type="checkbox" checked={!!expSel[key]} onChange={(e) => setExpKey(key, e.target.checked)} />
            <span className="dh-label">
              <strong>{tk('dh_mod_' + key)}</strong>
              <span>{tk('dh_mod_' + key + '_d')}</span>
            </span>
          </label>
        ))}
        <div className="datahub-actions">
          <button type="button" className="btn btn-sm btn-muted" onClick={() => selectAllExport(true)}>{tk('dh_sel_all')}</button>
          <button type="button" className="btn btn-sm btn-muted" onClick={() => selectAllExport(false)}>{tk('dh_sel_none')}</button>
          <button type="button" className="btn btn-primary btn-sm" onClick={runExportDownload}>{tk('dh_btn_download')}</button>
        </div>
        <h4>{tk('dh_sec_import')}</h4>
        <p className="datahub-note">{tk('dh_import_hint')}</p>
        <p className="datahub-note" style={{ borderLeft: '3px solid var(--accent)', paddingLeft: 10, marginTop: 8 }}>{tk('dh_import_role_gate')}</p>
        <input ref={importFileRef} type="file" accept=".json,application/json,.txt" style={{ display: 'none' }} onChange={onImportFileChange} />
        <div className="datahub-actions">
          <button type="button" className="btn btn-sm btn-muted" disabled={!canDataHubImport} title={!canDataHubImport ? tk('dh_import_forbidden') : ''} onClick={() => importFileRef.current && importFileRef.current.click()}>{tk('dh_pick_file')}</button>
          <button type="button" className="btn btn-primary btn-sm" disabled={!canDataHubImport || !importPayload} title={!canDataHubImport ? tk('dh_import_forbidden') : ''} onClick={runImportMerge}>{tk('dh_btn_import')}</button>
        </div>
        {importPreview && <div className="datahub-preview"><strong>{tk('dh_preview')}</strong> · {tk('dh_preview_counts').replace('{rq}', String(importPreview.requirements)).replace('{tq}', String(importPreview.tasks)).replace('{iq}', String(importPreview.issues)).replace('{sq}', String(importPreview.sprints))}</div>}
        <div className="modal-actions" style={{ marginTop: 16 }}>
          <button type="button" className="btn btn-cancel" onClick={closeDataHub}>{tk('dh_close')}</button>
        </div>
      </div>
    </div>}
    {/* 顶栏 */}
    <div className="topbar">
      <button type="button" className="btn-icon" onClick={toggleCollapsed} title={tk('topbar_toggle_sidebar')}>☰</button>
      <button type="button" className="btn-icon" onClick={() => { try { window.history.back(); } catch (e) {} }} title={tk('nav_back')}>←</button>
      <span className="topbar-crumb" aria-current="page">{currentTabLabel}</span>
      <div className="topbar-brand" title={tk('topbar_brand_title')}>
        <img className="topbar-logo-img" src="/brand-mark.svg" width="32" height="32" alt="" decoding="async" fetchPriority="high"/>
        <span className="topbar-logo">{tk('topbar_brand_title')}</span>
      </div>
      <span className="topbar-badge">{tk('badge_admin')}</span>
      {projects.length > 1 ? (
        <label className="text-tertiary" style={{ fontSize: 11, display: 'flex', alignItems: 'center', gap: 6, maxWidth: 'min(280px, 36vw)' }} title={tk('topbar_project_hint')}>
          <span style={{ flexShrink: 0 }}>{tk('topbar_project')}</span>
          <select
            className="topbar-select"
            value={projectId}
            onChange={(e) => {
              var v = e.target.value;
              try { localStorage.setItem('sop-current-project-id', v); } catch (_) {}
              setProjectId(v);
              window.dispatchEvent(new CustomEvent('devdash-project-change', { detail: { projectId: v } }));
            }}
            aria-label={tk('topbar_project')}
          >
            {projects.map((p) => (
              <option key={p.id} value={p.id}>{p.name || p.id}</option>
            ))}
          </select>
        </label>
      ) : projectId ? (
        <span className="topbar-project" title={tk('topbar_project_hint')}>📁 {projects[0] ? (projects[0].name || projectId) : projectId}</span>
      ) : null}
      <div className={'topbar-health ' + (apiHealth === 'ok' ? 'ok' : apiHealth === 'down' ? 'down' : 'checking')} title={tk('topbar_health_tip')}>
        <span className="health-dot" aria-hidden="true"/>
        {apiHealth === 'ok' ? <>{tk('api_online')}{apiPingMs != null ? ' · ' + apiPingMs + 'ms' : ''}{apiVer ? ' · v' + apiVer : ''}</> : apiHealth === 'down' ? <>{tk('api_offline')}</> : <>{tk('api_checking')}</>}
      </div>
      <div className="topbar-right">
        <div className="topbar-tools">
        <label className="text-tertiary" style={{fontSize:10,marginRight:2}} htmlFor="devdash-theme-sel">{tk('topbar_theme')}</label>
        <select id="devdash-theme-sel" className="topbar-select" value={theme} onChange={(e) => setTheme(e.target.value)} aria-label={tk('topbar_theme')}>
          <option value="dark">{tk('theme_dark')}</option>
          <option value="dim">{tk('theme_dim')}</option>
          <option value="light">{tk('theme_light')}</option>
          <option value="contrast">{tk('theme_contrast')}</option>
        </select>
        <label className="text-tertiary" style={{fontSize:10,marginRight:2}} htmlFor="devdash-lang-sel">{tk('topbar_lang')}</label>
        <select id="devdash-lang-sel" className="topbar-select" value={lang} onChange={(e) => setLang(e.target.value)} aria-label={tk('topbar_lang')}>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <a className="btn btn-sm btn-muted" style={{fontSize:11,whiteSpace:'nowrap',textDecoration:'none'}} href="/?shell=1#/dashboard" title={tk('topbar_light_shell')}>{tk('topbar_light_shell')}</a>
        <button type="button" className="btn-icon" onClick={() => setHelpOpen(true)} title={tk('topbar_help')}>?</button>
        <button type="button" className="topbar-hub-btn" onClick={() => setDataHubOpen(true)} title={tk('dh_title')}>
          <span className="topbar-hub-ic" aria-hidden="true">⇄</span>
          <span>{tk('topbar_data_hub')}</span>
        </button>
        </div>
        <div className="topbar-user">
          {window.__CURRENT_USER__ && <span style={{fontSize:12,color:'var(--text2)',whiteSpace:'nowrap'}}>
            👤 {window.__CURRENT_USER__.username}
            <span style={{fontSize:10,color:'var(--text3)',marginLeft:4}}>[{(() => { var r = String(window.__CURRENT_USER__.role || ''); var k = 'role_' + r; var s = tk(k); return s === k ? r : s; })()}]</span>
          </span>}
          <button type="button" className="btn btn-sm btn-muted" onClick={doLogout} title={tk('topbar_logout')}>{tk('topbar_logout')}</button>
        </div>
      </div>
    </div>

    <div className="body-wrap">
      {/* 左侧菜单 */}
      <div className={`sidebar scroll-slim${collapsed?' collapsed':''}`}>
        {MENU_GROUPS.map((g, gi) => {
          var open = groupOpen[g.id] !== false;
          return <div key={g.id} className="sidebar-group">
            {gi > 0 && <div className="sidebar-divider"/>}
            {!collapsed ? (
              <button type="button" className="sidebar-group-head" onClick={() => toggleGroup(g.id)} aria-expanded={open} title={open ? tk('sidebar_collapse') : tk('sidebar_expand')}>
                <span className="sidebar-chevron" aria-hidden="true">{open ? '▼' : '▸'}</span>
                <span>{g.label}</span>
              </button>
            ) : null}
            {(collapsed || open) && g.items.map(item => <div key={item.id}
              role="button"
              tabIndex={0}
              className={`sidebar-item${tab===item.id?' active':''}`}
              onClick={()=>goTab(item.id)}
              onKeyDown={(e)=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); goTab(item.id);} }}
              title={collapsed ? item.label : ''}>
              <span className="sidebar-icon">{item.icon}</span>
              <span>{item.label}</span>
            </div>)}
          </div>;
        })}
      </div>

      {/* 主内容 */}
      <div className="main-content page-enter scroll-slim app-main" key={tab}>
        {ALL_PAGES[tab] || <div className="empty">{tk('page_missing')}: {tab}</div>}
      </div>
    </div>
  </div>;
}

  var _rootEl = document.getElementById('root');
  if (_rootEl) {
    if (typeof ReactDOM.createRoot === 'function') {
      ReactDOM.createRoot(_rootEl).render(<AppV3/>);
    } else {
      ReactDOM.render(<AppV3/>, _rootEl);
    }
  }
}

waitForPageModules(mountApp);
</script>
</body>
</html>
