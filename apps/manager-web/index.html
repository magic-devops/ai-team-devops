<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      (function () {
        try {
          var k = "sop-ui-theme";
          var v = localStorage.getItem(k);
          var dark =
            v === "dark" ||
            v === "graphite" ||
            ((!v || v === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var palette = v && v !== "system" ? (v === "dark" ? "graphite" : v) : dark ? "graphite" : "light";
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.dataset.themePref = v || "system";
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.themePalette = palette;
          function syncBody() {
            if (document.body) document.body.classList.toggle("dark", dark);
          }
          if (document.body) syncBody();
          else document.addEventListener("DOMContentLoaded", syncBody);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOP Manager</title>
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
