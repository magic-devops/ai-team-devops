      - suggestions
      - suggested_acceptance_criteria
      - duplicates
      - linked_tasks
      - next_actions
      - reviewed_at
      properties:
        score:
          maximum: 100
          minimum: 0
          title: Score
          type: integer
        level:
          enum:
          - ready
          - review
          - needs_work
          title: Level
          type: string
        risks:
          items:
            $ref: '#/components/schemas/AssistanceReviewRisk'
          maxItems: 40
          title: Risks
          type: array
        suggestions:
          items:
            maxLength: 2000
            minLength: 1
            type: string
          maxItems: 40
          title: Suggestions
          type: array
        suggested_acceptance_criteria:
          items:
            maxLength: 2000
            minLength: 1
            type: string
          maxItems: 80
          title: Suggested Acceptance Criteria
          type: array
        duplicates:
          items:
            $ref: '#/components/schemas/AssistanceReviewDuplicate'
          maxItems: 5
          title: Duplicates
          type: array
        next_actions:
          items:
            maxLength: 2000
            minLength: 1
            type: string
          maxItems: 40
          title: Next Actions
          type: array
        ok: *id003
        generation: *id004
        expected_version: *id005
        requirement_id: *id001
        linked_tasks: *id002
        reviewed_at: *id001
      description: Advisory clarity/risk score. ready is a suggestion label and does not approve a requirement or advance
        its delivery stage.
    AssistancePrototypeResult:
      type: object
      required:
      - ok
      - generation
      - expected_version
      - content
      - image_url
      properties:
        ok: *id003
        generation: *id004
        expected_version: *id005
        content: *id001
        image_url:
          type: 'null'
      description: Editable Markdown preview. Generation does not overwrite the legacy prototype file or append a delivery
        artifact; explicit prototype/apply is required.
