  /api/v1/projects/portfolio:
    get:
      tags:
      - projects
      summary: Project Portfolio
      operationId: projectPortfolio
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          default: ''
          title: Q
      - name: business_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Business Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              enum:
              - planning
              - active
              - paused
              - archived
              type: string
          - type: 'null'
          title: Status
      - name: risk
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              enum:
              - blocked
              - awaiting_review
              - recorded_completed
              - overdue_unverified
              - acceptance_unavailable
              - owner_unavailable
              - open_issues
              type: string
          - type: 'null'
          title: Risk
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 1024
          default: ''
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 30
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPortfolioResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication required
        '403':
          description: Project access or lifecycle authority denied
      description: Read current delivery facts for the full authorized filtered set, then page by stable Project.id. Repeated
        status/risk filters are supported; q matches name or ID. Risk categories overlap, while total_items counts unique entities.
        summary_scope is filtered_projects, never just the current page. All states use live facts; archived historical facts
        are provenance only. Viewing never selects the working project. Cursors bind the normalized query, tenant and caller;
        each request recomputes current facts and does not freeze later pages.
  /api/v1/projects/{project_id}/portfolio:
    get:
      tags:
      - projects
      summary: Project Portfolio Detail
      operationId: projectPortfolioDetail
      security:
      - bearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPortfolioDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication required
        '403':
          description: Project access or lifecycle authority denied
        '404':
          description: Project not found in the current tenant and membership scope
      description: Read one authorized canonical project with current evidence, complete deduplicated risks, exact targets and
        last_archive provenance. Unknown or inaccessible IDs never select another project. facts_source is always live; a historical
        archive snapshot cannot substitute for current verified counts. Risk targets include the project ID.
  /api/v1/delivery/project-lifecycle-preview:
    post:
      tags:
      - delivery
      summary: Project Lifecycle Preview
      operationId: deliveryProjectLifecyclePreview
      security:
      - bearerAuth: []
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        schema:
          type: string
          title: X-Project-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectLifecyclePreviewInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLifecyclePreviewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication required
        '403':
          description: Project access or lifecycle authority denied
      description: Pure read requiring project lifecycle/configure authority and X-Project-Id. Freeze the returned version and
        preview_basis with the proposed target_status and reason for project.lifecycle. The basis covers canonical configuration,
        complete membership, current evidence, all Manager execution intents and the UTC day; it excludes the outer CAS version
        and transient as_of clock. Archive returns every unclosed Manager intent as a blocker, including missing-task and pending
        intents. Unfinished work is a warning, not an archive blocker. No workspace or preview row is created. Archive does
        not revoke independent Hermes authority or stop external processes.
  /api/v1/delivery/quality:
    get:
