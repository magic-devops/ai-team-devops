      type: object
      required:
      - ok
      - exists
      - content
      - versions
      properties:
        ok: *id003
        exists: *id003
        content: *id001
        versions:
          type: array
          items:
            $ref: '#/components/schemas/AssistancePrototypeArtifact'
        artifact_id: *id001
        current_revision: *id002
        stale: *id003
        source: *id001
      description: Most recently recorded SQL prototype and all prototype artifact revisions. stale compares its revision
        with current_revision. If there are no SQL artifacts, an existing legacy Markdown file remains readable as source=legacy_file;
        an absent prototype returns exists=false.
    AssistanceError:
      type: object
      required:
      - detail
      properties:
        detail: {}
      description: HTTPException detail is a string or structured code/message. Generated failures are durable and replay
        without another provider call; schema validation errors may return a validation list.
