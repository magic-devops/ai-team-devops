        user: { $ref: "#/components/schemas/UserOut" }

    PairOut:
      type: object
      required: [project_id, tenant_id, api_key]
      properties:
        project_id: { type: string }
        tenant_id: { type: string }
        api_key: { type: string, description: 一次性返回，立即写入 keyring }
