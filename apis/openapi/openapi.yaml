openapi: 3.1.0
info:
  title: ai-team-devops Manager API
  summary: Schema-First 单一事实源（v1）
  description: |
    所有 `/api/v1/*` REST 接口的权威契约。
    - 生成 Python Pydantic / TypeScript SDK 都源于此文件
    - 修改本文件 = 触发 CI 重新生成代码 + 文档
    - 命名规范见 `docs/architecture/MODULES.md`
  version: 2.0.0
  contact:
    name: superhero
    email: zyc2012518@gmail.com
  license:
    name: MIT

servers:
  - url: https://manager.example.com
    description: 生产
  - url: http://localhost:8765
    description: 本地

tags:
  - { name: auth,         description: 认证与会话 }
  - { name: tenants,      description: 租户管理（super_admin） }
  - { name: projects,     description: 项目管理 }
  - { name: delivery,     description: 项目交付、执行证据与验收 }
  - { name: requirements, description: 需求 }
  - { name: tasks,        description: 任务 }
  - { name: issues,       description: 问题 }
  - { name: sprints,      description: Sprint }
  - { name: agents,       description: Agent 配置 }
  - { name: skills,       description: 技能库 }
  - { name: llm,          description: LLM 网关 }
  - { name: models,       description: 项目模型配置与提供商 }
  - { name: rag,          description: 检索 / 知识库 }
  - { name: workflow,     description: 工作流 }
  - { name: vibe,         description: Vibe Coding 会话 }
  - { name: webhooks,     description: Webhook 出站 }
  - { name: audit,        description: 审计 }
  - { name: plugins,      description: 插件管理 }
  - { name: marketplace,  description: 规约 / 技能市场 }
  - { name: copilot,      description: 内嵌 AI 助手 }
  - { name: platforms,    description: AI Agent / CLI / IDE 平台注册表 }
  - { name: health,       description: 探活 }

security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /api/v1/requirements/parse-document:
    parameters:
    - $ref: '#/components/parameters/RequiredBusinessProjectId'
    post:
      operationId: parseRequirementDocument
      tags:
      - requirements
      summary: Preview requirements extracted from a document
      description: Requires project write permission. Records an independent SQL generation receipt before calling
        the configured project model gateway. AI failures, quota exhaustion and disabled/unavailable providers return
        HTTP failures; they never silently become successful rule output. Matching successful/failed/in-progress retries
        do not start another paid call. An explicit key remains tied to the original request; omitted keys derive
        from normalized input and the requirement basis. Changed input with the same key conflicts. A returned suggestion
        is never automatic requirement approval, task completion or stage advancement. generator defaults to ai; explicit
        rules reports generation.source=rules and legacy source=local_rules. Preview alone imports nothing. Select
        and edit items, then call batch with generation_id/version/key.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
        sopTimestamp: []
        sopNonce: []
        sopSignature: []
      responses:
        '200':
          description: Current scoped result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceParseDocumentResult'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '422':
          description: Request schema or selected edited fields are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '409':
          description: Generation in progress, idempotency input conflict, or requirement basis changed during generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '429':
          description: Configured project model quota exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '502':
          description: Provider call or structured model output failed; recorded outcome replays without another model
            call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '503':
          description: Configured model/provider/credential/adapter is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistanceParseDocumentInput'
  /api/v1/requirements/batch:
    parameters:
    - $ref: '#/components/parameters/RequiredBusinessProjectId'
    post:
      operationId: importRequirementSelection
      tags:
      - requirements
      summary: Import an explicitly confirmed edited selection
      description: Requires project write permission and the original generation actor/action/project. Only explicit
        adoption writes business state. Checks current requirement basis/revision where applicable and the workspace
        expected_version using SQL CAS. Successful matching receipt replays before checking the basis/version changed
        by the first application; changed input or target under the same key conflicts. A 409 requires reviewing current
        state, preserving generation provenance and explicitly reconfirming with a new request key when input changes.
        Does not approve a delivery stage. Generated selection imports are atomic, including SQL assignment and source
        metadata. The legacy manual branch with no generation fields remains available and claims no model provenance.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
        sopTimestamp: []
        sopNonce: []
        sopSignature: []
      responses:
        '200':
          description: Current scoped result
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AssistanceBatchAdoptionResult'
                - $ref: '#/components/schemas/AssistanceManualBatchResult'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '422':
          description: Request schema or selected edited fields are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '409':
          description: Idempotency input/target conflict, changed requirement basis/revision, concurrent workspace
            update or stale expected_version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistanceBatchImportInput'
  /api/v1/requirements/{req_id}/review:
    parameters:
    - $ref: '#/components/parameters/RequiredBusinessProjectId'
    - name: req_id
      in: path
      required: true
      schema:
        type: string
      description: Identifier in the selected authorized project
    post:
      operationId: previewRequirementReview
      tags:
      - requirements
      summary: Generate advisory requirement review
      description: Requires project write permission. Records an independent SQL generation receipt before calling
        the configured project model gateway. AI failures, quota exhaustion and disabled/unavailable providers return
        HTTP failures; they never silently become successful rule output. Matching successful/failed/in-progress retries
        do not start another paid call. An explicit key remains tied to the original request; omitted keys derive
        from normalized input and the requirement basis. Changed input with the same key conflicts. A returned suggestion
        is never automatic requirement approval, task completion or stage advancement. No body is compatible with
        explicit rules mode by default; generator=ai invokes a structured gateway review. Scores and ready labels
        are advisory. New criteria are not applied until apply-review.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
        sopTimestamp: []
        sopNonce: []
        sopSignature: []
      responses:
        '200':
          description: Current scoped result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceReviewResult'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '422':
          description: Request schema or selected edited fields are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '409':
          description: Generation in progress, idempotency input conflict, or requirement basis changed during generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '429':
          description: Configured project model quota exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '502':
          description: Provider call or structured model output failed; recorded outcome replays without another model
            call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '503':
          description: Configured model/provider/credential/adapter is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistanceReviewInput'
  /api/v1/requirements/{req_id}/apply-review:
    parameters:
    - $ref: '#/components/parameters/RequiredBusinessProjectId'
    - name: req_id
      in: path
      required: true
      schema:
        type: string
      description: Identifier in the selected authorized project
    post:
      operationId: adoptRequirementReview
      tags:
      - requirements
      summary: Adopt edited criteria, tags and notes
      description: Requires project write permission and the original generation actor/action/project. Only explicit
        adoption writes business state. Checks current requirement basis/revision where applicable and the workspace
        expected_version using SQL CAS. Successful matching receipt replays before checking the basis/version changed
        by the first application; changed input or target under the same key conflicts. A 409 requires reviewing current
        state, preserving generation provenance and explicitly reconfirming with a new request key when input changes.
        Does not approve a delivery stage. The assistance basis includes design/review input fields and differs from
        task-plan basis. Legacy requests without generation fields are manual edits and never claim model origin.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
        sopTimestamp: []
        sopNonce: []
        sopSignature: []
      responses:
        '200':
          description: Current scoped result
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AssistanceReviewAdoptionResult'
                - $ref: '#/components/schemas/AssistanceManualReviewResult'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '422':
          description: Request schema or selected edited fields are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '409':
          description: Idempotency input/target conflict, changed requirement basis/revision, concurrent workspace
            update or stale expected_version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistanceApplyReviewInput'
  /api/v1/requirements/{req_id}/prototype:
    parameters:
    - $ref: '#/components/parameters/RequiredBusinessProjectId'
    - name: req_id
      in: path
      required: true
      schema:
        type: string
      description: Identifier in the selected authorized project
    get:
      operationId: getRequirementPrototype
      tags:
      - requirements
      summary: Read recorded prototype revisions
      description: Project members may read the latest SQL prototype and preserved versions. Old-revision evidence
        is marked stale; an existing legacy file remains readable if no SQL prototype is recorded.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
        sopTimestamp: []
        sopNonce: []
        sopSignature: []
      responses:
        '200':
          description: Current scoped result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistancePrototypeCurrent'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '422':
          description: Request schema or selected edited fields are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
    post:
      operationId: previewRequirementPrototype
      tags:
      - requirements
      summary: Generate editable product design preview
      description: Requires project write permission. Records an independent SQL generation receipt before calling
        the configured project model gateway. AI failures, quota exhaustion and disabled/unavailable providers return
        HTTP failures; they never silently become successful rule output. Matching successful/failed/in-progress retries
        do not start another paid call. An explicit key remains tied to the original request; omitted keys derive
        from normalized input and the requirement basis. Changed input with the same key conflicts. A returned suggestion
        is never automatic requirement approval, task completion or stage advancement. Modes are wireframe, user_journey
        and ia. Does not overwrite prototype files or save artifacts. gen_image=true is unsupported and rejected with
        422 before any provider request.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
        sopTimestamp: []
        sopNonce: []
        sopSignature: []
      responses:
        '200':
          description: Current scoped result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistancePrototypeResult'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '422':
          description: Request schema or selected edited fields are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '409':
          description: Generation in progress, idempotency input conflict, or requirement basis changed during generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '429':
          description: Configured project model quota exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '502':
          description: Provider call or structured model output failed; recorded outcome replays without another model
            call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '503':
          description: Configured model/provider/credential/adapter is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistancePrototypeGenerateInput'
  /api/v1/requirements/{req_id}/prototype/apply:
    parameters:
    - $ref: '#/components/parameters/RequiredBusinessProjectId'
    - name: req_id
      in: path
      required: true
      schema:
        type: string
      description: Identifier in the selected authorized project
    post:
      operationId: adoptRequirementPrototype
      tags:
      - requirements
      summary: Append an explicitly confirmed prototype artifact
      description: Requires project write permission and the original generation actor/action/project. Only explicit
        adoption writes business state. Checks current requirement basis/revision where applicable and the workspace
        expected_version using SQL CAS. Successful matching receipt replays before checking the basis/version changed
        by the first application; changed input or target under the same key conflicts. A 409 requires reviewing current
        state, preserving generation provenance and explicitly reconfirming with a new request key when input changes.
        Does not approve a delivery stage. Saves the edited Markdown as a new recorded prototype artifact; preserves
        earlier versions and source usage metadata.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
        sopTimestamp: []
        sopNonce: []
        sopSignature: []
      responses:
        '200':
          description: Current scoped result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistancePrototypeAdoptionResult'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '422':
          description: Request schema or selected edited fields are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '409':
          description: Idempotency input/target conflict, changed requirement basis/revision, concurrent workspace
            update or stale expected_version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistancePrototypeApplyInput'
  /api/v1/requirements/{req_id}/assistance-history:
    parameters:
    - $ref: '#/components/parameters/RequiredBusinessProjectId'
    - name: req_id
      in: path
      required: true
      schema:
        type: string
      description: Identifier in the selected authorized project
    get:
      operationId: getRequirementAssistanceHistory
      tags:
      - requirements
      summary: Read generation history and current adoption basis
      description: Project members may read scoped history, model/provider/actual usage, errors and adoption receipts.
        expected_version/requirement_basis/requirement_revision describe current state; historical result.generation.stale
        is true for old scope. Only the original generator actor may adopt a successful preview.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
        sopTimestamp: []
        sopNonce: []
        sopSignature: []
      responses:
        '200':
          description: Current scoped result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceHistoryResult'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '422':
          description: Request schema or selected edited fields are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
  /api/v1/workflows/start:
    parameters:
    - $ref: '#/components/parameters/RequiredBusinessProjectId'
    post:
      operationId: startScopedWorkflow
      tags:
      - workflow
      summary: Start or recover a stable scoped workflow
      description: Requires an authenticated explicit project; members may read, while POST operations require project
        write permission. The local memory engine persists a tenant/project-scoped journal. It does not replace CI
        verification, delivery acceptance, business task completion or automatic merging. Waiting, paused and timeout_pending
        phases remain open until a permitted explicit human decision. Restart recovers journalled state and does not
        silently repeat model calls. Configured Temporal workers and scoped state/signal contracts are not implemented;
        unsupported Temporal operations return 503. Matching explicit workflow_id/type/args/actor replays; changed
        input returns 409. Omitted workflow_id creates a new random ID. code_review and bug_triage record actual model
        success/failure/missing input and wait for a human; sprint_lifecycle never changes canonical task completion.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
        sopTimestamp: []
        sopNonce: []
        sopSignature: []
      responses:
        '200':
          description: Current scoped result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSnapshot'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '422':
          description: Request schema or selected edited fields are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '409':
          description: Stable workflow ID/signal ID changed input, invalid current phase, terminal instance or unfinished
            result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
        '503':
          description: Configured scoped Temporal worker operation is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStartInput'
  /api/v1/workflows/types:
    parameters:
    - $ref: '#/components/parameters/RequiredBusinessProjectId'
    get:
      operationId: listScopedWorkflowTypes
      tags:
      - workflow
      summary: Discover supported workflow types and signals
      description: Requires an authenticated explicit project; members may read, while POST operations require project
        write permission. The local memory engine persists a tenant/project-scoped journal. It does not replace CI
        verification, delivery acceptance, business task completion or automatic merging. Waiting, paused and timeout_pending
        phases remain open until a permitted explicit human decision. Restart recovers journalled state and does not
        silently repeat model calls. Configured Temporal workers and scoped state/signal contracts are not implemented;
        unsupported Temporal operations return 503. Returns registered types and their supported signals.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
        sopTimestamp: []
        sopNonce: []
        sopSignature: []
      responses:
        '200':
          description: Current scoped result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTypesResult'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '422':
          description: Request schema or selected edited fields are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
  /api/v1/workflows/engine/status:
    parameters:
    - $ref: '#/components/parameters/RequiredBusinessProjectId'
    get:
      operationId: getScopedWorkflowEngineStatus
      tags:
      - workflow
      summary: Inspect actual workflow engine capability
      description: Requires an authenticated explicit project; members may read, while POST operations require project
        write permission. The local memory engine persists a tenant/project-scoped journal. It does not replace CI
        verification, delivery acceptance, business task completion or automatic merging. Waiting, paused and timeout_pending
        phases remain open until a permitted explicit human decision. Restart recovers journalled state and does not
        silently repeat model calls. Configured Temporal workers and scoped state/signal contracts are not implemented;
        unsupported Temporal operations return 503. worker_supported and durability distinguish local journal operation
        from unsupported Temporal worker contracts.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
        sopTimestamp: []
        sopNonce: []
        sopSignature: []
      responses:
        '200':
          description: Current scoped result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowEngineStatus'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '422':
          description: Request schema or selected edited fields are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
  /api/v1/workflows/instances:
    parameters:
    - $ref: '#/components/parameters/RequiredBusinessProjectId'
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 100
    - name: status
      in: query
      required: false
      schema:
        type: string
        default: ''
    - name: type
      in: query
      required: false
      schema:
        type: string
        default: ''
    - name: q
      in: query
      required: false
      schema:
        type: string
        default: ''
    get:
      operationId: listScopedWorkflowInstances
      tags:
      - workflow
      summary: List filtered project workflow instances
      description: Requires an authenticated explicit project; members may read, while POST operations require project
        write permission. The local memory engine persists a tenant/project-scoped journal. It does not replace CI
        verification, delivery acceptance, business task completion or automatic merging. Waiting, paused and timeout_pending
        phases remain open until a permitted explicit human decision. Restart recovers journalled state and does not
        silently repeat model calls. Configured Temporal workers and scoped state/signal contracts are not implemented;
        unsupported Temporal operations return 503. Returns per-instance and aggregate effective permissions.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
        sopTimestamp: []
        sopNonce: []
        sopSignature: []
      responses:
        '200':
          description: Current scoped result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstancesResult'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '422':
          description: Request schema or selected edited fields are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceError'
  /api/v1/workflows/events:
    parameters:
    - $ref: '#/components/parameters/RequiredBusinessProjectId'
    - name: limit
      in: query
      required: false
      schema:
        type: integer
