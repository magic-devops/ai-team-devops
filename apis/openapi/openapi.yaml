            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Generation Id
        requirement_basis:
          anyOf:
          - maxLength: 64
            minLength: 64
            type: string
          - type: 'null'
          default: null
          title: Requirement Basis
        expected_version:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Expected Version
        idempotency_key:
          anyOf:
          - maxLength: 100
            minLength: 8
            type: string
          - type: 'null'
          default: null
          title: Idempotency Key
      title: ApplyReviewBody
      type: object
      allOf:
      - if:
          anyOf:
          - required:
            - generation_id
            properties:
              generation_id:
                not:
                  type: 'null'
          - required:
            - requirement_basis
            properties:
              requirement_basis:
                not:
                  type: 'null'
          - required:
            - expected_version
            properties:
              expected_version:
                not:
                  type: 'null'
          - required:
            - idempotency_key
