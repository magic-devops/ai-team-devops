  /api/v1/delivery/task-plan-preview:
    post:
      tags: [delivery]
      operationId: deliveryTaskPlanPreview
      summary: Preview an editable task plan against a fixed requirement revision
      description: |
        Requires project write permission. This creates no business tasks or execution
        processes. The generator is either an explicit template or the existing model
        gateway; AI failures never fall back to template success. Persist expected_version
        and idempotency_key before sending. Replaying the same successful request returns
        the stored preview, while an in-progress attempt returns a conflict and a failed
        attempt replays its original error rather than silently repeating model work.
        The preview version remains the input version.
        Submit the selected, edited items through tasks.plan to create canonical tasks.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: X-Project-Id, in: header, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskPlanPreviewRequest' }
      responses:
        '200':
          description: Stored, validated preview with immutable requirement basis and model usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPlanPreview' }
        '400': { description: Project context missing }
        '401': { description: Authentication required }
        '403': { description: Project write permission denied }
        '404': { description: Scoped project or requirement not found }
        '409': { description: Version or requirement basis conflict, changed request identity, or preview already running }
        '422': { description: Invalid request, task draft, date range or dependency graph }
        '429': { description: Model gateway quota or provider limit exceeded; failure is explicit }
        '502': { description: Model provider failure or invalid model output; no template fallback }
        '503': { description: Model gateway unavailable; no template fallback }
  /api/v1/delivery/commands:
    post:
      tags:
      - delivery
      operationId: deliveryCommand
      summary: Apply a versioned and idempotent delivery command
      description: 'execution.queue persists an immutable dispatch intent. execution.sync sends it

        through existing adapters, or observes actual run evidence. It never starts a run.

        Start via the existing runtime run action API. execution.review requires project

        approval and runtime workspace access. Successful execution alone never completes

        a business task. Retry the identical command with the same idempotency key.

        task.update can maintain dependency IDs and acceptance criterion indexes; changing

        either association requires the current requirement_basis and requirement_revision.

        Empty arrays explicitly clear associations. Stale requirement bases are rejected.


        project.update changes only explicitly supplied fields, retaining untouched owner/goal/dates. name/description
        edit the canonical Project and require configure; other project metadata keeps write. resource.save/archive
        require configure and share workspace CAS, receipts and audit events. Archiving retains the record; saving
        the same id with archived=false restores it. Resources never fetch links.'
      security:
      - bearerAuth: []
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryCommand'
      responses:
        '200':
          description: Updated snapshot with replayed and applied_version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryWorkspace'
        '403':
          description: Project or execution permission denied
        '409':
          description: Version conflict
          changed evidence: null
          active execution or invalid stage transition: null
        '422':
          description: Invalid action payload
        '503':
          description: Runtime unavailable; durable dispatch intent remains retryable
