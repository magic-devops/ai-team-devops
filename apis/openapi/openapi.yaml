components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 必须配合 X-Sop-Timestamp / X-Sop-Nonce / X-Sop-Signature 完整签名验证；单独传此头不构成有效认证。
    sopTimestamp: { type: apiKey, in: header, name: X-Sop-Timestamp, description: HMAC 签名时间戳；与其他三个签名头同时验证 }
    sopNonce: { type: apiKey, in: header, name: X-Sop-Nonce, description: HMAC 唯一 nonce；拒绝重放 }
    sopSignature: { type: apiKey, in: header, name: X-Sop-Signature, description: 按 HMAC 协议生成的请求签名；仅提供四个头并不代表验证成功 }

  parameters:
    RequiredBusinessProjectId:
      name: X-Project-Id
      in: header
      required: true
      schema: { type: string, minLength: 1 }
      description: 必须显式选择已授权项目；不使用服务端环境默认项目。query/body 的 project_id 如存在必须与此头一致。
    XProjectId:
      name: X-Project-Id
      in: header
      required: false
      schema: { type: string }
      description: 多项目作用域；登录后由前端自动注入
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    SizeParam:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BusinessProjectMissing:
      description: 缺少有效项目上下文或 project_id 与授权项目头不一致
      content:
        application/json: { schema: { $ref: '#/components/schemas/BusinessAccessError' } }
    BusinessUnauthorized:
      description: 身份缺失、过期或无效；必须有效 Bearer 或完整验证的 HMAC 签名
      content:
        application/json: { schema: { $ref: '#/components/schemas/BusinessAccessError' } }
    BusinessForbidden:
      description: 无当前项目访问、写入或配置权限
      content:
        application/json: { schema: { $ref: '#/components/schemas/BusinessAccessError' } }
    BusinessNotFound:
      description: 授权项目或当前项目内资源不存在
      content:
        application/json: { schema: { $ref: '#/components/schemas/BusinessAccessError' } }
    Unauthorized:
      description: 未认证
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Forbidden:
      description: 无权限
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    NotFound:
      description: 不存在
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Conflict:
      description: 冲突
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  schemas:
    AssistanceParseDocumentInput:
      additionalProperties: false
      description: 粘贴 PRD / 需求说明全文，由大模型抽取结构化需求列表（JSON）。
      properties:
        generator:
          default: ai
          enum:
          - ai
          - rules
          title: Generator
          type: string
        idempotency_key:
          anyOf:
          - maxLength: 100
            minLength: 8
            type: string
          - type: 'null'
          default: null
          title: Idempotency Key
        text:
          maxLength: 120000
          minLength: 20
          title: Text
          type: string
        filename:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          default: null
          title: Filename
        mode:
          default: prd
          pattern: ^(idea|prd|meeting|feedback|incident|data|mixed)$
          title: Mode
          type: string
        agent:
          default: Product Analyst Agent
          maxLength: 120
          title: Agent
          type: string
        cli:
          default: codex
          maxLength: 80
          title: Cli
          type: string
        auto_priority:
          default: true
          title: Auto Priority
          type: boolean
        auto_acceptance:
          default: true
          title: Auto Acceptance
          type: boolean
        assigned_agent:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          default: ''
          title: Assigned Agent
        dev_tool:
          anyOf:
          - maxLength: 80
            type: string
          - type: 'null'
          default: ''
          title: Dev Tool
      required:
      - text
      title: ParseDocumentBody
      type: object
    AssistanceReqCreate:
      properties:
        title:
          title: Title
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          default: ''
          title: Description
        priority:
          default: P1
          title: Priority
          type: string
        acceptance_criteria:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: []
          title: Acceptance Criteria
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: []
          title: Tags
        assigned_agent:
          anyOf:
          - type: string
          - type: 'null'
          default: ''
          title: Assigned Agent
        dev_tool:
          anyOf:
          - type: string
          - type: 'null'
          default: ''
          title: Dev Tool
      required:
      - title
      title: ReqCreate
      type: object
    AssistanceBatchImportInput:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AssistanceReqCreate'
          maxItems: 80
          minItems: 1
          title: Items
          type: array
        generation_id:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Generation Id
        expected_version:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Expected Version
        idempotency_key:
          anyOf:
          - maxLength: 100
            minLength: 8
            type: string
          - type: 'null'
          default: null
          title: Idempotency Key
      required:
      - items
      title: BatchCreateBody
      type: object
      allOf:
      - if:
          anyOf:
          - required:
            - generation_id
            properties:
              generation_id:
                not:
                  type: 'null'
          - required:
            - expected_version
            properties:
              expected_version:
                not:
                  type: 'null'
          - required:
            - idempotency_key
            properties:
              idempotency_key:
                not:
                  type: 'null'
        then:
          required:
          - generation_id
          - expected_version
          - idempotency_key
          properties:
            generation_id:
              not:
                type: 'null'
            expected_version:
              not:
                type: 'null'
            idempotency_key:
              not:
                type: 'null'
            items:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/AssistanceEditedImportItem'
      description: Legacy manual imports remain supported without generation fields. A generated preview is adopted
        only with all three nonnull generation_id/expected_version/idempotency_key fields. The whole edited selection
        is validated and committed in one SQL transaction; stable retries recover the same IDs.
    AssistanceReviewInput:
      additionalProperties: false
      properties:
        generator:
          default: rules
          enum:
          - ai
          - rules
          title: Generator
          type: string
        idempotency_key:
          anyOf:
          - maxLength: 100
            minLength: 8
            type: string
          - type: 'null'
          default: null
          title: Idempotency Key
      title: ReviewInput
      type: object
    AssistanceApplyReviewInput:
      additionalProperties: false
      properties:
        acceptance_criteria:
          anyOf:
          - items:
              type: string
            maxItems: 80
            type: array
          - type: 'null'
          default: null
          title: Acceptance Criteria
        tags:
          anyOf:
          - items:
              maxLength: 80
              minLength: 1
              type: string
            maxItems: 20
            type: array
          - type: 'null'
          default: null
          title: Tags
        human_notes:
          anyOf:
          - maxLength: 10000
            type: string
          - type: 'null'
          default: ''
          title: Human Notes
        generation_id:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Generation Id
        requirement_basis:
          anyOf:
          - maxLength: 64
            minLength: 64
            type: string
          - type: 'null'
          default: null
          title: Requirement Basis
        expected_version:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Expected Version
        idempotency_key:
          anyOf:
          - maxLength: 100
            minLength: 8
            type: string
          - type: 'null'
          default: null
          title: Idempotency Key
      title: ApplyReviewBody
      type: object
      allOf:
      - if:
          anyOf:
          - required:
            - generation_id
            properties:
              generation_id:
                not:
                  type: 'null'
          - required:
            - requirement_basis
            properties:
              requirement_basis:
                not:
                  type: 'null'
          - required:
            - expected_version
            properties:
              expected_version:
                not:
                  type: 'null'
          - required:
            - idempotency_key
            properties:
              idempotency_key:
                not:
                  type: 'null'
        then:
          required:
          - generation_id
          - requirement_basis
          - expected_version
          - idempotency_key
          properties:
            generation_id:
              not:
                type: 'null'
            requirement_basis:
              not:
                type: 'null'
            expected_version:
              not:
                type: 'null'
            idempotency_key:
              not:
                type: 'null'
            acceptance_criteria:
              anyOf:
              - type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 2000
              - type: 'null'
      description: Legacy manual notes/criteria/tags edits remain supported without generation fields, with no model
        provenance claim. Generated suggestions require all four nonnull generation_id/requirement_basis/expected_version/idempotency_key
        fields. Basis is opaque and must come from this assistance preview/history, not from task-plan basis.
    AssistancePrototypeGenerateInput:
      additionalProperties: false
      properties:
        generator:
          default: ai
          enum:
          - ai
          - rules
          title: Generator
          type: string
        idempotency_key:
          anyOf:
          - maxLength: 100
