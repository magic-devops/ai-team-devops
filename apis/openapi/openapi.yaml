      required:
      - ok
      - replayed
      - applied_version
      - generation
      - ids
      - count
      properties:
        ok: *id003
        replayed: *id003
        applied_version: *id002
        generation: *id006
        workspace: *id007
        ids:
          type: array
          items: *id001
        count: *id002
