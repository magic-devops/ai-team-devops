      title: CalendarSave
      type: object
      description: Requires configure. Replace this real active resource's full calendar under planning_basis/CAS. weekly
        has seven Monday=0..Sunday=6 quantities; null unknown, zero unavailable. Human values are half-hours <=24, agent/tool
        values integer slots <=100, validated against actual kind. All exceptions must be supplied; omitted window-external
        exceptions must not be silently preserved or discarded.
    DeliveryCommand:
      type: object
      additionalProperties: false
      required:
      - action
      - payload
      - expected_version
      - idempotency_key
      properties:
        action:
          type: string
          enum:
          - project.update
          - resource.save
          - resource.archive
          - member.save
          - milestone.save
          - requirement.create
          - requirement.update
          - task.create
          - task.update
          - task.manual_review
          - tasks.schedule
          - member.calendar.save
          - tasks.plan
          - artifact.add
          - stage.advance
          - stage.reopen
          - issue.promote
          - release.save
          - execution.queue
          - execution.sync
          - execution.review
          - execution.cancel
          - progress.record
          - baseline.create
        payload:
          type: object
          description: 'Validated per action. execution.queue requires task_id, task_basis, workspace_id, target_kind and target_basis.
            device requires target_device_id; local requires it empty. Select agent_id + fixed agent_version with optional explicit
            test_nodes, or command nodes with test_node_ids. Agent test IDs are server-derived. No implicit local fallback. sync/cancel
            require id.

            review requires id, decision (accept/request_changes), comment and run_version.

            '
        expected_version:
          type: integer
          minimum: 0
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 100
      allOf:
      - if:
          properties:
            action:
              const: execution.queue
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/ExecutionQueue'
      - if:
          properties:
            action:
              const: tasks.plan
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/TaskPlan'
      - if:
          properties:
            action:
              const: task.update
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/TaskEdit'
      - if:
          properties:
            action:
              const: project.update
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/DeliveryProjectEdit'
      - if:
          properties:
            action:
              const: resource.save
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/ResourceSave'
      - if:
          properties:
            action:
              const: resource.archive
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/ResourceArchive'
      - if:
          properties:
            action:
              const: progress.record
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/ProgressRecord'
      - if:
          properties:
            action:
              const: baseline.create
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/BaselineCreate'
      - if:
          properties:
            action:
              const: task.manual_review
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/TaskManualReview'
      - if:
          properties:
            action:
              const: member.save
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/MemberEdit'
      - if:
          properties:
            action:
              const: member.calendar.save
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/CalendarSave'
      - if:
          properties:
            action:
              const: tasks.schedule
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/ScheduleChanges'
      - if:
          properties:
            action:
              const: task.create
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/DeliveryTaskCreate'
