            format: date
          - type: 'null'
          title: Starts On
      - name: ends_on
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Ends On
      - $ref: '#/components/parameters/RequiredBusinessProjectId'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
      description: 'Requires an explicitly selected authorized project. Pure read: no tasks, calendars, receipts,
        events or progress observations are written, and no runtime/model is invoked. Planning dates are civil UTC
        dates. The planning_basis covers the full current project regardless of visible filters. Human hours and agent/tool
        planning slots are distinct; unknown availability is null and explicit zero is unavailable. A reservation
        is planning data, never actual work or observed concurrency. Defaults to 14 dates from today; a single supplied
        endpoint derives the other by 13 days. The inclusive range is at most 92 dates. Calendar exceptions are returned
        in full, including outside this window. Resource cells include all project load; display filters do not release
        it.'
  /api/v1/delivery/schedule-preview:
    post:
      tags:
      - delivery
      summary: Delivery Schedule Preview
      operationId: delivery_schedule_preview_api_v1_delivery_schedule_preview_post
      security:
      - bearerAuth: []
