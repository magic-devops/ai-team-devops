      - value
      - status
      - phase
      - decision
      - review
      - decision_record
      - result
      - permissions
      properties:
        status: *id008
        phase: *id009
        decision: *id010
        review: *id011
        decision_record: *id012
        result: *id013
        ok: *id003
        workflow_id: *id001
        query: *id001
        value: {}
        permissions:
          $ref: '#/components/schemas/WorkflowPermissions'
    WorkflowCancelResult:
      type: object
      required:
      - ok
      properties:
        ok:
          type: string
          const: 'true'
    WorkflowBulkCancelResult:
      type: object
      required:
      - ok
      - cancelled
      - failed
      - count
      properties:
        ok: *id003
        cancelled:
          type: array
          items: *id001
        failed:
          type: array
          items:
            type: object
            required:
            - workflow_id
            - error
            properties:
              workflow_id: *id001
              error: *id001
        count: *id002
      description: A request with missing scoped IDs fails before cancellation. Otherwise each cancellation is recorded
        and failures are returned per instance; this is not an atomic bulk operation.

