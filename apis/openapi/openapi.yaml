      required:
      - id
      - revision
      - kind
      - content
      properties:
        id: *id001
        revision: *id002
        actor: *id001
        at: *id001
        kind:
          const: prototype
        title: *id001
        content: *id001
        url: *id001
        result:
          type: string
          enum:
          - recorded
          - passed
          - failed
        source: *id001
        generation_id: *id001
        model: *id001
        provider: *id001
        usage:
          $ref: '#/components/schemas/AssistanceUsage'
