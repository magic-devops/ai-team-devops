  /api/v1/delivery/task-plan-preview:
    post:
      tags: [delivery]
      operationId: deliveryTaskPlanPreview
      summary: Preview an editable task plan against a fixed requirement revision
      description: |
        Requires project write permission. This creates no business tasks or execution
        processes. The generator is either an explicit template or the existing model
        gateway; AI failures never fall back to template success. Persist expected_version
        and idempotency_key before sending. Replaying the same successful request returns
        the stored preview, while an in-progress attempt returns a conflict and a failed
        attempt replays its original error rather than silently repeating model work.
        The preview version remains the input version.
        Submit the selected, edited items through tasks.plan to create canonical tasks.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: X-Project-Id, in: header, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskPlanPreviewRequest' }
      responses:
        '200':
          description: Stored, validated preview with immutable requirement basis and model usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPlanPreview' }
        '400': { description: Project context missing }
        '401': { description: Authentication required }
        '403': { description: Project write permission denied }
        '404': { description: Scoped project or requirement not found }
        '409': { description: Version or requirement basis conflict, changed request identity, or preview already running }
        '422': { description: Invalid request, task draft, date range or dependency graph }
        '429': { description: Model gateway quota or provider limit exceeded; failure is explicit }
        '502': { description: Model provider failure or invalid model output; no template fallback }
        '503': { description: Model gateway unavailable; no template fallback }
  /api/v1/delivery/commands:
    post:
      tags:
      - delivery
      operationId: deliveryCommand
      summary: Apply a versioned and idempotent delivery command
      description: 'execution.queue persists an immutable dispatch intent. execution.sync sends it

        through existing adapters, or observes actual run evidence. It never starts a run.

        Start via the existing runtime run action API. execution.review requires project

        approval and runtime workspace access. Successful execution alone never completes

        a business task. Retry the identical command with the same idempotency key.

        task.update can maintain dependency IDs and acceptance criterion indexes; changing

        either association requires the current task_basis, including for independent tasks.

        Empty arrays explicitly clear associations. Stale task scope is rejected.


        project.update changes only explicitly supplied fields, retaining untouched owner/goal/dates. name/description edit
        the canonical Project and require configure; other project metadata keeps write. resource.save/archive require configure
        and share workspace CAS, receipts and audit events. Archiving retains the record; saving the same id with archived=false
        restores it. Resources never fetch links.

        progress.record requires write and records current UTC facts. baseline.create requires approve and freezes an immutable
        plan after checking complete task IDs and content basis. Both use the same CAS, idempotency receipts and atomic business
        transaction; failures retain no successful observation.

        task.manual_review requires approve and fixed task basis, project version and idempotency identity. A changed basis
        returns structured 409 code task_review_basis_changed without saving a decision. Manual acceptance, permanent invalidation
        and progress observations share the business transaction.

        member.calendar.save requires configure and a complete calendar. tasks.schedule requires write and applies an explicit
        final batch atomically. Both pin planning_basis/CAS/retry identity. task.update dates/reservations share the same validator
        and require planning_basis. Changed planning returns structured 409 planning_basis_changed. kind is immutable and member.save
        has no capacity field.


        Project lifecycle uses the same workspace CAS and scoped successful-request receipt as other delivery commands. Current
        role access is checked before replay; identical successful requests can replay after archive. New archived business
        writes are rejected, and only explicit restore is accepted. Planning and paused permit business maintenance and handed-off
        run sync/review/cancel, but reject new queue/dispatch. Receipt recovery precedes the fresh-dispatch gate; a committed
        Hermes receipt or run, including planned, is the handoff boundary. Only active allows a new execution handoff. Every
        archive stores its complete result in event data; current portfolio evidence stays live. Project status has a single
        SQL source; project.update configuration fields require configure and retain omitted values.


        Release policy configuration requires configure; CI import and candidate creation require write; review/revoke require
        approve. Import takes raw DSSE JSON text, verifies configured Ed25519 keys and fixed scope/repository/workflow/policy
        generation, and retains failures. Current candidate validity never rewrites its original snapshot. Policy, scope, CI
        attempt or approval-authority invalidation latches permanently. Existing manual release records cannot satisfy deployment_verified.


        Deployment environment configuration requires configure. Explicit side effects require project approve and separately
        runtime execute for the fixed workspace/target. Sync requires project write/runtime read and only observes actual results.
        No generic retry/replay, manual metrics, or legacy success registration can establish deployment. Every active or unknown
        intent blocks project archive.


        Issue diagnosis adoption requires approve, original selected evidence access and current issue/evidence basis. It reuses
        the unique source Issue requirement without overwriting existing work or closing the Issue. Dismissal records an explicit
        cancellation/rejection; it does not stop a remote provider. Pending diagnosis receipts block archive until an explicit
        dismissal. Archived projects remain read-only. Returns CommandAck rather than a workspace snapshot. applied_version/resource/result/affected_refs
        are the original committed result; version/query_generation are current. Old receipts without immutable result return
        delivery_receipt_result_unavailable.'
      security:
      - bearerAuth: []
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryCommand'
      responses:
        '200':
          description: Immutable original command result with current read metadata; replay never guesses from current entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAck'
        '403':
          description: Project or execution permission denied
        '409':
          description: CAS/idempotency or evidence conflict, project_archived, project_not_active, project_state_unchanged,
            project_lifecycle_basis_changed or project_archive_blocked. Re-read and explicitly adopt a new proposal; retry unknown
            outcomes with the identical original body/key.
        '422':
          description: Invalid action payload
        '503':
          description: Runtime unavailable; durable dispatch intent remains retryable
