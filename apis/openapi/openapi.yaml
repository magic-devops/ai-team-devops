      tags: [models]
      summary: 保存提供商凭证、地址及启用状态
      description: 需要配置权限。路径 name 必须与请求 name 相同。已配置的凭证在提交空值或原掩码时保留；可提交 ${ENV_VAR} 引用。保存配置不代表适配器或远端模型已经验证可用。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ModelProviderInput' } }
      responses:
        '200':
          description: 已保存，返回凭证掩码
          content:
            application/json:
              schema:
                type: object
                required: [ok, provider]
                properties:
                  ok: { type: boolean }
                  provider: { $ref: '#/components/schemas/ModelProviderPublic' }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
        '422': { description: 提供商标识或地址无效 }
    delete:
      operationId: deleteProjectModelProvider
      tags: [models]
      summary: 删除提供商配置
      description: 需要配置权限。引用此提供商的聊天模型随后调用会明确报告未配置。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      responses:
        '200': { description: 已删除或原本不存在, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessOk' } } } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }

  /api/v1/models/providers/{name}/test:
    parameters:
      - { $ref: '#/components/parameters/RequiredBusinessProjectId' }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      operationId: testProjectModelProvider
      tags: [models]
      summary: 检查提供商配置与自定义地址连通性
      description: 需要配置权限。自定义 base_url 只执行 HEAD 连通性检查；configured、reachable 都不能证明真实模型调用成功。禁用、无凭证或缺少适配器以 200 响应中的 ok=false 和 status 表达。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      responses:
        '200': { description: 配置或连通性检查结果, content: { application/json: { schema: { $ref: '#/components/schemas/ModelProviderCheck' } } } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }

  /api/v1/models/custom:
    parameters: [{ $ref: '#/components/parameters/RequiredBusinessProjectId' }]
    post:
      operationId: addProjectCustomModel
      tags: [models]
      summary: 注册项目自定义模型
      description: 需要配置权限。OpenAI 兼容服务使用 provider=openai 和该项目 openai 提供商的 base_url；模型单独 api_key 优先于提供商凭证。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CustomModelInput' } }
      responses:
        '200':
          description: 已注册，返回凭证掩码
          content:
            application/json:
              schema:
                type: object
                required: [ok, model]
                properties:
                  ok: { type: boolean }
                  model: { $ref: '#/components/schemas/ModelCatalogueItem' }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
        '409': { description: 模型已存在 }
        '422': { description: 自定义模型字段无效 }

  /api/v1/models/custom/{model_id}:
    parameters:
      - { $ref: '#/components/parameters/RequiredBusinessProjectId' }
      - { name: model_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: removeProjectCustomModel
      tags: [models]
      summary: 删除自定义模型并清理关联路由
      description: 需要配置权限。删除关联的 role_models 映射；若它是默认模型则恢复到内置目录第一个模型。此操作不会自动配置恢复后模型的提供商。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      responses:
        '200': { description: 已删除或原本不存在, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessOk' } } } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }

  /api/v1/models/role-model:
    parameters: [{ $ref: '#/components/parameters/RequiredBusinessProjectId' }]
    put:
      operationId: setProjectTaskModel
      tags: [models]
      summary: 保存按 task_type 使用的模型
      description: 需要配置权限。role 与聊天请求 task_type 同名；模型必须已经注册。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RoleModelInput' } }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                type: object
                required: [ok, role, model_id]
                properties:
                  ok: { type: boolean }
                  role: { type: string }
                  model_id: { type: string }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
        '422': { description: role 或 model_id 无效 }

  /api/v1/rag/search:
    post:
      operationId: ragSearch
      tags: [rag]
      parameters: [ { $ref: "#/components/parameters/XProjectId" } ]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/RagSearchIn" } }
      responses:
        "200":
          description: ok
          content:
            application/json: { schema: { $ref: "#/components/schemas/RagSearchOut" } }

  /api/v1/memory/health:
    get:
      operationId: memoryHealth
      tags: [rag]
      summary: 记忆服务探活
      security: []
      responses:
        "200": { description: ok }

  /api/v1/memory:
    post:
      operationId: memoryCreate
      tags: [rag]
      parameters: [ { $ref: "#/components/parameters/XProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                kind: { type: string, enum: [short, long, episodic] }
                metadata: { type: object }
      responses:
        "200": { description: ok }

  /api/v1/sync/pull:
    get:
      operationId: syncPull
      tags: [workflow]
      summary: 游标拉取结构化变更
      parameters:
        - { $ref: "#/components/parameters/XProjectId" }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: modules, in: query, schema: { type: string } }
      responses:
        "200": { description: ok }

  /api/v1/sync/push:
    post:
      operationId: syncPush
      tags: [workflow]
      summary: 推送单条结构化变更（幂等键可选）
      parameters: [ { $ref: "#/components/parameters/XProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module, record]
              properties:
                module: { type: string, enum: [tasks, requirements, issues, sprints] }
                action: { type: string, enum: [upsert, delete], default: upsert }
                record: { type: object, additionalProperties: true }
                idempotency_key: { type: string }
      responses:
        "200": { description: ok }

  /api/v1/sync/journal:
    get:
      operationId: syncJournal
      tags: [workflow]
      summary: 同步事件流水
      parameters:
        - { $ref: "#/components/parameters/XProjectId" }
        - { name: since, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200": { description: ok }

  /api/v1/context/me:
    get:
      operationId: contextMe
      tags: [projects]
      summary: 当前请求三码与项目上下文
      parameters: [ { $ref: "#/components/parameters/XProjectId" } ]
      responses:
        "200": { description: ok }

  /api/v1/platforms:
    get:
      operationId: platformsList
      tags: [platforms]
      summary: 列举已注册 AI 平台及本地就绪状态
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformsListOut" }

  /api/v1/platforms/install-shims/{platform_id}:
    post:
      operationId: platformsInstallShims
      tags: [platforms]
      summary: 生成缺失的 hook shim（不覆盖 hooks.json）
      parameters:
        - name: platform_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: ok }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/worker/jobs:
    post:
      operationId: workerEnqueue
      tags: [workflow]
      summary: 投递异步 Worker 任务
      parameters: [ { $ref: "#/components/parameters/XProjectId" } ]
      responses:
        "200": { description: ok }

  /api/v1/analytics/overview:
    get:
      operationId: analyticsOverview
      tags: [copilot]
      summary: 项目指标概览
      parameters: [ { $ref: "#/components/parameters/XProjectId" } ]
      responses:
        "200": { description: ok }

  /api/v1/console/overview:
    get:
      operationId: consoleOverview
      tags: [copilot]
      summary: 跨项目驾驶舱聚合
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/ConsoleOverview" } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 必须配合 X-Sop-Timestamp / X-Sop-Nonce / X-Sop-Signature 完整签名验证；单独传此头不构成有效认证。
    sopTimestamp: { type: apiKey, in: header, name: X-Sop-Timestamp, description: HMAC 签名时间戳；与其他三个签名头同时验证 }
    sopNonce: { type: apiKey, in: header, name: X-Sop-Nonce, description: HMAC 唯一 nonce；拒绝重放 }
    sopSignature: { type: apiKey, in: header, name: X-Sop-Signature, description: 按 HMAC 协议生成的请求签名；仅提供四个头并不代表验证成功 }

  parameters:
    RequiredBusinessProjectId:
      name: X-Project-Id
      in: header
      required: true
      schema: { type: string, minLength: 1 }
      description: 必须显式选择已授权项目；不使用服务端环境默认项目。query/body 的 project_id 如存在必须与此头一致。
    XProjectId:
      name: X-Project-Id
      in: header
      required: false
      schema: { type: string }
      description: 多项目作用域；登录后由前端自动注入
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    SizeParam:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BusinessProjectMissing:
      description: 缺少有效项目上下文或 project_id 与授权项目头不一致
      content:
        application/json: { schema: { $ref: '#/components/schemas/BusinessAccessError' } }
    BusinessUnauthorized:
      description: 身份缺失、过期或无效；必须有效 Bearer 或完整验证的 HMAC 签名
      content:
        application/json: { schema: { $ref: '#/components/schemas/BusinessAccessError' } }
    BusinessForbidden:
      description: 无当前项目访问、写入或配置权限
      content:
        application/json: { schema: { $ref: '#/components/schemas/BusinessAccessError' } }
    BusinessNotFound:
      description: 授权项目或当前项目内资源不存在
      content:
        application/json: { schema: { $ref: '#/components/schemas/BusinessAccessError' } }
    Unauthorized:
      description: 未认证
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Forbidden:
      description: 无权限
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    NotFound:
      description: 不存在
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Conflict:
      description: 冲突
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  schemas:
    AssistanceParseDocumentInput:
      additionalProperties: false
      description: 粘贴 PRD / 需求说明全文，由大模型抽取结构化需求列表（JSON）。
      properties:
        generator:
          default: ai
          enum:
          - ai
          - rules
          title: Generator
          type: string
        idempotency_key:
          anyOf:
          - maxLength: 100
            minLength: 8
            type: string
          - type: 'null'
          default: null
          title: Idempotency Key
        text:
          maxLength: 120000
          minLength: 20
          title: Text
          type: string
        filename:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          default: null
          title: Filename
        mode:
          default: prd
          pattern: ^(idea|prd|meeting|feedback|incident|data|mixed)$
          title: Mode
          type: string
        agent:
          default: Product Analyst Agent
          maxLength: 120
          title: Agent
          type: string
        cli:
          default: codex
          maxLength: 80
          title: Cli
          type: string
        auto_priority:
          default: true
          title: Auto Priority
          type: boolean
        auto_acceptance:
          default: true
          title: Auto Acceptance
          type: boolean
        assigned_agent:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          default: ''
          title: Assigned Agent
        dev_tool:
          anyOf:
          - maxLength: 80
            type: string
          - type: 'null'
          default: ''
          title: Dev Tool
      required:
      - text
      title: ParseDocumentBody
      type: object
    AssistanceReqCreate:
      properties:
        title:
          title: Title
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          default: ''
          title: Description
        priority:
          default: P1
          title: Priority
          type: string
        acceptance_criteria:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: []
          title: Acceptance Criteria
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: []
          title: Tags
        assigned_agent:
          anyOf:
          - type: string
          - type: 'null'
          default: ''
          title: Assigned Agent
        dev_tool:
          anyOf:
          - type: string
          - type: 'null'
          default: ''
          title: Dev Tool
      required:
      - title
      title: ReqCreate
      type: object
    AssistanceBatchImportInput:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AssistanceReqCreate'
          maxItems: 80
          minItems: 1
          title: Items
          type: array
        generation_id:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Generation Id
        expected_version:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Expected Version
        idempotency_key:
          anyOf:
          - maxLength: 100
            minLength: 8
            type: string
          - type: 'null'
          default: null
          title: Idempotency Key
      required:
      - items
      title: BatchCreateBody
      type: object
      allOf:
      - if:
          anyOf:
          - required:
            - generation_id
            properties:
              generation_id:
                not:
                  type: 'null'
          - required:
            - expected_version
            properties:
              expected_version:
                not:
                  type: 'null'
          - required:
            - idempotency_key
            properties:
              idempotency_key:
                not:
                  type: 'null'
        then:
          required:
          - generation_id
          - expected_version
          - idempotency_key
          properties:
            generation_id:
              not:
                type: 'null'
            expected_version:
              not:
                type: 'null'
            idempotency_key:
              not:
                type: 'null'
            items:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/AssistanceEditedImportItem'
      description: Legacy manual imports remain supported without generation fields. A generated preview is adopted
        only with all three nonnull generation_id/expected_version/idempotency_key fields. The whole edited selection
        is validated and committed in one SQL transaction; stable retries recover the same IDs.
    AssistanceReviewInput:
      additionalProperties: false
      properties:
        generator:
          default: rules
          enum:
          - ai
          - rules
          title: Generator
          type: string
        idempotency_key:
          anyOf:
          - maxLength: 100
            minLength: 8
            type: string
          - type: 'null'
          default: null
          title: Idempotency Key
      title: ReviewInput
      type: object
    AssistanceApplyReviewInput:
      additionalProperties: false
      properties:
        acceptance_criteria:
          anyOf:
          - items:
              type: string
            maxItems: 80
            type: array
          - type: 'null'
          default: null
          title: Acceptance Criteria
        tags:
          anyOf:
          - items:
              maxLength: 80
              minLength: 1
              type: string
            maxItems: 20
            type: array
          - type: 'null'
          default: null
          title: Tags
        human_notes:
          anyOf:
          - maxLength: 10000
            type: string
          - type: 'null'
          default: ''
          title: Human Notes
        generation_id:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Generation Id
        requirement_basis:
          anyOf:
          - maxLength: 64
            minLength: 64
            type: string
          - type: 'null'
          default: null
          title: Requirement Basis
        expected_version:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Expected Version
        idempotency_key:
          anyOf:
          - maxLength: 100
            minLength: 8
            type: string
          - type: 'null'
          default: null
          title: Idempotency Key
      title: ApplyReviewBody
      type: object
      allOf:
      - if:
          anyOf:
          - required:
            - generation_id
            properties:
              generation_id:
                not:
                  type: 'null'
          - required:
            - requirement_basis
            properties:
              requirement_basis:
                not:
                  type: 'null'
          - required:
            - expected_version
            properties:
              expected_version:
                not:
                  type: 'null'
          - required:
            - idempotency_key
            properties:
              idempotency_key:
                not:
                  type: 'null'
        then:
          required:
          - generation_id
          - requirement_basis
          - expected_version
          - idempotency_key
          properties:
            generation_id:
              not:
                type: 'null'
            requirement_basis:
              not:
                type: 'null'
            expected_version:
              not:
                type: 'null'
            idempotency_key:
              not:
                type: 'null'
            acceptance_criteria:
              anyOf:
              - type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 2000
              - type: 'null'
      description: Legacy manual notes/criteria/tags edits remain supported without generation fields, with no model
        provenance claim. Generated suggestions require all four nonnull generation_id/requirement_basis/expected_version/idempotency_key
        fields. Basis is opaque and must come from this assistance preview/history, not from task-plan basis.
    AssistancePrototypeGenerateInput:
      additionalProperties: false
      properties:
        generator:
          default: ai
          enum:
          - ai
          - rules
          title: Generator
          type: string
        idempotency_key:
          anyOf:
          - maxLength: 100
            minLength: 8
            type: string
          - type: 'null'
          default: null
          title: Idempotency Key
        mode:
          default: wireframe
          enum:
          - wireframe
          - user_journey
          - ia
          title: Mode
          type: string
        extra_context:
          anyOf:
          - maxLength: 8000
            type: string
          - type: 'null'
          default: null
          title: Extra Context
        gen_image:
          default: false
          title: Gen Image
          type: boolean
          description: true is rejected with 422 before any model call; the text gateway has no prototype image adapter.
      title: GeneratePrototypeBody
      type: object
    AssistancePrototypeApplyInput:
      additionalProperties: false
      properties:
        generation_id:
          maxLength: 64
          minLength: 1
          title: Generation Id
          type: string
        requirement_basis:
          maxLength: 64
          minLength: 64
          title: Requirement Basis
          type: string
        expected_version:
          minimum: 0
          title: Expected Version
          type: integer
        idempotency_key:
          maxLength: 100
          minLength: 8
          title: Idempotency Key
          type: string
        content:
          maxLength: 50000
          minLength: 1
          title: Content
          type: string
        title:
          default: 原型设计
          maxLength: 200
          minLength: 1
          title: Title
          type: string
      required:
      - generation_id
      - requirement_basis
      - expected_version
      - idempotency_key
      - content
      title: PrototypeApply
      type: object
    AssistanceGeneratedRequirement:
      additionalProperties: false
      properties:
        title:
          maxLength: 256
          minLength: 1
          title: Title
          type: string
        description:
          default: ''
          maxLength: 20000
          title: Description
          type: string
        priority:
          default: P2
          enum:
          - P0
          - P1
          - P2
          - P3
          title: Priority
          type: string
        acceptance_criteria:
          items:
            maxLength: 2000
            minLength: 1
            type: string
          maxItems: 80
          title: Acceptance Criteria
          type: array
        tags:
          items:
            maxLength: 80
            minLength: 1
            type: string
          maxItems: 20
          title: Tags
          type: array
      required:
      - title
      title: GeneratedRequirement
      type: object
    AssistanceReviewDuplicate:
      additionalProperties: false
      properties:
        id:
