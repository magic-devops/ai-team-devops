          maxLength: 10000
          title: Goal
          type: string
        owner_id:
          default: ''
          maxLength: 100
          title: Owner Id
          type: string
      title: ProjectEdit
      type: object
      description: Patch only supplied fields. name and description change the canonical SQL Project and require configure
        permission. Goal, owner and planned dates retain their existing write permission. Omitted fields retain stored
        values; empty description clears it, and explicit null dates clear planned dates. Date validation uses the combined
        stored and submitted range. No duplicate project entity is created.
