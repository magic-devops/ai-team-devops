      description: Requires an explicitly selected authorized project. This read-only projection performs no state
        writes or runtime calls. mine uses stable user IDs; ambiguous legacy names never become personal assignments.
        Personal approval requires the current approve permission and satisfied stage gates. Team readers may see
        available review work without receiving approval authority. Acceptance requires current latest execution evidence.
        Overdue uses UTC dates from registered plans only. Follow target into the existing detail; all mutation permissions
        and evidence gates remain there.
