        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
    post:
      operationId: createTask
      tags: [tasks]
      description: 需要项目写权限（project_admin/developer/devops/product_manager，或有权管理该项目的租户管理员、超级管理员）。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      parameters: [ { $ref: "#/components/parameters/RequiredBusinessProjectId" } ]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/TaskCreate" } }
      responses:
        "200":
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [ok, id]
                properties:
                  ok: { type: boolean }
                  id: { type: string }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }

  /api/v1/tasks/{task_id}:
    parameters:
      - { $ref: "#/components/parameters/RequiredBusinessProjectId" }
      - { name: task_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTask
      tags: [tasks]
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
    patch:
      operationId: updateTask
      tags: [tasks]
      description: 需要项目写权限；交付执行和依赖校验仍由业务状态约束执行。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/TaskUpdate" } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/BusinessOk" } } } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteTask
      tags: [tasks]
      description: 需要项目写权限。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      responses:
        "200": { description: deleted, content: { application/json: { schema: { $ref: "#/components/schemas/BusinessOk" } } } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }

  /api/v1/tasks/{task_id}:pull:
    parameters:
      - { $ref: "#/components/parameters/RequiredBusinessProjectId" }
      - { name: task_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: pullTask
      tags: [tasks]
      summary: Agent 主动拉任务（认领）
      description: 需要项目写权限；仅有 X-Api-Key 而没有通过完整签名验证的请求不构成身份认证。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } }
        "409": { $ref: "#/components/responses/Conflict" }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }

  /api/v1/llm/chat:
    post:
      operationId: llmChat
      tags: [llm]
      summary: 统一 LLM 入口（路由 + 缓存 + 计费 + 审计）
      description: |
        需要项目写权限。模型选择依次为显式 model、项目 role_models[task_type]、
        项目默认模型；只有项目尚未保存模型配置时才使用旧环境变量和默认路由。
        已保存配置只使用所选提供商，不静默回退到其他提供商。
        当前项目适配器支持 Anthropic、OpenAI 兼容接口、Ollama；
        未支持、未配置、禁用或凭证缺失的提供商返回明确的 503。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      parameters: [ { $ref: "#/components/parameters/RequiredBusinessProjectId" } ]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/LlmChatIn" } }
      responses:
        "200":
          description: ok
          content:
            application/json: { schema: { $ref: "#/components/schemas/LlmChatOut" } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
        '429': { description: 项目模型调用配额不足 }
        '502': { description: 所选模型提供商调用失败 }
        '503': { description: 项目配置无效或所选模型适配器、提供商、凭证不可用 }

  /api/v1/llm/embeddings:
    post:
      operationId: llmEmbeddings
      tags: [llm]
      description: 需要项目写权限。本地 embedding 可继续使用；云调用及本地失败后的云回退遵守当前项目提供商的启用状态、凭证和地址，自定义云模型保留显式模型 ID。只有未保存项目配置时保留旧环境凭证回退。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      parameters: [ { $ref: "#/components/parameters/RequiredBusinessProjectId" } ]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/EmbeddingsIn" } }
      responses:
        "200":
          description: ok
          content:
            application/json: { schema: { $ref: "#/components/schemas/EmbeddingsOut" } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
        '503': { description: 本地 embedding 和环境回退均不可用 }

  /api/v1/models:
    parameters: [{ $ref: '#/components/parameters/RequiredBusinessProjectId' }]
    get:
      operationId: listProjectModels
      tags: [models]
      summary: 当前项目模型目录与实际聊天路由配置
      description: 项目成员可读取。凭证返回掩码和 has_api_key；环境变量引用保留引用文本。adapter_supported 明确当前网关是否具备该提供商适配器。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      responses:
        '200': { description: 项目配置或尚未保存时的默认展示, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectModelConfiguration' } } } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
        '503': { description: 已保存项目配置不可读取 }

  /api/v1/models/default:
    parameters: [{ $ref: '#/components/parameters/RequiredBusinessProjectId' }]
    put:
      operationId: setProjectDefaultModel
      tags: [models]
      summary: 保存项目默认聊天模型
      description: 需要配置权限（项目管理员，或有权管理该项目的租户管理员、超级管理员）。model_id 必须已在内置或当前项目自定义目录注册。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      parameters: [{ name: model_id, in: query, required: true, schema: { type: string } }]
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                type: object
                required: [ok, default]
                properties:
                  ok: { type: boolean }
                  default: { type: string }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
        '422': { description: 缺少 model_id }

  /api/v1/models/providers/{name}:
    parameters:
      - { $ref: '#/components/parameters/RequiredBusinessProjectId' }
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      operationId: saveProjectModelProvider
      tags: [models]
      summary: 保存提供商凭证、地址及启用状态
      description: 需要配置权限。路径 name 必须与请求 name 相同。已配置的凭证在提交空值或原掩码时保留；可提交 ${ENV_VAR} 引用。保存配置不代表适配器或远端模型已经验证可用。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ModelProviderInput' } }
      responses:
        '200':
          description: 已保存，返回凭证掩码
          content:
            application/json:
              schema:
                type: object
                required: [ok, provider]
                properties:
                  ok: { type: boolean }
                  provider: { $ref: '#/components/schemas/ModelProviderPublic' }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
        '422': { description: 提供商标识或地址无效 }
    delete:
      operationId: deleteProjectModelProvider
      tags: [models]
      summary: 删除提供商配置
      description: 需要配置权限。引用此提供商的聊天模型随后调用会明确报告未配置。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      responses:
        '200': { description: 已删除或原本不存在, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessOk' } } } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }

  /api/v1/models/providers/{name}/test:
    parameters:
      - { $ref: '#/components/parameters/RequiredBusinessProjectId' }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      operationId: testProjectModelProvider
      tags: [models]
      summary: 检查提供商配置与自定义地址连通性
      description: 需要配置权限。自定义 base_url 只执行 HEAD 连通性检查；configured、reachable 都不能证明真实模型调用成功。禁用、无凭证或缺少适配器以 200 响应中的 ok=false 和 status 表达。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      responses:
        '200': { description: 配置或连通性检查结果, content: { application/json: { schema: { $ref: '#/components/schemas/ModelProviderCheck' } } } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }

  /api/v1/models/custom:
    parameters: [{ $ref: '#/components/parameters/RequiredBusinessProjectId' }]
    post:
      operationId: addProjectCustomModel
      tags: [models]
      summary: 注册项目自定义模型
      description: 需要配置权限。OpenAI 兼容服务使用 provider=openai 和该项目 openai 提供商的 base_url；模型单独 api_key 优先于提供商凭证。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CustomModelInput' } }
      responses:
        '200':
          description: 已注册，返回凭证掩码
          content:
            application/json:
              schema:
                type: object
                required: [ok, model]
                properties:
                  ok: { type: boolean }
                  model: { $ref: '#/components/schemas/ModelCatalogueItem' }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
        '409': { description: 模型已存在 }
        '422': { description: 自定义模型字段无效 }

  /api/v1/models/custom/{model_id}:
    parameters:
      - { $ref: '#/components/parameters/RequiredBusinessProjectId' }
      - { name: model_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: removeProjectCustomModel
      tags: [models]
      summary: 删除自定义模型并清理关联路由
      description: 需要配置权限。删除关联的 role_models 映射；若它是默认模型则恢复到内置目录第一个模型。此操作不会自动配置恢复后模型的提供商。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      responses:
        '200': { description: 已删除或原本不存在, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessOk' } } } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }

  /api/v1/models/role-model:
    parameters: [{ $ref: '#/components/parameters/RequiredBusinessProjectId' }]
    put:
      operationId: setProjectTaskModel
      tags: [models]
      summary: 保存按 task_type 使用的模型
      description: 需要配置权限。role 与聊天请求 task_type 同名；模型必须已经注册。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RoleModelInput' } }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                type: object
                required: [ok, role, model_id]
                properties:
                  ok: { type: boolean }
                  role: { type: string }
                  model_id: { type: string }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
        '422': { description: role 或 model_id 无效 }

  /api/v1/rag/search:
    post:
      operationId: ragSearch
      tags: [rag]
      parameters: [ { $ref: "#/components/parameters/XProjectId" } ]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/RagSearchIn" } }
      responses:
        "200":
          description: ok
          content:
            application/json: { schema: { $ref: "#/components/schemas/RagSearchOut" } }

  /api/v1/memory/health:
    get:
      operationId: memoryHealth
      tags: [rag]
      summary: 记忆服务探活
      security: []
      responses:
        "200": { description: ok }

  /api/v1/memory:
    post:
      operationId: memoryCreate
      tags: [rag]
      parameters: [ { $ref: "#/components/parameters/XProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                kind: { type: string, enum: [short, long, episodic] }
                metadata: { type: object }
      responses:
        "200": { description: ok }

  /api/v1/sync/pull:
    get:
      operationId: syncPull
      tags: [workflow]
      summary: 游标拉取结构化变更
      parameters:
        - { $ref: "#/components/parameters/XProjectId" }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: modules, in: query, schema: { type: string } }
      responses:
        "200": { description: ok }

  /api/v1/sync/push:
    post:
      operationId: syncPush
      tags: [workflow]
      summary: 推送单条结构化变更（幂等键可选）
      parameters: [ { $ref: "#/components/parameters/XProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module, record]
              properties:
                module: { type: string, enum: [tasks, requirements, issues, sprints] }
                action: { type: string, enum: [upsert, delete], default: upsert }
                record: { type: object, additionalProperties: true }
                idempotency_key: { type: string }
      responses:
        "200": { description: ok }

  /api/v1/sync/journal:
    get:
      operationId: syncJournal
      tags: [workflow]
      summary: 同步事件流水
      parameters:
        - { $ref: "#/components/parameters/XProjectId" }
        - { name: since, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200": { description: ok }

  /api/v1/context/me:
    get:
      operationId: contextMe
      tags: [projects]
      summary: 当前请求三码与项目上下文
      parameters: [ { $ref: "#/components/parameters/XProjectId" } ]
      responses:
        "200": { description: ok }

  /api/v1/platforms:
    get:
      operationId: platformsList
      tags: [platforms]
      summary: 列举已注册 AI 平台及本地就绪状态
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformsListOut" }

  /api/v1/platforms/install-shims/{platform_id}:
    post:
      operationId: platformsInstallShims
      tags: [platforms]
      summary: 生成缺失的 hook shim（不覆盖 hooks.json）
      parameters:
        - name: platform_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: ok }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/worker/jobs:
    post:
      operationId: workerEnqueue
      tags: [workflow]
      summary: 投递异步 Worker 任务
      parameters: [ { $ref: "#/components/parameters/XProjectId" } ]
      responses:
        "200": { description: ok }

  /api/v1/analytics/overview:
    get:
      operationId: analyticsOverview
      tags: [copilot]
      summary: 项目指标概览
      parameters: [ { $ref: "#/components/parameters/XProjectId" } ]
      responses:
        "200": { description: ok }

  /api/v1/console/overview:
    get:
      operationId: consoleOverview
      tags: [copilot]
      summary: 跨项目驾驶舱聚合
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/ConsoleOverview" } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 必须配合 X-Sop-Timestamp / X-Sop-Nonce / X-Sop-Signature 完整签名验证；单独传此头不构成有效认证。
    sopTimestamp: { type: apiKey, in: header, name: X-Sop-Timestamp, description: HMAC 签名时间戳；与其他三个签名头同时验证 }
    sopNonce: { type: apiKey, in: header, name: X-Sop-Nonce, description: HMAC 唯一 nonce；拒绝重放 }
    sopSignature: { type: apiKey, in: header, name: X-Sop-Signature, description: 按 HMAC 协议生成的请求签名；仅提供四个头并不代表验证成功 }

  parameters:
    RequiredBusinessProjectId:
      name: X-Project-Id
      in: header
      required: true
      schema: { type: string, minLength: 1 }
      description: 必须显式选择已授权项目；不使用服务端环境默认项目。query/body 的 project_id 如存在必须与此头一致。
    XProjectId:
      name: X-Project-Id
      in: header
      required: false
      schema: { type: string }
      description: 多项目作用域；登录后由前端自动注入
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    SizeParam:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BusinessProjectMissing:
      description: 缺少有效项目上下文或 project_id 与授权项目头不一致
      content:
        application/json: { schema: { $ref: '#/components/schemas/BusinessAccessError' } }
    BusinessUnauthorized:
      description: 身份缺失、过期或无效；必须有效 Bearer 或完整验证的 HMAC 签名
      content:
        application/json: { schema: { $ref: '#/components/schemas/BusinessAccessError' } }
    BusinessForbidden:
      description: 无当前项目访问、写入或配置权限
      content:
        application/json: { schema: { $ref: '#/components/schemas/BusinessAccessError' } }
    BusinessNotFound:
      description: 授权项目或当前项目内资源不存在
      content:
        application/json: { schema: { $ref: '#/components/schemas/BusinessAccessError' } }
    Unauthorized:
      description: 未认证
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Forbidden:
      description: 无权限
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    NotFound:
      description: 不存在
      content:
