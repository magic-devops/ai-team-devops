            \ runtime binding requires project configure and accessible same-tenant runtime read; it does not grant execute. Executor\
            \ association is optional, explicit and fixed before handoff. project.lifecycle requires target_status, a nonblank\
            \ reason, a current preview_basis and outer CAS/idempotency identity. Restore explicitly chooses planning, active\
