      - source
      - model
      - provider
      - usage
      - basis
      - requirement_revision
      - created_at
      properties:
        id:
          type: string
          minLength: 64
          maxLength: 64
        action:
          type: string
          enum:
          - parse
          - review
          - prototype
        source:
          type: string
          enum:
          - ai
          - rules
        model: *id001
        provider: *id001
        usage:
          $ref: '#/components/schemas/AssistanceUsage'
        basis:
          type: string
          description: Opaque frozen requirement basis; empty for parse. Includes review/design source fields and differs
            from task-plan basis.
        requirement_revision:
          anyOf:
          - &id002
            type: integer
          - type: 'null'
        created_at:
          type: string
          format: date-time
        stale:
          type: boolean
          description: True when replay/history refers to an older requirement basis/revision; it cannot be adopted
            as current.
        generation_id:
          type: string
          description: Adoption response also links the original generation ID.
      description: Committed generation receipt. AI metadata records the gateway model/provider and observed use; rules
        has empty model/provider and empty usage. This is a suggestion, never approval or verified delivery.
    AssistanceIntakeItem:
      additionalProperties: false
      properties:
        title:
          maxLength: 256
          minLength: 1
          title: Title
          type: string
        description:
          default: ''
          maxLength: 20000
          title: Description
          type: string
        priority:
          default: P2
          enum:
          - P0
          - P1
          - P2
          - P3
          title: Priority
          type: string
        acceptance_criteria:
          items:
            maxLength: 2000
            minLength: 1
            type: string
          maxItems: 80
          title: Acceptance Criteria
          type: array
        tags:
          items:
            maxLength: 80
            minLength: 1
            type: string
          maxItems: 20
          title: Tags
          type: array
        assigned_agent: *id001
        dev_tool: *id001
      required:
      - title
