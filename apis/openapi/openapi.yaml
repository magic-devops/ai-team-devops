      type: object
      allOf:
      - if:
          anyOf:
          - required:
            - generation_id
            properties:
              generation_id:
                not:
                  type: 'null'
          - required:
            - expected_version
            properties:
              expected_version:
                not:
                  type: 'null'
          - required:
            - idempotency_key
            properties:
              idempotency_key:
                not:
                  type: 'null'
        then:
          required:
          - generation_id
          - expected_version
          - idempotency_key
          properties:
            generation_id:
              not:
                type: 'null'
            expected_version:
              not:
                type: 'null'
            idempotency_key:
              not:
                type: 'null'
            items:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/AssistanceEditedImportItem'
      description: Legacy manual imports remain supported without generation fields. A generated preview is adopted
        only with all three nonnull generation_id/expected_version/idempotency_key fields. The whole edited selection
        is validated and committed in one SQL transaction; stable retries recover the same IDs.
    AssistanceReviewInput:
      additionalProperties: false
      properties:
        generator:
          default: rules
          enum:
          - ai
          - rules
          title: Generator
          type: string
        idempotency_key:
