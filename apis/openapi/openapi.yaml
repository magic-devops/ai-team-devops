            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePreviewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BusinessProjectMissing'
        '401':
          $ref: '#/components/responses/BusinessUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
      description: 'Requires an explicitly selected authorized project. Pure read: no tasks, calendars, receipts,
        events or progress observations are written, and no runtime/model is invoked. Planning dates are civil UTC
        dates. The planning_basis covers the full current project regardless of visible filters. Human hours and agent/tool
        planning slots are distinct; unknown availability is null and explicit zero is unavailable. A reservation
        is planning data, never actual work or observed concurrency. Validate the exact selected batch against its
        pinned planning_basis and the final candidate dependency graph and allocation bounds. Return explicit before/after
        states; preview does not save. tasks.schedule revalidates basis and CAS before its atomic write.'
  /api/v1/delivery/workspace:
    get:
      tags: [delivery]
      operationId: deliveryWorkspace
      summary: Project delivery, canonical tasks, execution evidence and review snapshot
      security: [{ bearerAuth: [] }]
      parameters: [{ name: X-Project-Id, in: header, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Effective workflow snapshot; stale evidence is not counted as accepted delivery
