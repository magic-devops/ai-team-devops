        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: []
          title: Tags
        assigned_agent:
          anyOf:
          - type: string
          - type: 'null'
          default: ''
          title: Assigned Agent
        dev_tool:
          anyOf:
          - type: string
          - type: 'null'
          default: ''
