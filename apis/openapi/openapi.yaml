      operationId: setProjectDefaultModel
      tags: [models]
      summary: 保存项目默认聊天模型
      description: 需要配置权限（项目管理员，或有权管理该项目的租户管理员、超级管理员）。model_id 必须已在内置或当前项目自定义目录注册。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      parameters: [{ name: model_id, in: query, required: true, schema: { type: string } }]
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                type: object
                required: [ok, default]
                properties:
                  ok: { type: boolean }
                  default: { type: string }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
        '422': { description: 缺少 model_id }

  /api/v1/models/providers/{name}:
    parameters:
      - { $ref: '#/components/parameters/RequiredBusinessProjectId' }
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      operationId: saveProjectModelProvider
      tags: [models]
      summary: 保存提供商凭证、地址及启用状态
      description: 需要配置权限。路径 name 必须与请求 name 相同。已配置的凭证在提交空值或原掩码时保留；可提交 ${ENV_VAR} 引用。保存配置不代表适配器或远端模型已经验证可用。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ModelProviderInput' } }
      responses:
        '200':
          description: 已保存，返回凭证掩码
          content:
            application/json:
              schema:
                type: object
                required: [ok, provider]
                properties:
                  ok: { type: boolean }
                  provider: { $ref: '#/components/schemas/ModelProviderPublic' }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }
        '422': { description: 提供商标识或地址无效 }
    delete:
      operationId: deleteProjectModelProvider
      tags: [models]
      summary: 删除提供商配置
      description: 需要配置权限。引用此提供商的聊天模型随后调用会明确报告未配置。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      responses:
        '200': { description: 已删除或原本不存在, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessOk' } } } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }

  /api/v1/models/providers/{name}/test:
    parameters:
      - { $ref: '#/components/parameters/RequiredBusinessProjectId' }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      operationId: testProjectModelProvider
      tags: [models]
      summary: 检查提供商配置与自定义地址连通性
      description: 需要配置权限。自定义 base_url 只执行 HEAD 连通性检查；configured、reachable 都不能证明真实模型调用成功。禁用、无凭证或缺少适配器以 200 响应中的 ok=false 和 status 表达。
      security: [{ bearerAuth: [] }, { apiKeyAuth: [], sopTimestamp: [], sopNonce: [], sopSignature: [] }]
      responses:
        '200': { description: 配置或连通性检查结果, content: { application/json: { schema: { $ref: '#/components/schemas/ModelProviderCheck' } } } }
        '400': { $ref: '#/components/responses/BusinessProjectMissing' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '403': { $ref: '#/components/responses/BusinessForbidden' }
        '404': { $ref: '#/components/responses/BusinessNotFound' }

