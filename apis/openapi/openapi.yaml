      description: Signed CI evidence and immutable release candidates use the same CAS and receipts. release.save is retired.
        Candidate approval never proves deployment. Controlled deployments use exact environment generations, immutable plans
        and explicit dispatch/start/advance/observe/cancel/sync. Unknown outcomes never permit automatic side-effect replay. Issue
        diagnosis adoption requires approve, original selected evidence access and current issue/evidence basis. It reuses the
        unique source Issue requirement without overwriting existing work or closing the Issue. Dismissal records an explicit
        cancellation/rejection; it does not stop a remote provider. Runtime controls require an explicit preview, exact run/attempt,
        semantic basis and nonempty reason. Only-id cancellation is invalid. Requested/unknown physical stops block rerun, handoff
        and archive. Receipt replay retains its original attempt; queued recovery requires an explicit new preview. Technical
        logs never prove task acceptance. Actual title/description/acceptance_criteria changes require requirement_basis and change_preview_basis
        from the reviewed exact proposal. Project CAS and fixed command idempotency still apply; metadata-only edits do not invalidate
        all acceptance.
