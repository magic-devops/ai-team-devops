          const: current_scope
        unit:
          const: tasks
        remaining_basis:
          const: verified_completion
        actual_basis:
          const: persisted_observations
        current_metrics:
          $ref: '#/components/schemas/ProgressMetrics'
        current_observation:
          type: object
          required:
          - day
          - remaining
          - observed_at
          - observation_id
          - source
          - metrics
          properties:
            day:
              type:
              - integer
              - 'null'
            remaining:
              type: number
            observed_at:
              type: string
              format: date-time
            observation_id:
              type: 'null'
            source:
              const: live
            metrics:
              $ref: '#/components/schemas/ProgressMetrics'
        coverage:
          allOf:
          - $ref: '#/components/schemas/ProgressCoverage'
          - type: object
            required:
            - range
            - window_truncated
            properties:
              range:
                $ref: '#/components/schemas/ProgressRange'
              window_truncated:
                type: boolean
      description: Legacy numeric-day adapter for the same durable UTC facts. Actual contains only recorded dates, maximum
        366 selected days; consumers must preserve gaps rather than connect sparse observations. current_observation
        is live and is not appended as history. Missing valid plan dates produces no ideal/actual time curve. Ideal
