              schema: { $ref: '#/components/schemas/DeliveryWorkspace' }
        '403': { description: Project access denied }
  /api/v1/delivery/execution-targets:
    get:
      tags: [delivery]
      operationId: deliveryExecutionTargets
      summary: Explicit execution targets, configured grants and observed worker capabilities
      description: Pure read. Presence is fresh for 120 seconds and does not change device configuration versions or target basis. Provider program detection never proves account authentication. Missing devices do not select local execution.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: X-Project-Id, in: header, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Execution authorization and available target catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionTargetsResponse' }
  /api/v1/delivery/execution-preview:
    post:
      tags: [delivery]
      operationId: deliveryExecutionPreview
      summary: Preview a pinned task, explicit execution target, agent and command tests
      description: Pure read with no Manager/runtime writes or audit events. Uses exactly the queue validator. New task/target basis requires explicit adoption; preview grants no future permission. Agent test IDs are derived from test_nodes; nodes/test_node_ids are only for command mode. Provider authentication stays unknown.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: X-Project-Id, in: header, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionQueue' }
      responses:
        '200':
          description: Original requirement acceptance snapshot and normalized fixed plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionPreviewResponse' }
        '403': { description: Project or runtime workspace access denied }
        '409': { description: Fixed task/target basis or agent version changed }
        '422': { description: Explicit target or command test definition is invalid }
        '503': { description: Execution target is currently unavailable }
  /api/v1/delivery/executions/{execution_id}/observations:
    get:
      tags: [delivery]
      operationId: deliveryExecutionObservations
      summary: Read existing execution events and structured node evidence
      description: Pure bounded runtime stream projection with both project and workspace permissions. Cursor belongs to this project/execution/run. Logs are completed node results, not live within-node streaming. Unknown usage remains null; retry evidence preserves its attempt. Successful execution and tests still require human acceptance.
      security: [{ bearerAuth: [] }]
      parameters:
      - { name: X-Project-Id, in: header, required: true, schema: { type: string } }
      - { name: execution_id, in: path, required: true, schema: { type: string } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      - { name: cursor, in: query, schema: { type: string, maxLength: 1000, default: '' } }
      responses:
        '200':
          description: Ordered existing events, bounded node evidence and available actions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionObservationsResponse' }
        '403': { description: Project or runtime workspace access denied }
        '404': { description: Execution is outside this project or missing }
        '422': { description: Cursor is malformed or belongs to another execution }
  /api/v1/delivery/task-plan-preview:
    post:
      tags: [delivery]
      operationId: deliveryTaskPlanPreview
      summary: Preview an editable task plan against a fixed requirement revision
      description: |
        Requires project write permission. This creates no business tasks or execution
        processes. The generator is either an explicit template or the existing model
        gateway; AI failures never fall back to template success. Persist expected_version
        and idempotency_key before sending. Replaying the same successful request returns
        the stored preview, while an in-progress attempt returns a conflict and a failed
        attempt replays its original error rather than silently repeating model work.
        The preview version remains the input version.
        Submit the selected, edited items through tasks.plan to create canonical tasks.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: X-Project-Id, in: header, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskPlanPreviewRequest' }
      responses:
        '200':
          description: Stored, validated preview with immutable requirement basis and model usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPlanPreview' }
        '400': { description: Project context missing }
        '401': { description: Authentication required }
        '403': { description: Project write permission denied }
        '404': { description: Scoped project or requirement not found }
        '409': { description: Version or requirement basis conflict, changed request identity, or preview already running }
        '422': { description: Invalid request, task draft, date range or dependency graph }
        '429': { description: Model gateway quota or provider limit exceeded; failure is explicit }
        '502': { description: Model provider failure or invalid model output; no template fallback }
        '503': { description: Model gateway unavailable; no template fallback }
  /api/v1/delivery/commands:
    post:
      tags:
      - delivery
      operationId: deliveryCommand
      summary: Apply a versioned and idempotent delivery command
      description: 'execution.queue persists an immutable dispatch intent. execution.sync sends it

        through existing adapters, or observes actual run evidence. It never starts a run.

        Start via the existing runtime run action API. execution.review requires project

        approval and runtime workspace access. Successful execution alone never completes

        a business task. Retry the identical command with the same idempotency key.

        task.update can maintain dependency IDs and acceptance criterion indexes; changing

        either association requires the current task_basis, including for independent tasks.

        Empty arrays explicitly clear associations. Stale task scope is rejected.


        project.update changes only explicitly supplied fields, retaining untouched owner/goal/dates. name/description
        edit the canonical Project and require configure; other project metadata keeps write. resource.save/archive
        require configure and share workspace CAS, receipts and audit events. Archiving retains the record; saving
        the same id with archived=false restores it. Resources never fetch links.

        progress.record requires write and records current UTC facts. baseline.create requires approve and freezes
        an immutable plan after checking complete task IDs and content basis. Both use the same CAS, idempotency receipts
        and atomic business transaction; failures retain no successful observation.

        task.manual_review requires approve and fixed task basis, project version and idempotency identity. A changed
        basis returns structured 409 code task_review_basis_changed without saving a decision. Manual acceptance,
        permanent invalidation and progress observations share the business transaction.

        member.calendar.save requires configure and a complete calendar. tasks.schedule requires write and applies
        an explicit final batch atomically. Both pin planning_basis/CAS/retry identity. task.update dates/reservations
        share the same validator and require planning_basis. Changed planning returns structured 409 planning_basis_changed.
        kind is immutable and member.save has no capacity field.'
      security:
      - bearerAuth: []
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryCommand'
      responses:
        '200':
          description: Updated snapshot with replayed and applied_version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryWorkspace'
        '403':
          description: Project or execution permission denied
        '409':
          description: Version conflict
          changed evidence: null
          active execution or invalid stage transition: null
        '422':
          description: Invalid action payload
        '503':
          description: Runtime unavailable; durable dispatch intent remains retryable
