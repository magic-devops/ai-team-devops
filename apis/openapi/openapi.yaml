        generation_id:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Generation Id
        expected_version:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Expected Version
        idempotency_key:
          anyOf:
          - maxLength: 100
            minLength: 8
            type: string
          - type: 'null'
          default: null
          title: Idempotency Key
      required:
      - items
