    DeliveryCommand:
      type: object
      additionalProperties: false
      required:
      - action
      - payload
      - expected_version
      - idempotency_key
      properties:
        action:
          type: string
          enum:
          - project.update
          - resource.save
          - resource.archive
          - member.save
          - milestone.save
          - requirement.create
          - requirement.update
          - task.create
          - task.update
          - tasks.plan
          - artifact.add
          - stage.advance
          - stage.reopen
          - issue.promote
          - release.save
          - execution.queue
          - execution.sync
          - execution.review
          - execution.cancel
        payload:
          type: object
          description: 'Validated per action. execution.queue requires task_id and workspace_id,

            either agent_id + agent_version or nodes [{id, argv, timeout_seconds?}],

            optional target_device_id and test_node_ids. sync/cancel require id.

            review requires id, decision (accept/request_changes), comment and run_version.

            '
        expected_version:
          type: integer
          minimum: 0
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 100
      allOf:
      - if:
          properties:
            action:
              const: tasks.plan
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/TaskPlan'
      - if:
          properties:
            action:
              const: task.update
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/TaskEdit'
      - if:
          properties:
            action:
              const: project.update
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/DeliveryProjectEdit'
      - if:
          properties:
            action:
              const: resource.save
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/ResourceSave'
      - if:
          properties:
            action:
              const: resource.archive
          required:
          - action
        then:
          properties:
            payload:
              $ref: '#/components/schemas/ResourceArchive'
    TaskEdit:
      type: object
      additionalProperties: false
      required: [id]
      description: |
        Patch only the supplied task fields. Dependency and acceptance associations
        require both the current requirement basis and revision. Omit these arrays
        to preserve associations; use an empty array to clear them. Explicit null
        associations are invalid. Date changes validate the resulting saved range
        and the planned date order of predecessor and successor tasks atomically.
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        status: { type: [string, 'null'], enum: [pending, in_progress, blocked, completed, null], default: null }
        owner_id: { type: [string, 'null'], maxLength: 100, default: null }
        description: { type: [string, 'null'], maxLength: 10000, default: null }
        starts_on: { type: [string, 'null'], format: date, default: null }
        ends_on: { type: [string, 'null'], format: date, default: null }
        blocked_reason: { type: [string, 'null'], maxLength: 2000, default: null }
        depends_on:
          type: array
          maxItems: 40
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Existing canonical task IDs in this project; strings are trimmed and empty IDs, duplicates, self-dependencies and cycles are rejected
        acceptance_criteria:
          type: array
          maxItems: 80
          uniqueItems: true
          items: { type: integer, minimum: 0 }
          description: Zero-based indexes into the explicitly adopted current requirement acceptance criteria
        requirement_revision: { type: [integer, 'null'], minimum: 1, default: null }
        requirement_basis: { type: [string, 'null'], minLength: 64, maxLength: 64, default: null }
      allOf:
        - if:
            anyOf:
              - required: [depends_on]
              - required: [acceptance_criteria]
          then:
            required: [requirement_basis, requirement_revision]
            properties:
              requirement_basis: { type: string, minLength: 64, maxLength: 64 }
              requirement_revision: { type: integer, minimum: 1 }
    TaskDraft:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        description: { type: string, maxLength: 10000, default: '' }
        owner_id: { type: string, maxLength: 100, default: '' }
        priority: { type: string, enum: [P0, P1, P2, P3], default: P1 }
        estimate: { type: string, enum: [XS, S, M, L, XL], default: M }
        key:
          type: string
          maxLength: 64
          default: ''
          description: Unique draft key referenced by other items in this plan
        acceptance_criteria:
          type: array
          maxItems: 80
          uniqueItems: true
          default: []
          items: { type: integer, minimum: 0 }
          description: Zero-based indexes into the fixed requirement acceptance criteria
        depends_on:
          type: array
          maxItems: 40
          uniqueItems: true
          default: []
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Other selected draft keys or existing task IDs in the current project; strings are trimmed and empty IDs, duplicates and cycles are rejected
        starts_on: { type: [string, 'null'], format: date, default: null }
        ends_on:
          type: [string, 'null']
          format: date
          default: null
          description: Must be on or after starts_on when both dates are set
        blocked_reason: { type: string, maxLength: 2000, default: '' }
    TaskPlan:
      type: object
      additionalProperties: false
      required: [requirement_id, items]
      properties:
        requirement_id: { type: string, minLength: 1, maxLength: 64 }
        items:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: '#/components/schemas/TaskDraft' }
        requirement_revision: { type: [integer, 'null'], minimum: 1, default: null }
        requirement_basis:
          type: [string, 'null']
          minLength: 64
          maxLength: 64
          default: null
          description: SHA-256 of the fixed requirement basis; changed requirements require explicit rebase
        preview_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 64
          default: null
          description: Optional same-project preview whose server-recorded source is carried into task planning
    TaskPlanPreviewRequest:
      type: object
      additionalProperties: false
      required: [requirement_id, expected_version, idempotency_key]
      properties:
        requirement_id: { type: string, minLength: 1, maxLength: 64 }
        expected_version: { type: integer, minimum: 0 }
        idempotency_key: { type: string, minLength: 8, maxLength: 100 }
        generator: { type: string, enum: [template, ai], default: template }
        mode: { type: string, enum: [frontend, backend, fullstack, testing], default: fullstack }
        max_items: { type: integer, minimum: 1, maximum: 40, default: 8 }
    TaskPlanRequirementSnapshot:
      type: object
      required: [id, title, description, acceptance_criteria]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        acceptance_criteria: { type: array, items: { type: string } }
    TaskPlanUsage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens, cost_usd]
      properties:
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        cost_usd: { type: number, minimum: 0 }
    TaskPlanPreview:
      type: object
      required: [id, version, requirement_revision, requirement_basis, requirement_snapshot, items, source, model, provider, usage, warnings]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 0, description: Fixed workspace version supplied in the original preview request }
        requirement_revision: { type: integer, minimum: 1 }
        requirement_basis: { type: string, minLength: 64, maxLength: 64 }
        requirement_snapshot: { $ref: '#/components/schemas/TaskPlanRequirementSnapshot' }
        items: { type: array, minItems: 1, maxItems: 40, items: { $ref: '#/components/schemas/TaskDraft' } }
        source: { type: string, enum: [template, ai] }
        model: { type: string, description: Empty for template previews }
        provider: { type: string, description: Empty for template previews }
        usage: { $ref: '#/components/schemas/TaskPlanUsage' }
        warnings: { type: array, items: { type: string } }
    DeliveryTaskPlanning:
      type: object
      description: |
        Optional, additive task planning metadata. Legacy tasks may omit this object
        or return an empty/partial object. A missing source must not be presented as
        a generated or manually confirmed plan. Requirement snapshots preserve the
        acceptance criteria that the saved zero-based indexes originally referenced.
      properties:
        key: { type: string }
        acceptance_criteria: { type: array, items: { type: integer, minimum: 0 } }
        depends_on: { type: array, items: { type: string }, description: Resolved canonical task IDs }
        starts_on: { type: [string, 'null'], format: date }
        ends_on: { type: [string, 'null'], format: date }
        blocked_reason: { type: string }
        requirement_revision: { type: integer, minimum: 1 }
        requirement_basis: { type: string, minLength: 64, maxLength: 64 }
        requirement_snapshot: { $ref: '#/components/schemas/TaskPlanRequirementSnapshot' }
        preview_id: { type: [string, 'null'] }
        source: { type: string, enum: [manual, template, ai] }
        model: { type: string }
        provider: { type: string }
        usage:
          oneOf:
            - { $ref: '#/components/schemas/TaskPlanUsage' }
            - { type: object, maxProperties: 0 }
          description: Model usage when recorded; empty for a manually confirmed plan without model work
    DeliveryRequirement:
      type: object
      required: [id, basis]
      properties:
        id: { type: string }
        basis:
          type: string
          minLength: 64
          maxLength: 64
          description: Current SHA-256 requirement basis, including legacy requirements without a delivery flow
        title: { type: string }
        description: { type: [string, 'null'] }
        priority: { type: [string, 'null'] }
        acceptance_criteria: { type: [array, 'null'], items: { type: string } }
        flow: { type: object }
        tasks_total: { type: integer, minimum: 0 }
        tasks_done: { type: integer, minimum: 0 }
    DeliveryTask:
      type: object
      properties:
        id:
          type: string
        req_id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
        assigned_to:
          type: string
        planning:
          $ref: '#/components/schemas/DeliveryTaskPlanning'
        dependency_blocked:
          type: array
          items:
            type: string
          description: Prerequisite task IDs whose effective delivery is incomplete
        owner_explicit:
          type: boolean
          description: True only if delivery task_owners records this task ID. Legacy inferred names require independent
            roster uniqueness checks before personal attribution.
    DeliveryWorkspace:
      type: object
      required:
      - version
      - project
      - requirements
      - tasks
      - executions
      - permissions
      - resources
      properties:
        version:
          type: integer
          minimum: 0
        project:
          $ref: '#/components/schemas/DeliveryProject'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryRequirement'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryTask'
        executions:
          type: array
          items:
            type: object
            required:
            - id
            - task_id
            - workspace_id
            - status
            - snapshot
            - run_id
            - run_version
            - stale
            properties:
              id:
                type: string
              task_id:
                type: string
              workspace_id:
                type: string
              run_id:
                type: string
              run_version:
                type: integer
              status:
                type: string
              snapshot:
                type: object
              stale:
                type: boolean
              progress:
                type: integer
                minimum: 0
                maximum: 100
              results:
                type: object
              review:
                type: object
        permissions:
          type: object
        replayed:
          type: boolean
        applied_version:
          type: integer
        resources:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryResource'
          description: Includes archived resources. Legacy absent metadata returns an empty collection without read-side
            writes.
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type:     { type: string, format: uri }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items: { type: object, additionalProperties: true }

    HealthOut:
      type: object
      required: [ok, service, version]
      properties:
        ok: { type: boolean }
        service: { type: string }
        version: { type: string }
        startedAt: { type: string, format: date-time }
        scopedTenantId: { type: string }
        scopedProjectId: { type: string }
        admin_mode: { type: string, enum: [single, saas] }
        min_agentd_version: { type: string, description: 最低 sop-agentd 版本（升级提示） }

    LoginIn:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
