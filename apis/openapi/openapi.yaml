        replayed: *id003
        applied_version: *id002
        generation: *id006
        workspace: *id007
        artifact_id: *id001
        content: *id001
      description: Appends a recorded prototype artifact for the current requirement revision; preserves prior artifacts
        and does not approve or advance a stage.
