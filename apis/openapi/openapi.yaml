      type: object
    AssistanceParseDocumentResult:
      type: object
      required:
      - ok
      - generation
      - expected_version
      - source
      - items
      - count
      properties:
        ok: &id003
          type: boolean
        generation: &id004
          $ref: '#/components/schemas/AssistanceGeneration'
        expected_version: &id005
          type: integer
          minimum: 0
          description: Workspace version observed when preparing the preview; adoption requires explicit current version.
        source:
          type: string
          enum:
          - llm
          - local_rules
          description: Legacy-compatible source; generation.source is the explicit ai/rules source.
        warning: *id001
        items:
