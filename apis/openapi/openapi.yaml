          title: Total Tokens
          type: integer
        cost_usd:
          default: 0.0
          title: Cost Usd
          type: number
      title: ChatUsage
      type: object
    WorkflowStartInput:
      properties:
        type:
          title: Type
          type: string
        workflow_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Workflow Id
        args:
          additionalProperties: true
          title: Args
          type: object
          description: 'sprint_lifecycle: tasks (string array), sprint_id?, duration_seconds? (default 120). code_review:
            diff?, timeout_seconds? (default 30). bug_triage: issue_id?, text?, default_assignee?, timeout_seconds?
            (default 30). Timeout is finite, 0..2592000 seconds. This payload cannot set authentication or scope.'
      required:
      - type
      title: StartIn
      type: object
      description: Known registered types are sprint_lifecycle, code_review and bug_triage. Optional workflow_id is
        stable in the current tenant/project; matching actor/type/args replay, changed input conflicts. Args must not
        supply actor/scope/workflow identifiers or underscore-prefixed keys. Omitted ID creates a new run, so retry
        with the same explicit ID after an uncertain response.
    WorkflowSignalInput:
      properties:
        signal:
          title: Signal
          type: string
        payload:
          additionalProperties: true
          title: Payload
          type: object
          description: comment is required by every current handler. complete_task also needs task_id from this workflow;
            reassign needs nonempty assignee. signal_id is optional. Identity and project scope are server-resolved.
      required:
      - signal
      title: SignalIn
      type: object
      description: Send a supported signal for the selected workflow type. Payload needs a nonempty textual comment
        of at most 10000 characters; actor_id is injected from authentication. Optional signal_id (stringified, at most
        128 characters) gives stable replay; same signal_id with different signal/payload returns 409. Never send tenant/project/actor/underscore
        keys.
    WorkflowBulkCancelInput:
      properties:
        workflow_ids:
          items:
            type: string
          maxItems: 100
          minItems: 1
          title: Workflow Ids
          type: array
      title: BulkCancelIn
      type: object
