      type: object
      required:
      - generation
      - status
      - result
      - error
      - adoptions
      properties:
        generation:
          $ref: '#/components/schemas/AssistanceGeneration'
        status:
          type: string
          enum:
          - generating
          - succeeded
          - failed
        result:
          anyOf:
          - $ref: '#/components/schemas/AssistanceReviewResult'
          - $ref: '#/components/schemas/AssistancePrototypeResult'
          - type: 'null'
        error:
          anyOf:
          - type: object
