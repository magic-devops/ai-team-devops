            - observation_id
            - observed_at
            - source
            - metrics
            properties:
              day:
                type: integer
              remaining:
                type: number
              date:
                type: string
                format: date
              observation_id:
                type: string
              observed_at:
                type: string
                format: date-time
              source:
                type: string
              metrics:
                $ref: '#/components/schemas/ProgressMetrics'
        history_available:
          type: boolean
        observed_at:
          type: string
          format: date-time
