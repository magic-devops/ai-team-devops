version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: sop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sopdev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sopdb}
      MYSQL_USER: ${MYSQL_USER:-sop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sopdev}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: sop-milvus
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    profiles: ["milvus"]

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: sop-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    profiles: ["milvus"]

  minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    container_name: sop-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    profiles: ["milvus"]

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sop-admin
    env_file:
      - .env
    environment:
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-}
      - VECTOR_DB_TYPE=${VECTOR_DB_TYPE:-lance}
      - ADMIN_MODE=${ADMIN_MODE:-single}
      - PROJECT_PATH=/workspace
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - TENANT_ID=${TENANT_ID:-t-default}
      - PROJECT_ID=${PROJECT_ID:-proj-default}
      - LOG_DIR=/workspace/.sop-runtime/logs
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ${PROJECT_PATH:-.}:/workspace
      - ./:/app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  etcd_data:
  minio_data:
