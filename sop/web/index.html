<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ai-team-devops 管理后台</title>
<link rel="icon" type="image/png" href="/assets/brand-mark.png"/>
<link rel="apple-touch-icon" href="/assets/brand-mark.png"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<!-- 模块化页面文件（每个文件独立，AI 按需修改） -->
<script type="text/babel" src="pages/agents.js"></script>
<script type="text/babel" src="pages/skills.js"></script>
<script type="text/babel" src="pages/mcp.js"></script>
<script type="text/babel" src="pages/system.js"></script>
<script type="text/babel" src="pages/auth.js"></script>
<script type="text/babel" src="pages/models.js"></script>
<script type="text/babel" src="pages/orchestration.js"></script>
<script type="text/babel" src="pages/docker.js"></script>
<script type="text/babel" src="pages/skill_repo.js"></script>
<script type="text/babel" src="pages/vibe.js"></script>
<script type="text/babel" src="pages/notify.js"></script>
<script type="text/babel" src="pages/cli.js"></script>
<style>
/* ── CSS 变量（主题） ─────────────────────────────────────────── */
:root{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#0f172a;--border:#334155;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#3b82f6;--accent2:#2563eb;
  --sidebar-w:220px;--header-h:52px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.12);
  --shadow-md:0 8px 24px rgba(0,0,0,.22);
  --toast-ok:#22c55e;--toast-err:#ef4444;--toast-info:#3b82f6;
  --skeleton:#334155;--skeleton-shine:rgba(255,255,255,.06);
}
[data-theme=light]{
  --bg:#f1f5f9;--bg2:#ffffff;--bg3:#f8fafc;--border:#e2e8f0;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --shadow-sm:0 1px 3px rgba(15,23,42,.08);
  --shadow-md:0 12px 32px rgba(15,23,42,.1);
  --skeleton:#e2e8f0;--skeleton-shine:rgba(255,255,255,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── 布局 ─────────────────────────────────────────────────────── */
.app-shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:var(--header-h);background:var(--bg2);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);
  display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:20}
.topbar-brand{display:flex;align-items:center;gap:10px;min-width:0;user-select:none}
.topbar-logo-img{width:32px;height:32px;border-radius:10px;object-fit:cover;flex-shrink:0;
  box-shadow:0 2px 10px rgba(59,130,246,.28),inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent);
  transition:box-shadow .2s,transform .2s}
.topbar-brand:hover .topbar-logo-img{box-shadow:0 4px 18px rgba(59,130,246,.4);transform:translateY(-1px)}
.topbar-logo{font-size:15px;font-weight:800;background:linear-gradient(105deg,var(--accent) 0%,#22d3ee 55%,var(--accent2) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--accent);
  letter-spacing:-.4px;white-space:nowrap}
[data-theme=light] .topbar-logo{-webkit-text-fill-color:transparent}
.topbar-badge{background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar-project{font-size:12px;color:var(--text3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.body-wrap{display:flex;flex:1;overflow:hidden;min-height:0}

/* 细滚动条（侧栏 + 主区），避免系统默认粗白条 */
.scroll-slim{scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.35) transparent}
.scroll-slim::-webkit-scrollbar{width:7px;height:7px}
.scroll-slim::-webkit-scrollbar-track{background:transparent}
.scroll-slim::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.scroll-slim::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.42);background-clip:padding-box}

/* ── 侧边栏 ───────────────────────────────────────────────────── */
.sidebar{width:var(--sidebar-w);min-height:0;flex-shrink:0;
  background:linear-gradient(180deg,var(--bg2) 0%,color-mix(in srgb,var(--bg2) 88%,#020617) 100%);
  border-right:1px solid var(--border);box-shadow:2px 0 12px rgba(0,0,0,.12);
  display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:width .22s ease}
.sidebar.collapsed{width:52px}
.sidebar-group{padding:4px 0 10px}
.sidebar-group-label{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.04em;
  padding:14px 16px 6px;white-space:nowrap;overflow:hidden;border-top:1px solid transparent}
.sidebar-group:first-child .sidebar-group-label{border-top:none;padding-top:8px}
.sidebar.collapsed .sidebar-group-label{display:none}
.sidebar-item{display:flex;align-items:center;gap:10px;margin:1px 8px 1px 4px;padding:8px 12px;cursor:pointer;
  border-radius:10px;font-size:13px;color:var(--text2);transition:background .16s,color .16s,box-shadow .16s;white-space:nowrap;border-left:none}
.sidebar-item:hover{background:rgba(148,163,184,.1);color:var(--text)}
.sidebar-item.active{background:linear-gradient(90deg,rgba(59,130,246,.2),rgba(59,130,246,.06));color:var(--text);
  box-shadow:inset 3px 0 0 var(--accent),0 1px 0 rgba(255,255,255,.04);font-weight:600}
.sidebar-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sidebar-icon{font-size:16px;flex-shrink:0;width:22px;text-align:center;opacity:.95}
.sidebar.collapsed .sidebar-item{justify-content:center;margin:2px 6px;padding:9px 8px}
.sidebar.collapsed .sidebar-item span:last-child{display:none}
.sidebar-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:6px 12px}

[data-theme=light] .sidebar{background:linear-gradient(180deg,var(--bg2) 0%,#f1f5f9 100%);box-shadow:2px 0 8px rgba(15,23,42,.06)}
[data-theme=light] .sidebar-item:hover{background:rgba(59,130,246,.08)}
[data-theme=light] .sidebar-item.active{background:linear-gradient(90deg,rgba(59,130,246,.12),rgba(59,130,246,.04))}
[data-theme=light] .scroll-slim{scrollbar-color:rgba(100,116,139,.4) transparent}
[data-theme=light] .scroll-slim::-webkit-scrollbar-thumb{background:rgba(100,116,139,.28)}
[data-theme=light] .scroll-slim::-webkit-scrollbar-thumb:hover{background:rgba(100,116,139,.45)}

/* ── 主内容 ───────────────────────────────────────────────────── */
.main-content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 26px 28px;background:var(--bg);scroll-behavior:smooth}
.main-content.scroll-slim{padding-right:22px}
.app-main{min-height:min(100%,calc(100dvh - var(--header-h) - 24px))}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-enter{animation:pageIn .28s ease-out both}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.page-title{font-size:18px;font-weight:700;color:var(--text)}

/* ── 通用组件 ─────────────────────────────────────────────────── */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;
  transition:box-shadow .2s,border-color .2s,transform .2s}
.grid-4>.card,.grid-2>.card{position:relative;overflow:hidden}
.grid-4>.card::after,.grid-2>.card::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:12px;opacity:0;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent);transition:opacity .25s}
.grid-4>.card:hover::after,.grid-2>.card:hover::after{opacity:1}
.card h3{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:600}
.stat-val{font-size:28px;font-weight:700;color:var(--text)}
.stat-sub{font-size:12px;color:var(--text3);margin-top:2px}
.progress-bar{background:var(--border);border-radius:4px;height:6px;margin:8px 0}
.progress-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .3s}

/* ── 标签 ─────────────────────────────────────────────────────── */
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
.tag-p0{background:#7f1d1d;color:#fca5a5}.tag-p1{background:#7c2d12;color:#fdba74}
.tag-p2{background:#1e3a5f;color:#93c5fd}.tag-p3{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.tag-done{background:#14532d;color:#86efac}.tag-progress{background:#1e3a5f;color:#93c5fd}
.tag-blocked{background:#7f1d1d;color:#fca5a5}.tag-pending{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.tag-open{background:#7c2d12;color:#fdba74}.tag-resolved{background:#14532d;color:#86efac}

/* ── 列表 ─────────────────────────────────────────────────────── */
.list-item{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;
  transition:background .15s}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.list-item .title{font-size:13px;color:var(--text);flex:1}
.list-item .meta{font-size:11px;color:var(--text3);margin-top:2px}

/* ── 按钮 ─────────────────────────────────────────────────────── */
.btn{padding:6px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:transform .12s,box-shadow .15s,background .15s,opacity .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn-primary:hover:not(:disabled){background:var(--accent2);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-warn{background:#f59e0b;color:#000}.btn-warn:hover{background:#d97706}
.btn-sm{padding:3px 9px;font-size:11px}
.btn-cancel{background:var(--border);color:var(--text)}
.btn-icon{background:none;border:1px solid var(--border);color:var(--text2);padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .15s,color .15s,border-color .15s}
.btn-icon:hover{background:var(--bg3);color:var(--text)}
.btn-icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 表单 ─────────────────────────────────────────────────────── */
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-group select,.form-group textarea,.form-group input{
  width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:8px 10px;border-radius:7px;font-size:13px;outline:none;transition:border .15s}
.form-group select:focus,.form-group textarea:focus,.form-group input:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}

/* ── 弹窗 ─────────────────────────────────────────────────────── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;
  backdrop-filter:blur(4px);animation:fadeBg .2s ease-out}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px;width:440px;max-width:92vw;max-height:85vh;overflow-y:auto;
  box-shadow:0 24px 64px rgba(0,0,0,.45);animation:modalPop .22s cubic-bezier(.2,.9,.2,1)}
@keyframes modalPop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--text)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ── 其他 ─────────────────────────────────────────────────────── */
.section-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.empty{color:var(--text3);font-size:13px;padding:32px;text-align:center}
.alert{background:#7f1d1d;border:1px solid #991b1b;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#fca5a5}
.reflect-box{background:var(--bg3);border-radius:6px;padding:10px;font-size:12px;color:var(--text2);font-family:monospace;white-space:pre-wrap;max-height:120px;overflow-y:auto}
.confidence-bar{display:flex;align-items:center;gap:8px}
.confidence-val{font-size:12px;font-weight:700;min-width:36px}
.conf-high{color:#86efac}.conf-mid{color:#fdba74}.conf-low{color:#fca5a5}
.refresh-btn{background:var(--bg3);color:var(--text2);border:1px solid var(--border);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;
  display:inline-flex;align-items:center;gap:6px;transition:color .15s,background .15s,border-color .15s}
.refresh-btn:hover:not(:disabled){color:var(--text);background:var(--bg2);border-color:var(--accent)}
.refresh-btn:disabled{opacity:.6;cursor:wait}
.refresh-btn .refresh-icon{display:inline-block;transition:transform .35s ease}
.refresh-btn.busy .refresh-icon{animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 骨架屏 */
.skeleton-wrap{padding:8px 0}
.skeleton-line{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--skeleton) 0%,var(--skeleton-shine) 50%,var(--skeleton) 100%);
  background-size:200% 100%;animation:shimmer 1.1s ease-in-out infinite;margin-bottom:10px}
.skeleton-line.short{width:45%}.skeleton-line.mid{width:70%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-card{height:88px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);margin-bottom:12px;
  background:linear-gradient(90deg,var(--bg2) 0%,color-mix(in srgb,var(--text2) 12%,var(--bg2)) 50%,var(--bg2) 100%);background-size:200% 100%;animation:shimmer 1.2s ease-in-out infinite}

/* Toast */
.toast-host{position:fixed;top:calc(var(--header-h) + 10px);right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;min-width:220px;max-width:360px;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:500;
  box-shadow:var(--shadow-md);animation:toastIn .28s cubic-bezier(.2,.9,.2,1);border:1px solid var(--border);background:var(--bg2);color:var(--text)}
@keyframes toastIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.toast.ok{border-left:4px solid var(--toast-ok)}
.toast.err{border-left:4px solid var(--toast-err)}
.toast.info{border-left:4px solid var(--toast-info)}
/* 主题亮色适配 */
[data-theme=light] .tag-p3,[data-theme=light] .tag-pending{background:#f1f5f9;color:#64748b}
[data-theme=light] .modal{box-shadow:0 8px 30px rgba(0,0,0,.15)}

@media (prefers-reduced-motion: reduce) {
  .page-enter,.toast,.modal,.refresh-btn.busy .refresh-icon,.skeleton-line,.skeleton-card{animation:none!important}
  .sidebar-item,.btn,.card,.list-item{transition:none!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const API = 'http://localhost:8765/api';

function showToast(message, type) {
  window.dispatchEvent(new CustomEvent('devdash-toast', { detail: { message, type: type || 'info' } }));
}

function PageSkeleton({cards = 4}) {
  return <div className="skeleton-wrap page-enter" aria-busy="true" aria-label="加载中">
    <div className="grid-4" style={{marginBottom: 16}}>
      {[...Array(cards)].map((_, i) => <div key={i} className="skeleton-card" />)}
    </div>
    <div className="card" style={{ padding: '18px 20px' }}>
      {[...Array(5)].map((_, j) => <div key={j} className={'skeleton-line ' + (j % 3 === 0 ? 'short' : 'mid')} />)}
    </div>
  </div>;
}

function LoadError({message, onRetry}) {
  return <div className="card page-enter" style={{ borderLeft: '4px solid var(--toast-err)', padding: '20px 22px' }}>
    <div className="section-title">加载失败</div>
    <p style={{ color: 'var(--text2)', fontSize: 13, marginBottom: 14, lineHeight: 1.5 }}>{message || '请确认后端已启动（如 uvicorn main:app --port 8765）'}</p>
    {onRetry && <button type="button" className="btn btn-primary btn-sm" onClick={onRetry}>重试</button>}
  </div>;
}

function RefreshBtn({onClick, children}) {
  const [busy, setBusy] = React.useState(false);
  const run = () => {
    if (busy) return;
    setBusy(true);
    try { onClick(); } finally { setTimeout(() => setBusy(false), 500); }
  };
  return <button type="button" className={'refresh-btn' + (busy ? ' busy' : '')} disabled={busy} onClick={run}>
    <span className="refresh-icon" aria-hidden="true">↻</span>{children === undefined ? '刷新' : children}
  </button>;
}

function useFetch(url) {
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const load = React.useCallback(() => {
    setLoading(true);
    setError(null);
    fetch(url)
      .then((r) => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then((d) => { setData(d); setLoading(false); })
      .catch(() => {
        setError('无法连接 API 或响应异常');
        setLoading(false);
        setData(null);
      });
  }, [url]);
  React.useEffect(() => { load(); }, [load]);
  return { data, loading, error, reload: load };
}

function Tag({type, label}) {
  const cls = {
    P0:'tag-p0',P1:'tag-p1',P2:'tag-p2',P3:'tag-p3',
    completed:'tag-done',in_progress:'tag-progress',blocked:'tag-blocked',pending:'tag-pending',
    open:'tag-open',resolved:'tag-resolved',
  }[type] || 'tag-p3';
  return <span className={`tag ${cls}`}>{label||type}</span>;
}

function ConfBar({val}) {
  const pct = Math.round((val||0)*100);
  const cls = pct>=85?'conf-high':pct>=70?'conf-mid':'conf-low';
  return <div className="confidence-bar">
    <div className="progress-bar" style={{flex:1}}><div className="progress-fill" style={{width:pct+'%',background:pct>=85?'#22c55e':pct>=70?'#f59e0b':'#ef4444'}}/></div>
    <span className={`confidence-val ${cls}`}>{pct}%</span>
  </div>;
}

// ── 仪表盘 ──────────────────────────────────────────────────────
function Dashboard() {
  const {data, loading, error, reload} = useFetch(`${API}/dashboard`);
  if (loading) return <PageSkeleton cards={4} />;
  if (error || !data) return <LoadError message={error} onRetry={reload} />;
  const {sprint, tasks, requirements, issues, velocity} = data;
  const pct = tasks.total ? Math.round(tasks.completed/tasks.total*100) : 0;
  return <>
    {issues.critical?.length > 0 && <div className="alert">⚠ {issues.critical.length} 个 P0/P1 问题待处理：{issues.critical.map(i=>i.title).join('、')}</div>}
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="section-title">📊 项目总览 {sprint && <span style={{color:'#64748b',fontWeight:400}}>· {sprint.id} · {sprint.goal}</span>}</div>
      <RefreshBtn onClick={reload} />
    </div>
    <div className="grid-4">
      <div className="card"><h3>迭代完成率</h3><div className="stat-val">{pct}%</div><div className="progress-bar"><div className="progress-fill" style={{width:pct+'%'}}/></div><div className="stat-sub">{tasks.completed}/{tasks.total} 任务</div></div>
      <div className="card"><h3>阻塞任务</h3><div className="stat-val" style={{color:tasks.blocked?.length?'#fca5a5':'#86efac'}}>{tasks.blocked?.length||0}</div><div className="stat-sub">需要人工介入</div></div>
      <div className="card"><h3>待处理问题</h3><div className="stat-val" style={{color:issues.open?.length?'#fdba74':'#86efac'}}>{issues.open?.length||0}</div><div className="stat-sub">P0/P1: {issues.critical?.length||0}</div></div>
      <div className="card"><h3>需求总数</h3><div className="stat-val">{requirements.total||0}</div><div className="stat-sub">P0: {requirements.by_priority?.P0||0} · P1: {requirements.by_priority?.P1||0}</div></div>
    </div>
    {tasks.blocked?.length > 0 && <div className="card" style={{marginBottom:16}}>
      <div className="section-title">🚧 阻塞任务（需人工介入）</div>

        value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doSearch()} placeholder="搜索需求、任务、问题..."/>

      .then(()=>{setModal(false);reload();setForm({rule:'',category:'coding',source:'human',confidence:0.75});showToast('规则已添加','ok');})
      .catch(()=>showToast('添加失败','err'));

  const rules = data||[];

        <span style={{color:'#64748b',fontWeight:400,marginLeft:8}}>({byStatus[s]?.length||0})</span>

// ── 执行计划（任务 CRUD） ─────────────────────────────────────────
function ExecutionPlan() {
  const {data,loading,error,reload} = useFetch(`${API}/tasks`);
  const [modal,setModal] = React.useState(null); // null | 'create' | task
  const [form,setForm] = React.useState({title:'',description:'',priority:'P1',estimate:'M',assigned_to:'Coder',req_id:'',sprint_id:''});
  const [filter,setFilter] = React.useState('all');

  const save = () => {
    const isEdit = modal && modal.id;
    const url = isEdit ? `${API}/tasks/${modal.id}` : `${API}/tasks`;
    const method = isEdit ? 'PATCH' : 'POST';
    fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(form)})
      .then((r) => { if (!r.ok) throw new Error(); })
      .then(()=>{setModal(null);reload();showToast(isEdit?'任务已更新':'任务已创建','ok');})
      .catch(()=>showToast('保存失败','err'));
  };
  const del = (id) => {
    if(!confirm('确认删除？')) return;
    fetch(`${API}/tasks/${id}`,{method:'DELETE'})
      .then((r) => { if (!r.ok) throw new Error(); })
      .then(()=>{reload();showToast('已删除','ok');})
      .catch(()=>showToast('删除失败','err'));
  };
  const changeStatus = (id,status) => {
    fetch(`${API}/tasks/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})})
      .then((r) => { if (!r.ok) throw new Error(); })
      .then(()=>{reload();showToast('状态已更新','ok');})
      .catch(()=>showToast('更新失败','err'));
  };

  if (loading) return <PageSkeleton cards={2} />;
  if (error) return <LoadError message={error} onRetry={reload} />;

  const tasks = (data||[]).filter(t=>filter==='all'||t.status===filter);
  const statusOpts = ['pending','in_progress','completed','blocked'];
  const priorityOpts = ['P0','P1','P2','P3'];
  const estimateOpts = ['S','M','L'];

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="section-title">📋 执行计划</div>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <select style={{background:'#0f172a',border:'1px solid #334155',color:'#e2e8f0',padding:'4px 8px',borderRadius:6,fontSize:12}}
          value={filter} onChange={e=>setFilter(e.target.value)}>
          <option value="all">全部</option>
          {statusOpts.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <RefreshBtn onClick={reload}>{''}</RefreshBtn>
        <button className="btn btn-primary btn-sm" onClick={()=>{setModal('create');setForm({title:'',description:'',priority:'P1',estimate:'M',assigned_to:'Coder',req_id:'',sprint_id:''});}}>+ 新建任务</button>
      </div>
    </div>
    <div className="card">
      {tasks.length===0?<div className="empty">暂无任务</div>:tasks.map(t=><div key={t.id} className="list-item">
        <div style={{flex:1}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span className="title">{t.title}</span>
            <Tag type={t.status||'pending'}/>
            <Tag type={t.priority||'P2'}/>
            <span style={{fontSize:11,color:'#64748b'}}>{t.estimate||'-'}</span>
          </div>
          <div className="meta">{t.id} · {t.assigned_to||'-'} {t.req_id&&`· 需求:${t.req_id}`}</div>
          {t.confidence>0&&<ConfBar val={t.confidence}/>}
        </div>
        <div style={{display:'flex',gap:4,flexWrap:'wrap',justifyContent:'flex-end'}}>
          <select style={{background:'#0f172a',border:'1px solid #334155',color:'#94a3b8',padding:'2px 4px',borderRadius:4,fontSize:11}}
            value={t.status||'pending'} onChange={e=>changeStatus(t.id,e.target.value)}>
            {statusOpts.map(s=><option key={s}>{s}</option>)}
          </select>
          <button className="btn btn-sm btn-primary" onClick={()=>{setModal(t);setForm({title:t.title,description:t.description||'',priority:t.priority||'P1',estimate:t.estimate||'M',assigned_to:t.assigned_to||'Coder',req_id:t.req_id||'',sprint_id:t.sprint_id||''});}}>编辑</button>
          <button className="btn btn-sm" style={{background:'#7f1d1d',color:'#fca5a5'}} onClick={()=>del(t.id)}>删除</button>
        </div>
      </div>)}
    </div>
    {modal&&<div className="modal-bg" onClick={()=>setModal(null)}>
      <div className="modal" style={{width:480}} onClick={e=>e.stopPropagation()}>
        <h3>{modal==='create'?'新建任务':'编辑任务'}</h3>
        <div className="form-group"><label>标题</label><input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="任务标题"/></div>
        <div className="form-group"><label>描述</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="任务描述"/></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
          <div className="form-group"><label>优先级</label><select value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}>{priorityOpts.map(p=><option key={p}>{p}</option>)}</select></div>
          <div className="form-group"><label>估算</label><select value={form.estimate} onChange={e=>setForm({...form,estimate:e.target.value})}>{estimateOpts.map(p=><option key={p}>{p}</option>)}</select></div>
          <div className="form-group"><label>负责人</label><input value={form.assigned_to} onChange={e=>setForm({...form,assigned_to:e.target.value})}/></div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <div className="form-group"><label>关联需求 ID</label><input value={form.req_id} onChange={e=>setForm({...form,req_id:e.target.value})} placeholder="REQ-xxx"/></div>
          <div className="form-group"><label>Sprint ID</label><input value={form.sprint_id} onChange={e=>setForm({...form,sprint_id:e.target.value})} placeholder="SPRINT-1"/></div>
        </div>
        <div className="modal-actions">
          <button className="btn btn-cancel" onClick={()=>setModal(null)}>取消</button>
          <button className="btn btn-primary" onClick={save}>保存</button>
        </div>
      </div>
    </div>}
  </>;
}

// ── 迭代进度 ─────────────────────────────────────────────────────
function IterationProgress() {
  const {data:sprints,loading,error,reload} = useFetch(`${API}/sprints`);
  const [selected,setSelected] = React.useState(null);
  const [progress,setProgress] = React.useState(null);

  const loadProgress = (id) => {
    setSelected(id);
    fetch(`${API}/sprints/${id}/progress`).then(r=>r.json()).then(setProgress);
  };

  const active = (sprints||[]).find(s=>s.status==='active');
  React.useEffect(()=>{ if(active&&!selected) loadProgress(active.id); },[active?.id]);

  if (loading) return <PageSkeleton cards={2} />;
  if (error) return <LoadError message={error} onRetry={reload} />;

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="section-title">🏃 迭代进度</div>
      <RefreshBtn onClick={()=>{reload();selected&&loadProgress(selected);}} />
    </div>
    <div className="grid-2">
      <div className="card">
        <div className="section-title">迭代列表</div>
        {(sprints||[]).length===0?<div className="empty">暂无迭代</div>:(sprints||[]).map(s=><div key={s.id} className="list-item" style={{cursor:'pointer',background:selected===s.id?'#1e3a5f':''}} onClick={()=>loadProgress(s.id)}>
          <div style={{flex:1}}>
            <div className="title">{s.id}</div>
            <div className="meta">{s.goal?.slice(0,40)}</div>
          </div>
          <span className={`tag ${s.status==='active'?'tag-progress':s.status==='completed'?'tag-done':'tag-pending'}`}>{s.status}</span>
        </div>)}
      </div>
      <div>
        {!progress?<div className="card"><div className="empty">← 选择迭代查看进度</div></div>:<>
          <div className="grid-4" style={{marginBottom:12}}>
            <div className="card"><h3>完成率</h3><div className="stat-val">{progress.completion_rate}%</div><div className="progress-bar"><div className="progress-fill" style={{width:progress.completion_rate+'%'}}/></div></div>
            <div className="card"><h3>任务总数</h3><div className="stat-val">{progress.total_tasks}</div><div className="stat-sub">完成 {progress.completed}</div></div>
            <div className="card"><h3>阻塞</h3><div className="stat-val" style={{color:progress.blocked?.length?'#fca5a5':'#86efac'}}>{progress.blocked?.length||0}</div></div>
            <div className="card"><h3>平均置信度</h3><div className="stat-val" style={{fontSize:20}}>{Math.round((progress.avg_confidence||0)*100)}%</div></div>
          </div>
          {progress.blocked?.length>0&&<div className="card" style={{marginBottom:12}}>
            <div className="section-title">🚧 阻塞任务</div>
            {progress.blocked.map(t=><div key={t.id} className="list-item">
              <div style={{flex:1}}><div className="title">{t.title}</div><div className="meta">{t.id} · {t.assigned_to}</div></div>
              <Tag type="blocked"/>
            </div>)}
          </div>}
          {progress.open_issues?.length>0&&<div className="card">
            <div className="section-title">🐛 本迭代问题</div>
            {progress.open_issues.map(i=><div key={i.id} className="list-item">
              <div style={{flex:1}}><div className="title">{i.title}</div></div>
              <Tag type={i.severity||'P2'}/>
            </div>)}
          </div>}
        </>}
      </div>
    </div>
  </>;
}

// ── 知识库管理（增强版） ──────────────────────────────────────────
function KnowledgeManager() {
  const {data,loading,error,reload} = useFetch(`${API}/knowledge`);
  const [modal,setModal] = React.useState(false);
  const [form,setForm] = React.useState({title:'',content:'',category:'general',tags:''});
  const [indexing,setIndexing] = React.useState(false);
  const [searchQ,setSearchQ] = React.useState('');
  const [searchResults,setSearchResults] = React.useState(null);

  const save = () => {
    fetch(`${API}/knowledge`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...form,tags:form.tags.split(',').map(t=>t.trim()).filter(Boolean)})})
      .then((r) => { if (!r.ok) throw new Error(); })
      .then(()=>{setModal(false);reload();setForm({title:'',content:'',category:'general',tags:''});showToast('知识条目已添加','ok');})
      .catch(()=>showToast('添加失败（请检查标题与内容）','err'));
  };
  const del = (id) => {
    if(!confirm('确认删除？')) return;
    fetch(`${API}/knowledge/${id}`,{method:'DELETE'})
      .then((r) => { if (!r.ok) throw new Error(); })
      .then(()=>{reload();showToast('已删除','ok');})
      .catch(()=>showToast('删除失败','err'));
  };
  const indexCustom = () => {
    setIndexing(true);
    fetch(`${API}/knowledge/index`,{method:'POST'}).then(r=>r.json()).then(d=>{
      setIndexing(false);reload();showToast(`已索引 ${d.count||0} 个文档`,'ok');
    }).catch(()=>{setIndexing(false);showToast('索引失败','err');});
  };
  const doSearch = () => {
    if(!searchQ.trim()) return;
    setSearchResults(null);
    fetch(`${API}/knowledge/search?q=${encodeURIComponent(searchQ)}`).then(r=>r.json()).then(setSearchResults);
  };

  if (loading) return <PageSkeleton cards={4} />;
  if (error) return <LoadError message={error} onRetry={reload} />;

  const items = data||[];
  const cats = {};
  items.forEach(i=>{const c=i.category||'general';(cats[c]||(cats[c]=[])).push(i);});

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="section-title">🗄️ 知识库管理</div>
      <div style={{display:'flex',gap:8}}>
        <RefreshBtn onClick={reload}>{''}</RefreshBtn>
        <button className="btn btn-sm" style={{background:'#334155',color:'#94a3b8'}} onClick={indexCustom} disabled={indexing}>{indexing?'索引中...':'⚡ 索引 custom/'}</button>
        <button className="btn btn-primary btn-sm" onClick={()=>setModal(true)}>+ 添加知识</button>
      </div>
    </div>
    <div style={{display:'flex',gap:8,marginBottom:16}}>
      <input style={{flex:1,background:'#0f172a',border:'1px solid #334155',color:'#e2e8f0',padding:'7px 12px',borderRadius:6,fontSize:13}}
        value={searchQ} onChange={e=>setSearchQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doSearch()} placeholder="语义搜索知识库..."/>
      <button className="btn btn-primary" onClick={doSearch}>搜索</button>
    </div>
    {searchResults&&<div className="card" style={{marginBottom:12}}>
      <div className="section-title">搜索结果 ({searchResults.length})</div>
      {searchResults.length===0?<div className="empty">无结果</div>:searchResults.map((r,i)=><div key={i} className="list-item">
        <div style={{flex:1}}><div className="title">{r.path}</div><div className="meta">{r.content}</div></div>
        <span className="tag tag-p2">{r.category}</span>
      </div>)}
    </div>}
    <div className="grid-4" style={{marginBottom:12}}>
      <div className="card"><h3>文档总数</h3><div className="stat-val">{items.length}</div></div>
      {Object.entries(cats).slice(0,3).map(([c,v])=><div key={c} className="card"><h3>{c}</h3><div className="stat-val">{v.length}</div></div>)}
    </div>
    <div className="card">
      {items.length===0?<div className="empty">知识库为空，点击「索引 custom/」或「添加知识」</div>:
        items.slice(0,100).map(i=><div key={i.id} className="list-item">
          <div style={{flex:1}}>
            <div className="title" style={{fontSize:12}}>{i.path||i.id}</div>
            <div className="meta">{i.content?.slice?.(0,100)}...</div>
          </div>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            <span className="tag tag-p2">{i.category}</span>
            <button className="btn btn-sm" style={{background:'#7f1d1d',color:'#fca5a5',padding:'2px 6px'}} onClick={()=>del(i.id)}>×</button>
          </div>
        </div>)}
    </div>
    {modal&&<div className="modal-bg" onClick={()=>setModal(false)}>
      <div className="modal" style={{width:520}} onClick={e=>e.stopPropagation()}>
        <h3>添加知识</h3>
        <div className="form-group"><label>标题</label><input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="知识标题"/></div>
        <div className="form-group"><label>分类</label>
          <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>
            {['general','specs','examples','design','interaction','daily','rules'].map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
        <div className="form-group"><label>标签（逗号分隔）</label><input value={form.tags} onChange={e=>setForm({...form,tags:e.target.value})} placeholder="java, spring, auth"/></div>
        <div className="form-group"><label>内容</label><textarea value={form.content} onChange={e=>setForm({...form,content:e.target.value})} style={{minHeight:120}} placeholder="知识内容（支持 Markdown）"/></div>
        <div className="modal-actions">
          <button className="btn btn-cancel" onClick={()=>setModal(false)}>取消</button>
          <button className="btn btn-primary" onClick={save}>保存</button>
        </div>
      </div>
    </div>}
  </>;
}

// ── 规范编辑器 ────────────────────────────────────────────────────
function SpecEditor() {
  const {data:files,loading,error,reload} = useFetch(`${API}/specs`);
  const [selected,setSelected] = React.useState(null);
  const [content,setContent] = React.useState('');
  const [editing,setEditing] = React.useState(false);
  const [saving,setSaving] = React.useState(false);

  const open = (f) => {
    setSelected(f);setEditing(false);
    fetch(`${API}/specs/content?path=${encodeURIComponent(f.path)}`).then(r=>r.json()).then(d=>setContent(d.content||''));
  };
  const save = () => {
    setSaving(true);
    fetch(`${API}/specs/content?path=${encodeURIComponent(selected.path)}`,{
      method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})
    }).then((r) => { if (!r.ok) throw new Error(); })
      .then(()=>{setSaving(false);setEditing(false);showToast('规范已保存','ok');})
      .catch(()=>{setSaving(false);showToast('保存失败','err');});
  };

  if (loading) return <PageSkeleton cards={2} />;
  if (error) return <LoadError message={error} onRetry={reload} />;

  const cats = {};
  (files||[]).forEach(f=>{const c=f.category||'root';(cats[c]||(cats[c]=[])).push(f);});

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="section-title">✏️ 规范编辑器</div>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <RefreshBtn onClick={reload}>{''}</RefreshBtn>
        {selected&&!editing&&<button className="btn btn-primary btn-sm" onClick={()=>setEditing(true)}>编辑</button>}
        {editing&&<>
          <button className="btn btn-cancel btn-sm" onClick={()=>setEditing(false)}>取消</button>
          <button className="btn btn-primary btn-sm" onClick={save} disabled={saving}>{saving?'保存中...':'保存'}</button>
        </>}
      </div>
    </div>
    <div className="grid-2">
      <div className="card" style={{maxHeight:640,overflowY:'auto'}}>
        {Object.entries(cats).map(([cat,items])=><div key={cat}>
          <div style={{fontSize:11,color:'#64748b',textTransform:'uppercase',padding:'6px 0 3px',fontWeight:700,borderBottom:'1px solid #1e293b'}}>{cat}</div>
          {items.map(f=><div key={f.path} className="list-item" style={{cursor:'pointer',background:selected?.path===f.path?'#1e3a5f':'',padding:'5px 8px',borderRadius:4}} onClick={()=>open(f)}>
            <div style={{flex:1}}><div className="title" style={{fontSize:12}}>{f.name}</div><div className="meta">{(f.size/1024).toFixed(1)}KB</div></div>
          </div>)}
        </div>)}
      </div>
      <div className="card" style={{maxHeight:640,display:'flex',flexDirection:'column'}}>
        {!selected?<div className="empty">← 选择规范文件</div>:<>
          <div style={{fontSize:11,color:'#64748b',marginBottom:8,padding:'4px 0',borderBottom:'1px solid #334155'}}>{selected.path}</div>
          {editing?
            <textarea value={content} onChange={e=>setContent(e.target.value)}
              style={{flex:1,background:'#0f172a',border:'1px solid #334155',color:'#e2e8f0',padding:10,borderRadius:6,fontSize:12,fontFamily:'monospace',resize:'none',minHeight:500}}/>:
            <pre style={{flex:1,fontSize:12,color:'#e2e8f0',whiteSpace:'pre-wrap',wordBreak:'break-word',overflowY:'auto',lineHeight:1.6}}>{content}</pre>
          }
        </>}
      </div>
    </div>
  </>;
}

// ── 统计分析 ──────────────────────────────────────────────────────
function Analytics() {
  const {data,loading,error,reload} = useFetch(`${API}/analytics`);
  if(loading) return <PageSkeleton cards={4} />;
  if(error || !data) return <LoadError message={error || '暂无统计数据'} onRetry={reload} />;
  const {tasks,requirements,issues,avg_confidence,velocity_trend} = data;

  const Bar = ({label,val,max,color='#3b82f6'}) => {
    const pct = max>0?Math.round(val/max*100):0;
    return <div style={{marginBottom:6}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:2}}>
        <span style={{color:'#94a3b8'}}>{label}</span><span style={{color:'#e2e8f0'}}>{val}</span>
      </div>
      <div className="progress-bar"><div className="progress-fill" style={{width:pct+'%',background:color}}/></div>
    </div>;
  };

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="section-title">📈 统计分析</div>
      <RefreshBtn onClick={reload} />
    </div>
    <div className="grid-4" style={{marginBottom:16}}>
      <div className="card"><h3>任务总数</h3><div className="stat-val">{tasks?.total||0}</div><div className="stat-sub">完成 {tasks?.by_status?.completed||0}</div></div>
      <div className="card"><h3>需求总数</h3><div className="stat-val">{requirements?.total||0}</div><div className="stat-sub">完成 {requirements?.by_status?.done||0}</div></div>
      <div className="card"><h3>待处理问题</h3><div className="stat-val" style={{color:issues?.open?'#fdba74':'#86efac'}}>{issues?.open||0}</div></div>
      <div className="card"><h3>平均置信度</h3><div className="stat-val">{Math.round((avg_confidence||0)*100)}%</div><ConfBar val={avg_confidence||0}/></div>
    </div>
    <div className="grid-2">
      <div className="card">
        <div className="section-title">任务状态分布</div>
        {Object.entries(tasks?.by_status||{}).map(([k,v])=><Bar key={k} label={k} val={v} max={tasks?.total||1} color={k==='completed'?'#22c55e':k==='blocked'?'#ef4444':'#3b82f6'}/>)}
      </div>
      <div className="card">
        <div className="section-title">问题类型分布</div>
        {Object.entries(issues?.by_type||{}).map(([k,v])=><Bar key={k} label={k} val={v} max={issues?.total||1} color='#f59e0b'/>)}
        <div className="section-title" style={{marginTop:12}}>需求优先级分布</div>
        {Object.entries(requirements?.by_priority||{}).map(([k,v])=><Bar key={k} label={k} val={v} max={requirements?.total||1} color={k==='P0'?'#ef4444':k==='P1'?'#f59e0b':'#3b82f6'}/>)}
      </div>
    </div>
    {velocity_trend?.length>0&&<div className="card" style={{marginTop:12}}>
      <div className="section-title">速度趋势（近5迭代）</div>
      <div style={{display:'flex',gap:8,alignItems:'flex-end',height:80,padding:'0 8px'}}>
        {velocity_trend.map(s=>{
          const maxV=Math.max(...velocity_trend.map(x=>x.planned||1));
          const h=Math.max(8,Math.round((s.velocity/maxV)*70));
          const hp=Math.max(4,Math.round((s.planned/maxV)*70));
          return <div key={s.id} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
            <div style={{width:'100%',display:'flex',gap:2,alignItems:'flex-end',height:72}}>
              <div style={{flex:1,background:'#3b82f6',borderRadius:'2px 2px 0 0',height:h+'px'}} title={`实际:${s.velocity}`}/>
              <div style={{flex:1,background:'#334155',borderRadius:'2px 2px 0 0',height:hp+'px'}} title={`计划:${s.planned}`}/>
            </div>
            <div style={{fontSize:10,color:'#64748b'}}>{s.id?.replace('SPRINT-','S')}</div>
          </div>;
        })}
      </div>
      <div style={{fontSize:11,color:'#64748b',marginTop:4}}>■ 实际 □ 计划</div>
    </div>}
  </>;
}

/** Babel Standalone 对外部 src 的 text/babel 脚本编译可能是异步的；须等 pages/*.js 注册完全局组件后再构建 ALL_PAGES，否则 ReferenceError 白屏。 */
function waitForPageModules(done) {
  var names = ['AgentManager','SkillManager','McpManager','SystemManager','AuthManager','ModelManager','OrchestrationManager','DockerEnvManager','SkillRepoManager','VibeCoding','NotifyManager','CliManager'];
  var tries = 0;
  function tick() {
    var missing = names.filter(function (n) { return typeof window[n] !== 'function'; });
    if (!missing.length) { done(); return; }
    tries++;
    if (tries > 300) {
      var el = document.getElementById('root');
      if (el) el.innerHTML = '<div style="padding:28px;font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;background:#1e293b;border:1px solid #334155;border-radius:12px;color:#e2e8f0;"><h2 style="margin:0 0 12px;font-size:18px;color:#fca5a5;">页面模块未加载完成</h2><p style="color:#94a3b8;font-size:14px;line-height:1.6;">以下全局组件仍不可用（常见于脚本顺序或 Babel 编译延迟）：</p><pre style="background:#0f172a;padding:12px;border-radius:8px;font-size:12px;color:#fbbf24;overflow:auto;margin:12px 0;white-space:pre-wrap;">' + missing.join(', ') + '</pre><p style="color:#64748b;font-size:13px;">请强制刷新 (Cmd+Shift+R) 或打开开发者工具查看控制台错误。</p></div>';
      return;
    }
    setTimeout(tick, 16);
  }
  tick();
}

    {id:'knowledge-mgr',icon:'🗄️',label:'知识库'},

    {id:'skill-repo',icon:'📦',label:'技能仓库'},
    {id:'models',icon:'🧠',label:'模型配置'},
    {id:'orchestration',icon:'🔀',label:'编排工作流'},
    {id:'mcp',icon:'🔌',label:'MCP Server'},
    {id:'logs',icon:'📡',label:'Agent 日志'},
  ]},
  { label: '系统设置', items: [

  issues:<Issues/>,search:<Search/>,vibe:<VibeCoding/>,'spec-editor':<SpecEditor/>,

function AppV3() {
  const [tab, setTab] = React.useState('dashboard');
  const [theme, setTheme] = React.useState(() => localStorage.getItem('theme') || 'dark');
  const [collapsed, setCollapsed] = React.useState(false);
  const [projectId, setProjectId] = React.useState('');
  const [toasts, setToasts] = React.useState([]);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : '');
    localStorage.setItem('theme', theme);
  }, [theme]);

  React.useEffect(() => {
    fetch(`${API}/state`).then(r=>r.json()).then(d=>{ if(d.project_id) setProjectId(d.project_id); }).catch(()=>{});
  }, []);

  React.useEffect(() => {
    const onToast = (e) => {
      const { message, type } = e.detail || {};
      if (!message) return;
      const id = Date.now() + Math.random();
      setToasts((t) => [...t, { id, message, type }]);
      setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3400);
    };
    window.addEventListener('devdash-toast', onToast);
    return () => window.removeEventListener('devdash-toast', onToast);
  }, []);

  const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

          {g.items.map(item => <div key={item.id}
            role="button"
            tabIndex={0}
            className={`sidebar-item${tab===item.id?' active':''}`}
            onClick={()=>setTab(item.id)}
            onKeyDown={(e)=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); setTab(item.id);} }}

            <span className="sidebar-icon">{item.icon}</span>
            <span>{item.label}</span>

}

  var _rootEl = document.getElementById('root');

      ReactDOM.createRoot(_rootEl).render(<AppV3/>);
    } else {
      ReactDOM.render(<AppV3/>, _rootEl);
    }
  }
}

waitForPageModules(mountApp);
</script>
